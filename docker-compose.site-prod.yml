# =====================================================================
# 사용자 웹을 운영 방식으로 (v10.74 · 2026-10-23) — docker-compose.yml 에 덧붙이는 파일
#
#   개발 방식(next dev)은 화면을 처음 열 때 그 자리에서 만들고, 부하 속에서 스스로 다시 켜집니다.
#   운영(deploy/aws/run-site.sh)은 미리 빌드(next build)한 뒤 next start 로 띄웁니다. 이 파일은 점검판을 운영과 같게 합니다.
#
#   쓰는 법: SITE_MODE=prod ~/sgb-check.sh 갈래 [up]
#            (kit 의 .env 에 COMPOSE_FILE=docker-compose.yml:docker-compose.site-prod.yml 을 적습니다)
#
#   · 빌드는 컨테이너가 켜질 때 합니다(API 가 준비된 뒤 · 몇 분). 빌드가 실패하면 사용자 웹이 뜨지 않습니다
#     — 운영 빌드도 실패한다는 뜻이므로 realcheck [8] 에서 실패로 드러납니다.
#   · 개발 방식에서 건너뛰던 타입 검사 · 린트도 next build 가 합니다(운영과 같음).
# =====================================================================
services:
  site:
    command: ["sh", "-c", "npx next build && exec npx next start -H 0.0.0.0 -p 5174"]
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5174/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      start_period: 900s
      retries: 4
