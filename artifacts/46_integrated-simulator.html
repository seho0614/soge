<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}</style></head><body>
<title>소개뱅크 통합 시뮬레이터</title>
<style>
  :root{
    --brand:#7C3AED; --svc:#2563EB; --act:#F97316;
    --mny:#2563EB; --mal:#059669; --biz:#D97706;
    --navy:#1E293B; --ink:#0F172A; --mut:#64748B; --line:#E2E8F0;
    --page:#F7F8FA; --ok:#059669; --warn:#D97706; --err:#DC2626;
    --shellbg:#0B1220; --shellcard:#141E33; --shellline:#22314F; --shelltxt:#CBD5E1;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--shellbg);color:var(--ink);
    font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
    font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer}

  /* ---------- 셸 레이아웃 ---------- */
  .shell{display:grid;grid-template-rows:auto 1fr;height:100vh;overflow:hidden}
  .top{display:flex;align-items:center;gap:14px;padding:0 16px;height:54px;
    background:var(--shellcard);border-bottom:1px solid var(--shellline);color:#fff;flex-wrap:nowrap}
  .brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;letter-spacing:-.3px;white-space:nowrap}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 3px rgba(124,58,237,.25)}
  .brand .v{font-size:10px;font-weight:700;color:#94A3B8;background:#0B1220;border:1px solid var(--shellline);
    border-radius:5px;padding:2px 6px;letter-spacing:.4px}
  .tabs{display:flex;gap:4px;background:#0B1220;border:1px solid var(--shellline);border-radius:9px;padding:3px}
  .tabs button{background:transparent;border:0;color:#94A3B8;font-size:12.5px;font-weight:600;
    padding:6px 12px;border-radius:6px;white-space:nowrap}
  .tabs button.on{background:var(--brand);color:#fff}
  .top .sp{flex:1}
  .rolebox{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--shelltxt);white-space:nowrap}
  .rb{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff}
  .rb.ref{background:var(--brand)} .rb.seek{background:var(--svc)}
  .rb.part{background:var(--mal)} .rb.adm{background:var(--navy);border:1px solid #475569} .rb.sys{background:#64748B}
  .tgl{background:#0B1220;border:1px solid var(--shellline);color:#94A3B8;border-radius:7px;
    padding:6px 10px;font-size:12px;font-weight:600}
  .tgl.on{color:#fff;border-color:var(--brand)}

  .body{display:grid;grid-template-columns:292px 1fr 328px;min-height:0;height:100%}
  .body.nor{grid-template-columns:292px 1fr}
  .rail,.insp{background:var(--shellcard);overflow-y:auto;min-height:0}
  .rail{border-right:1px solid var(--shellline)}
  .insp{border-left:1px solid var(--shellline)}
  .stage{background:var(--page);min-width:0;position:relative;overflow:hidden}
  .frames{position:absolute;inset:0}
  .frames iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;background:var(--page);
    opacity:0;pointer-events:none;transform-origin:0 0}
  .frames iframe.on{opacity:1;pointer-events:auto}

  /* ---------- 레일 ---------- */
  .rhd{padding:13px 14px 9px;border-bottom:1px solid var(--shellline)}
  .rhd h2{margin:0 0 3px;font-size:12.5px;font-weight:800;color:#fff;letter-spacing:-.2px}
  .rhd p{margin:0;font-size:11px;color:#64748B;line-height:1.5}
  .modesw{display:flex;gap:3px;margin:10px 14px 0;background:#0B1220;border:1px solid var(--shellline);
    border-radius:8px;padding:3px}
  .modesw button{flex:1;background:transparent;border:0;color:#94A3B8;font-size:11.5px;font-weight:700;
    padding:6px 4px;border-radius:5px}
  .modesw button.on{background:#22314F;color:#fff}

  .ctrl{display:flex;gap:5px;padding:11px 14px;border-bottom:1px solid var(--shellline)}
  .ctrl button{flex:1;background:#0B1220;border:1px solid var(--shellline);color:var(--shelltxt);
    border-radius:7px;padding:7px 2px;font-size:11px;font-weight:700;white-space:nowrap;letter-spacing:-.3px}
  .ctrl button#bPlay{flex:1.5} .ctrl button#bReset{flex:.5}
  .ctrl button:hover{border-color:#475569;color:#fff}
  .ctrl button.pri{background:var(--brand);border-color:var(--brand);color:#fff}
  .ctrl button:disabled{opacity:.35;cursor:default}
  .prog{height:3px;background:#0B1220}
  .prog i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--svc));
    transition:width .35s ease}

  .steps{padding:8px 10px 20px}
  .step{display:grid;grid-template-columns:26px 1fr;gap:9px;padding:9px 8px;border-radius:9px;
    cursor:pointer;border:1px solid transparent}
  .step:hover{background:#0B1220}
  .step.on{background:#1B2947;border-color:var(--brand)}
  .step.done .num{background:var(--ok);border-color:var(--ok);color:#fff}
  .num{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;
    font-weight:800;color:#94A3B8;background:#0B1220;border:1px solid var(--shellline)}
  .step.on .num{background:var(--brand);border-color:var(--brand);color:#fff}
  .stx b{display:block;font-size:12.5px;font-weight:700;color:#E2E8F0;letter-spacing:-.2px}
  .step.on .stx b{color:#fff}
  .stx span{display:block;font-size:10.5px;color:#64748B;margin-top:2px}
  .stx .sid{font-family:ui-monospace,Menlo,monospace;font-size:9.5px;color:#475569;letter-spacing:.2px}

  .grp{padding:12px 14px 4px;font-size:10px;font-weight:800;color:#475569;letter-spacing:.7px;text-transform:uppercase}
  .lnk{display:flex;align-items:center;gap:8px;padding:7px 12px;margin:0 8px;border-radius:7px;cursor:pointer}
  .lnk:hover{background:#0B1220}
  .lnk.on{background:#1B2947;color:#fff}
  .lnk .t{flex:1;font-size:12px;color:#CBD5E1}
  .lnk.on .t{color:#fff;font-weight:700}
  .lnk .c{font-family:ui-monospace,Menlo,monospace;font-size:9px;color:#475569}

  /* ---------- 인스펙터 ---------- */
  .ihd{padding:13px 14px 9px;border-bottom:1px solid var(--shellline);
    display:flex;align-items:center;justify-content:space-between}
  .ihd h2{margin:0;font-size:12.5px;font-weight:800;color:#fff}
  .sec{padding:12px 14px;border-bottom:1px solid var(--shellline)}
  .sec h3{margin:0 0 9px;font-size:10px;font-weight:800;color:#475569;letter-spacing:.7px;text-transform:uppercase}
  .note{background:#0B1220;border:1px solid var(--shellline);border-left:3px solid var(--brand);
    border-radius:0 8px 8px 0;padding:10px 11px;font-size:11.5px;color:#94A3B8;line-height:1.65}
  .note b{color:#E2E8F0}
  .note code{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;background:#1B2947;
    padding:1px 5px;border-radius:4px;color:#C4B5FD}

  .ent{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed #1B2947}
  .ent:last-child{border-bottom:0}
  .ent .n{width:74px;font-size:11px;color:#64748B;flex:none}
  .ent .v{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;font-weight:700;
    padding:2px 7px;border-radius:5px;background:#0B1220;color:#94A3B8;border:1px solid var(--shellline)}
  .ent .v.a{background:rgba(37,99,235,.16);color:#93C5FD;border-color:rgba(37,99,235,.4)}
  .ent .v.g{background:rgba(5,150,105,.16);color:#6EE7B7;border-color:rgba(5,150,105,.4)}
  .ent .v.w{background:rgba(217,119,6,.16);color:#FCD34D;border-color:rgba(217,119,6,.4)}
  .ent .d{font-size:10px;color:#475569;margin-left:auto;text-align:right}

  .inv{display:flex;align-items:flex-start;gap:7px;padding:5px 0;font-size:11px;color:#64748B;line-height:1.5}
  .inv i{font-style:normal;width:14px;flex:none;text-align:center;font-size:10px}
  .inv.pass{color:#6EE7B7} .inv.wait{color:#475569} .inv.hold{color:#FCD34D}

  .money{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:11.5px}
  .money .k{color:#64748B} .money .v{text-align:right;font-family:ui-monospace,Menlo,monospace;color:#CBD5E1}
  .money .tot .k,.money .tot .v{font-weight:800;color:#fff;padding-top:6px;border-top:1px solid var(--shellline)}

  .log{padding:2px 0;max-height:230px;overflow-y:auto}
  .lrow{display:grid;grid-template-columns:20px 1fr;gap:8px;padding:6px 0;border-bottom:1px dashed #1B2947}
  .lrow:last-child{border-bottom:0}
  .lrow .t{font-size:11px;color:#94A3B8;line-height:1.5}
  .lrow .t b{color:#E2E8F0}
  .empty{font-size:11px;color:#475569;padding:8px 0}

  /* ---------- 반응형 ---------- */
  @media (max-width:1280px){ .body{grid-template-columns:270px 1fr} .insp{display:none} .insp.force{display:block} }
  @media (max-width:980px){
    .body{grid-template-columns:1fr;grid-template-rows:auto 1fr}
    .rail{border-right:0;border-bottom:1px solid var(--shellline);max-height:200px}
    .top{height:auto;padding:8px 12px;flex-wrap:wrap;gap:8px}
  }
</style>

<div class="shell">
  <header class="top">
    <span class="brand"><span class="dot"></span>소개뱅크 통합 시뮬레이터<span class="v">v1.0</span></span>
    <div class="tabs" id="tabs"></div>
    <span class="sp"></span>
    <span class="rolebox" id="rolebox"></span>
    <button class="tgl" id="tgInsp">상태 패널</button>
  </header>
  <div class="body" id="body">
    <aside class="rail">
      <div class="rhd">
        <h2 id="railTitle">등록 → 검수 → 노출 → 매칭 → 성사 → 정산</h2>
        <p id="railSub">22단계 · 4개 앱 39화면을 하나의 거래로 관통합니다.</p>
      </div>
      <div class="modesw">
        <button id="mScn" class="on">시나리오</button>
        <button id="mMap">전체 화면</button>
      </div>
      <div class="ctrl" id="ctrl">
        <button id="bPrev">◀ 이전</button>
        <button id="bPlay" class="pri">▶ 자동 재생</button>
        <button id="bNext">다음 ▶</button>
        <button id="bReset">↺</button>
      </div>
      <div class="prog"><i id="progBar" style="width:0%"></i></div>
      <div id="rail"></div>
    </aside>
    <div class="stage">
      <div class="frames" id="frames"></div>
    </div>
    <aside class="insp" id="insp">
      <div class="ihd"><h2>상태 인스펙터</h2><span id="stageChip" class="lnk c"></span></div>
      <div class="sec"><h3>지금 무슨 일이 일어나는가</h3><div class="note" id="note"></div></div>
      <div class="sec"><h3>엔티티 상태</h3><div id="ents"></div></div>
      <div class="sec"><h3>불변식 검증</h3><div id="invs"></div></div>
      <div class="sec"><h3>정산 금액</h3><div class="money" id="money"></div></div>
      <div class="sec"><h3>이벤트 로그</h3><div class="log" id="log"></div></div>
    </aside>
  </div>
</div>

  /* ---------- 상태 ---------- */
  var i=0, mode="scn", playing=false, timer=null, speed=2600;
  var cur={app:"user", screen:"reg"};
  var S, LOG;
  function fresh(){ return {gwan:"—", member:"미가입", listing:"DRAFT", intro:false, deal:"—", sign:0, cf:0,
    settle:"—", escrow:"—", done:false}; }
  function rebuild(){
    S=fresh(); LOG=[];
    for(var k=0;k<=i;k++){
      STEPS[k].apply(S);
      if(STEPS[k].log) LOG.unshift(STEPS[k].log);
      if(STEPS[k].log2) LOG.unshift(STEPS[k].log2);
    }
  }

  /* ---------- 그리기 ---------- */
  function drawTabs(){
    $("#tabs").innerHTML=APPS.map(function(a){
      return '<button data-app="'+a.k+'"'+(cur.app===a.k?' class="on"':'')+'>'+esc(a.n)+'</button>';
    }).join("");
  }
  function drawRail(){
    if(mode==="scn"){
      $("#ctrl").style.display=""; $("#railTitle").textContent="등록 → 검수 → 노출 → 매칭 → 성사 → 정산";
      $("#railSub").textContent="22단계 · 4개 앱 39화면을 하나의 거래로 관통합니다.";
      $("#rail").innerHTML='<div class="steps">'+STEPS.map(function(s,n){
        var c="step"+(n===i?" on":"")+(n<i?" done":"");
        return '<div class="'+c+'" data-step="'+n+'"><div class="num">'+(n<i?"✓":(n+1))+'</div>'+
          '<div class="stx"><b>'+esc(s.t)+'</b><span>'+esc(s.stage)+' · '+esc(ROLE[s.role].n)+'</span>'+
          '<span class="sid">'+esc(s.sid)+'</span></div></div>';
      }).join("")+'</div>';
      $("#progBar").style.width=Math.round((i+1)/STEPS.length*100)+"%";
    } else {
      $("#ctrl").style.display="none"; $("#railTitle").textContent="전체 화면 목록";
      $("#railSub").textContent="39화면 · 자유 탐색 모드입니다.";
      $("#rail").innerHTML=MAP.map(function(g){
        return '<div class="grp">'+esc(g.g)+'</div>'+g.items.map(function(it){
          var on=(cur.app===g.app && cur.screen===it[0]);
          return '<div class="lnk'+(on?" on":"")+'" data-app="'+g.app+'" data-scr="'+it[0]+'">'+
            '<span class="t">'+esc(it[1])+'</span><span class="c">'+esc(it[2])+'</span></div>';
        }).join("");
      }).join("")+'<div style="height:24px"></div>';
      $("#progBar").style.width="0%";
    }
    $("#bPrev").disabled=(i===0); $("#bNext").disabled=(i===STEPS.length-1);
  }
  function drawRole(){
    var r=(mode==="scn")?ROLE[STEPS[i].role]:{n:"자유 탐색",s:"·"};
    var c=(mode==="scn")?STEPS[i].role:"sys";
    $("#rolebox").innerHTML='<span class="rb '+c+'">'+esc(r.s)+'</span>'+esc(r.n);
  }
  function drawInsp(){
    var st=(mode==="scn")?STEPS[i]:null;
    $("#stageChip").textContent=st?st.stage:"";
    $("#note").innerHTML=st?st.note:
      "자유 탐색 모드입니다. 왼쪽 목록에서 화면을 직접 열 수 있고, 아래 상태는 마지막으로 진행한 시나리오 단계 기준입니다.";

    function ent(n,v,cls,d){
      return '<div class="ent"><span class="n">'+esc(n)+'</span><span class="v '+cls+'">'+esc(v)+
        '</span><span class="d">'+esc(d)+'</span></div>';
    }
    var lc=S.listing==="LIVE"?"g":(S.listing==="PENDING"?"w":"");
    var dc=(S.deal==="CONFIRMED")?"g":(S.deal==="—"?"":"a");
    var sc=(S.settle==="PAID")?"g":(S.settle==="—"?"":"a");
    $("#ents").innerHTML=
      ent("관(Site)", S.gwan, S.gwan==="—"?"":"g", "설정 스냅샷")+
      ent("회원", S.member, S.member==="승인 완료"?"g":(S.member==="심사 중"?"w":""), "사업자 전용")+
      ent("Listing", S.listing, lc, "L-2044")+
      ent("Attribution", S.intro?DEAL.code:"미귀속", S.intro?"g":"", S.intro?"first-touch":"유입 전")+
      ent("Deal", S.deal, dc, "#"+DEAL.id)+
      ent("서명", S.sign+" / 2", S.sign===2?"g":"", "양측 서명")+
      ent("성사 확인", S.cf+" / 2", S.cf===2?"g":(S.cf===1?"w":""), "INV-4")+
      ent("에스크로", S.escrow, S.escrow==="—"?"":"", "관 기준")+
      ent("Settlement", S.settle, sc, "ST-"+DEAL.id);

    var INV=[
      ["INV-1","tier = 1 고정 · 다단계 없음", true, "pass"],
      ["INV-2","소개코드 first-touch 귀속", S.intro, S.intro?"pass":"wait"],
      ["INV-3","CONFIRMED 이후에만 정산 생성", S.settle!=="—", (S.settle!=="—")?"pass":(S.cf===2?"hold":"wait")],
      ["INV-4","성사는 양측 확인 필수", S.cf===2, S.cf===2?"pass":(S.cf===1?"hold":"wait")],
      ["INV-5","후기는 Deal에 종속", S.deal==="CONFIRMED"||S.done, (S.deal==="CONFIRMED"||S.done)?"pass":"wait"],
      ["INV-6","제한업종 API 응답 제외", S.listing!=="DRAFT", (S.listing!=="DRAFT")?"pass":"wait"],
      ["INV-7","사업자 · 중개사 인증 게이트", S.listing!=="DRAFT", (S.listing!=="DRAFT")?"pass":"wait"]
    ];
    $("#invs").innerHTML=INV.map(function(v){
      var ic=v[3]==="pass"?"✓":(v[3]==="hold"?"!":"·");
      return '<div class="inv '+v[3]+'"><i>'+ic+'</i><span><b>'+esc(v[0])+'</b> · '+esc(v[1])+'</span></div>';
    }).join("");

    var paid=(S.settle==="PAID");
    $("#money").innerHTML=
      '<span class="k">거래금액</span><span class="v">'+won(DEAL.amount)+'</span>'+
      '<span class="k">요율 · 상한</span><span class="v">1.5% · '+won(DEAL.cap)+'</span>'+
      '<span class="k">소개비</span><span class="v">'+won(FEE)+'</span>'+
      '<span class="k">원천징수 3.3%</span><span class="v">− '+won(TAX)+'</span>'+
      '<span class="k tot">'+(paid?"지급 완료":"실지급 예정")+'</span><span class="v tot">'+won(NET)+'</span>';

    $("#log").innerHTML=LOG.length?LOG.map(function(l){
      return '<div class="lrow"><span class="rb '+l[0]+'">'+esc(ROLE[l[0]].s)+'</span>'+
        '<span class="t">'+l[1]+'</span></div>';
    }).join(""):'<div class="empty">아직 발생한 이벤트가 없습니다.</div>';
  }
  function render(){ drawRail(); drawRole(); drawInsp(); drawTabs(); }

  function goStep(n){
    i=Math.max(0,Math.min(STEPS.length-1,n));
    rebuild();
    var s=STEPS[i];
    show(s.app, s.scr, s.patch);
    render();
  }

  /* ---------- 자동 재생 ---------- */
  function stop(){ playing=false; clearTimeout(timer); $("#bPlay").textContent="▶ 자동 재생"; }
  function tick(){
    if(!playing) return;
    if(i>=STEPS.length-1){ stop(); return; }
    goStep(i+1);
    timer=setTimeout(tick, speed);
  }
  $("#bPlay").addEventListener("click", function(){
    if(playing){ stop(); return; }
    if(mode!=="scn"){ mode="scn"; $("#mScn").classList.add("on"); $("#mMap").classList.remove("on"); }
    if(i>=STEPS.length-1) goStep(0);
    playing=true; this.textContent="⏸ 일시정지";
    timer=setTimeout(tick, speed);
  });
  $("#bNext").addEventListener("click", function(){ stop(); goStep(i+1); });
  $("#bPrev").addEventListener("click", function(){ stop(); goStep(i-1); });
  $("#bReset").addEventListener("click", function(){ stop(); goStep(0); });

  $("#mScn").addEventListener("click", function(){
    mode="scn"; this.classList.add("on"); $("#mMap").classList.remove("on"); goStep(i);
  });
  $("#mMap").addEventListener("click", function(){
    stop(); mode="map"; this.classList.add("on"); $("#mScn").classList.remove("on"); render();
  });

  $("#rail").addEventListener("click", function(e){
    var st=e.target.closest("[data-step]");
    if(st){ stop(); goStep(Number(st.getAttribute("data-step"))); return; }
    var lk=e.target.closest("[data-app][data-scr]");
    if(lk){ show(lk.getAttribute("data-app"), lk.getAttribute("data-scr")); render(); }
  });
  $("#tabs").addEventListener("click", function(e){
    var b=e.target.closest("[data-app]"); if(!b) return;
    stop(); mode="map"; $("#mMap").classList.add("on"); $("#mScn").classList.remove("on");
    var app=b.getAttribute("data-app");
    var first=MAP.filter(function(g){return g.app===app;})[0];
    show(app, first?first.items[0][0]:null); render();
  });
  $("#tgInsp").addEventListener("click", function(){
    var el=$("#insp"), on=el.classList.toggle("force");
    $("#body").classList.toggle("nor", !on && window.innerWidth>1280);
    this.classList.toggle("on", on);
  });
  document.addEventListener("keydown", function(e){
    if(e.key==="ArrowRight"){ stop(); goStep(i+1); }
    if(e.key==="ArrowLeft"){ stop(); goStep(i-1); }
    if(e.key===" "){ e.preventDefault(); $("#bPlay").click(); }
  });

  /* 임베드 앱이 자체 내비게이션했을 때 좌측 목록 동기화 */
  window.addEventListener("message", function(ev){
    var d=ev.data||{}; if(d.t!=="nav") return;
    for(var k in frames){ if(frames[k].contentWindow===ev.source){ cur.app=k; cur.screen=d.k; } }
    if(mode==="map") drawRail();
  });

  goStep(0);
  fit(); setTimeout(fit,400); setTimeout(fit,1200);
})();
</script>

</body></html>
