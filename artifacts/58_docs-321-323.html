<script>
const DOCS=[{"id": "proc", "name": "운영 반영 절차서", "who": "적용하는 사람(ubuntu)", "file": "321_운영반영절차서_공통_v10.202_20261106.md", "md": "# 321. 운영 반영 절차서 (공통) — v10.202 기준 (2026-11-06)\n\n> 새 판을 운영 서버에 올릴 때 **매번 같은 순서**를 이 문서 하나에 모았습니다.\n> - 판마다 쓰는 절차서(예: docs/317 · docs/320)에는 이제 **그 판에서 다른 것만** 적습니다 — 킷 이름 · sha · 마이그레이션 · 기대 줄 · 적용 뒤 화면 확인 · 되돌릴 때 남는 것(8절).\n> - 하는 사람: **ubuntu 사용자(사람)**. 대표 승인 뒤에 합니다. Claude(sgbdev)는 킷 · 판별 절차서만 만들고, 운영 서버 · 운영 DB 에는 손대지 않습니다.\n> - 이 문서는 docs/25(배포 운영 절차서 · 9/4) · 소개뱅크_로컬점검_AWS적용절차_v10.35 의 적용 부분을 대신합니다. 서버를 처음 만드는 일은 `소개뱅크_AWS구축절차서_v2_5.md` 그대로입니다.\n\n## 1. 한눈에\n\n| 단계 | 어디서 | 무엇 | 걸리는 시간 |\n|---|---|---|---|\n| 3-0 | 운영 서버(ubuntu) | 지금 판 · 프로세스 · 판 보관 폴더 · 디스크 확인(읽기만) | 1분 |\n| 3-1 | 집 PC(PowerShell) | 개발 서버에서 킷 받기 → sha 확인 → 운영 서버로 올리기 | 3분 |\n| 3-1 ② | 운영 서버 | 킷 풀기 → 적용 전 점검(precheck) | 2분 |\n| 3-2 | AWS 콘솔 | **RDS 스냅샷**(마이그레이션이 있는 판은 꼭) | 5 ~ 10분 |\n| 3-3 | 운영 서버 | 적용(apply) → 적용 후 확인(postcheck)이 이어서 돎 | 5 ~ 20분 |\n| 3-4 | 운영 서버 | 킷 지우기 · 디스크 확인 | 1분 |\n| 4 | PC 브라우저 | 판별 절차서의 화면 확인 | 5분 |\n\n**한 블록씩 칩니다.** 앞 블록 결과를 보고(필요하면 Claude 에게 보내고) 다음 블록으로 갑니다. 되돌리기 명령은 6절에만 있습니다 — 적용 블록과 함께 치지 않습니다(11/4 운영에서 적용 대신 rollback 이 실행된 일이 있었음).\n\n## 2. 준비물\n\n| 항목 | 값 |\n|---|---|\n| 운영 서버 | `ubuntu@3.37.95.217` · 열쇠 `C:\\sgb_key\\sgb-key.pem` |\n| 개발 서버 별칭 | `sgb-dev`(집 PC `~/.ssh/config`) — 킷은 `~/kits/release/` 에만 있음(`~/kits/out` 은 점검이 덮어쓰므로 쓰지 않음) |\n| 킷 | `SGB_DevDocker_Integrated_20261002_v10_<판>.zip`(판별 절차서 1절에 이름 · sha256) |\n| 집 PC 폴더 | `C:\\sgb\\` |\n| AWS 콘솔 | RDS › 데이터베이스 `sgb-db` 에 스냅샷을 만들 수 있는 계정 |\n| 운영 화면 | SUPER 계정(적용 뒤 화면 확인 · 스위치 조작) |\n\n## 3. 순서\n\n### 3-0. 운영 판 확인 (ubuntu · 읽기만)\n\n```bash\ncat ~/sgb/VERSION\npm2 ls\nls ~/sgb-releases\ndf -h / | tail -1\n```\n\n| 줄 | 맞으면 |\n|---|---|\n| VERSION | 판별 절차서에 적힌 「지금 운영 판」 |\n| pm2 ls | `sgb` · `sgb-site` · `sgb-jobs` 3개 `online` |\n| ls ~/sgb-releases | 판 폴더 2개(지금 판 · 직전 판) |\n| df | 여유 3GB 이상 |\n\n다르면 멈추고 출력을 Claude 에게 보냅니다.\n\n### 3-1. 킷 받기 · 올리기 (집 PC PowerShell)\n\n```powershell\nscp sgb-dev:~/kits/release/<킷 이름>.zip C:\\sgb\\\ncertutil -hashfile C:\\sgb\\<킷 이름>.zip SHA256\nscp -i C:\\sgb_key\\sgb-key.pem C:\\sgb\\<킷 이름>.zip ubuntu@3.37.95.217:~/\n```\n\n- certutil 값이 판별 절차서의 zip sha256 과 **글자 하나까지 같아야** 합니다. 다르면 세 번째 줄을 치지 않고 멈춥니다.\n- 마지막 줄이 100% 로 끝나면 됩니다.\n\n### 3-1 ②. 풀기 · 적용 전 점검 (ubuntu)\n\n```bash\ncd ~ && unzip -q -o <킷 이름>.zip\ncat ~/<킷 이름>/sgb/VERSION\nbash ~/<킷 이름>/sgb/deploy/aws/precheck.sh\n```\n\nprecheck 는 **읽기만** 합니다(아무것도 바꾸지 않음). 볼 줄:\n\n| 칸 | 맞으면 | 다르면 |\n|---|---|---|\n| 맨 끝 | `통과 N · 실패 0 · 확인 0` | 실패가 있으면 멈춤 |\n| [5] 마이그레이션 | `적용됨 A · 새 킷의 파일 B · 올릴 것 B−A · 바뀐 파일 0` — 판별 절차서의 수와 같음 | 「바뀐 파일」이 0 이 아니면 **적용 금지**(이미 올린 파일이 바뀐 킷) |\n| [5] 올릴 것 | 판별 절차서의 마이그레이션 이름과 같음 | 다르면 멈춤 |\n| [4] 판 보관 폴더 | 지금 판 · 직전 판 · **「되돌린 상태」 줄 없음** | 「되돌린 상태」가 나오면 멈춤(6-3) |\n| [6] Nginx | 「sgb 따로 있는 파일」 · 「사용자 웹 — 누구나 열림 · 운영 화면 — 허용 IP 만」 | 다르면 멈춤 |\n| [1] aws CLI 없음 | 정보 줄(지금 운영은 aws CLI 를 쓰지 않음) | — |\n\n### 3-2. RDS 스냅샷 (마이그레이션이 있는 판은 꼭)\n\n```\nAWS 콘솔 → RDS → 데이터베이스 → sgb-db → 작업 → 스냅샷 생성\n→ 이름: sgb-before-v10-<판>-<YYYYMMDD>   (예: sgb-before-v10-202-20261106)\n→ 상태가 「사용 가능」이 될 때까지 기다림\n```\n\n- [ ] 목록에 있음 · [ ] 「사용 가능」 · [ ] 만든 시각이 3-1 ② precheck 뒤\n- 마이그레이션이 없는 판도 apply 는 스냅샷을 묻지 않지만, 큰 판이면 만들어 두는 편이 안전합니다.\n- 스냅샷은 DB 만 담습니다. **올린 파일(uploads)은 들어가지 않습니다** — 매일 04:30 `uploads-backup.sh` 묶음이 따로 있음.\n\n### 3-3. 적용 (ubuntu)\n\n```bash\nbash ~/<킷 이름>/sgb/deploy/aws/apply.sh\n```\n\napply 가 하는 일(앞 단계가 실패하면 거기서 멈추고, **돌던 서비스는 그대로 돕니다**):\n\n| 단계 | 내용 | 서비스 |\n|---|---|---|\n| [0] 전제 확인 | Node 22 · 메모리 · 디스크 · DB 접속 · 바뀐 마이그레이션 0 · 되돌린 상태 아님 | 그대로 |\n| [1] 새 판 놓기 | `~/sgb-releases/<판>_<시각>/` 에 복사 · 지금 `.env` 를 가져옴 | 그대로 |\n| [2] 설치 · 빌드 | API · 사용자 웹(2분쯤) · 운영 화면 | 그대로 |\n| [3] DB 마이그레이션 | 올릴 것을 보여 주고 **「RDS 스냅샷을 방금 만들었습니까?」** → `yes` 일 때만 적용 | 그대로 |\n| [4] 배포 점검 | 타입 · 마이그레이션 · 불변식 · 미확인 CRITICAL 경보 · 라우트 — 「배포 가능」 | 그대로 |\n| [5] 교체 | `~/sgb` 를 새 판으로 돌리고 pm2 3개 다시 등록 | **몇 초 끊김** |\n| [6] 기동 확인 | API · 사이트가 안 뜨면 **전 판으로 저절로 복귀** · 뜨면 옛 판 1개 정리(지금 · 직전 판만 남김) | — |\n| [7] postcheck | 적용 후 확인이 이어서 돎 | — |\n\n- 스냅샷 물음은 **화면에 나온 뒤에** `yes` 를 칩니다. 미리 치지 않습니다.\n- `ASSUME_YES=1` 은 리허설 전용입니다. 운영에서는 쓰지 않습니다(스냅샷 물음을 건너뜀).\n\n### 3-4. 적용 후 정리 (ubuntu)\n\n```bash\ncat ~/sgb/VERSION\nls ~/sgb-releases\nrm -rf ~/<킷 이름> ~/<킷 이름>.zip\ndf -h / | tail -1\n```\n\n기대: 새 판 번호 · 판 폴더 2개(새 판 · 직전 판) · 디스크 여유가 3-0 과 비슷하거나 늘어남.\n\n## 4. postcheck 읽는 법\n\n맨 끝 `적용 후 확인 — 통과 N · 실패 0 · 확인 M` 에서 **실패 0** 이 기준입니다.\n\n| 줄 종류 | 뜻 | 할 일 |\n|---|---|---|\n| 통과 | 기대대로 | — |\n| **실패** | 고쳐야 함 | 멈추고 출력 전체를 Claude 에게 |\n| 확인 | 열기 전에는 정상인 상태 · 대표 결정으로 둔 것 | 아래 표와 같으면 그대로 |\n| 정보(앞에 표시 없음) | 수만 보여 줌 | 판별 절차서의 기대와 다르면 알려 주기 |\n\n지금(v10.202) 평소 「확인」 5줄:\n\n| # | 줄 | 왜 확인인가 |\n|---|---|---|\n| 1 | 간주 모드가 켜져 있음(assume.payment · broker · bank · etax) | 외부 연동 7건이 끝나지 않음 — 연동 뒤 끔 |\n| 2 | 사용자 웹이 누구나 열림 · 간주 모드 켜짐 | 11/1 대표 「전체 공개」 결정 · 소개몰 주문 받기 꺼짐 |\n| 3 | 오픈 차단 N건 | 오픈 체크리스트(운영 화면)에서 풀어 감 |\n| 4 | 약관 — 발행 N · 초안 N | 법무 확인 뒤 운영 화면 약관에서 게시 |\n| 5 | 처리방침 게시 판 없음 | 처리방침 게시 전에는 AI 전체를 켤 수 없음 |\n\n- 「올린 파일 백업」이 확인이면 `52 · 0 · 6` 도 정상입니다(백업이 아직 한 번도 안 돈 새 서버 등).\n- [9] 「주문 받기가 켜짐」이 **실패**로 나오면: 운영 화면에서 「주문 받기」를 끄고 `bash ~/sgb/deploy/aws/postcheck.sh` 를 다시 칩니다.\n- 정보 줄 「메인에 나가는 투표 N건」이 3 이 아니면 운영 화면 › 소개광장 › 「이건 어때? 투표」에서 「확정 질문으로 빈 자리 채우기」(SUPER).\n\n## 5. 멈췄을 때\n\n| 어디서 · 무엇 | 뜻 | 할 일 |\n|---|---|---|\n| precheck 「바뀐 파일 N」(N > 0) | 이미 운영에 올린 마이그레이션 파일이 킷에서 바뀜 | **적용 금지** · Claude 에게 |\n| precheck · apply [0] 「되돌린 상태」 | 지금 판이 보관 폴더의 가장 새 판보다 옛 판(rollback 뒤) | 아무것도 바뀌지 않았음 · Claude 에게(6-3) |\n| apply [3] 스냅샷 물음에 `yes` 가 아님 | 「쓰지 않은 새 판 폴더를 지웠습니다」와 함께 멈춤 | 스냅샷을 만든 뒤 **같은 apply 명령을 다시**(rollback 아님) |\n| apply [2] 빌드 실패 | 새 판 폴더만 지워짐 · 서비스는 옛 판 그대로 | 출력과 `~/sgb-data/logs/apply_…_build.log` 끝 50줄을 Claude 에게 |\n| apply [3] 마이그레이션 실패 | 실패한 파일은 한 거래라 반영되지 않음 · 서비스는 옛 판 | 출력 전체를 Claude 에게 · 스냅샷 복원은 하지 않음 |\n| apply [4] 「배포 불가」 | 미확인 CRITICAL 경보 등 | 운영 알림 화면에서 그 알림을 확인 · 처리한 뒤 apply 다시 |\n| apply [6] 「전 판으로 자동 복귀」 | 새 판이 뜨지 않아 옛 판 코드로 돌아감(DB 는 새 구조) | 출력 · `pm2 logs sgb --lines 80 --nostream` 을 Claude 에게 |\n| postcheck 실패 | 판은 바뀜 | 4절 표 · 출력 전체를 Claude 에게 |\n\n## 6. 되돌리기\n\n> 적용 블록과 같이 치지 않습니다. 필요할 때 이 절만 따로 봅니다.\n\n### 6-1. 코드만 전 판으로 (보통 이것)\n\n```bash\nbash ~/sgb/deploy/aws/rollback.sh\n```\n\n- 한 번 묻습니다 → `yes`. `~/sgb` 바로가기를 직전 판 폴더로 돌리고 pm2 를 다시 띄웁니다.\n- **DB 는 그대로**입니다. 마이그레이션은 전진 전용이라 전 판 코드가 새 DB 구조 위에서 돕니다. 판별 절차서 5절에 「남는 것」이 적혀 있습니다.\n\n### 6-2. 되돌린 뒤 다시 새 판으로\n\n```bash\nbash ~/sgb/deploy/aws/rollback.sh\n```\n\n한 번 더 → `yes`. 새 판 폴더가 남아 있어 그쪽으로 돌아갑니다.\n\n### 6-3. 되돌린 상태에서 다음 판을 올릴 때\n\napply 는 기본으로 멈춥니다(11/4 운영: 되돌린 채 적용 → 정상 판 폴더가 정리됨). 먼저 6-2 로 새 판에 돌아간 뒤 적용합니다. 일부러 되돌린 상태에서 올려야 하면 Claude 와 먼저 상의합니다(`ALLOW_FROM_ROLLBACK=1`).\n\n### 6-4. DB 까지 (드묾)\n\n1. RDS → 스냅샷 `sgb-before-v10-<판>-<날짜>` → 「스냅샷 복원」(새 인스턴스)\n2. 운영 `.env` 의 DB 접속 주소를 새 인스턴스로 바꿈\n3. `pm2 restart sgb sgb-site sgb-jobs`\n4. 스냅샷 뒤에 생긴 자료(가입 · 글 · 주문 등)는 사라집니다 — 대표 결정 뒤에만\n\n## 7. 하지 말 것\n\n1. 대표 승인 없이 적용\n2. 적용 블록과 rollback 을 한 번에 붙여 넣기\n3. 운영에서 `ASSUME_YES=1` · `verify` · `attack` · `db:seed` · `open-prep.sh apply`\n4. 법무 확인 전 약관 · 처리방침 게시 · `publish-terms.sh`(킷 원문으로 덮음 — 게시는 운영 화면 약관에서)\n5. 결제대행사 연결 전 「주문 받기」 켜기\n6. 목록을 보기 전 `cleanup.sh --apply`(먼저 `bash ~/sgb/deploy/aws/cleanup.sh` 로 읽기만)\n7. 운영 `.env` · Nginx 를 판별 절차서에 없는데 고치기(Nginx 는 `sites-enabled/sgb` 가 실제 파일)\n8. `~/kits/out` 의 킷 쓰기(점검용 · 덮어써짐)\n\n## 8. 판별 절차서에 적는 것 (Claude 가 쓰는 틀)\n\n| 절 | 내용 |\n|---|---|\n| 머리 | 지금 운영 판(마지막 적용 시각 · 절차서 · postcheck 수) → 올릴 판 · 바뀐 것 한 줄씩 · 마이그레이션 수(스냅샷 필수 여부) |\n| 1. 한눈에 | 킷 이름 · 만든 시각 · 저장소 커밋 · **zip / tar.gz sha256**(release 폴더 파일과 대조) · 올릴 마이그레이션 · precheck · apply · postcheck 기대 줄 · 스냅샷 이름 · `deploy/aws` 바뀜 여부 |\n| 리허설 | 두 킷 차이 · 버리는 DB 에 마이그레이션 전체 + 새 것 두 번(재실행 안전) |\n| 2. 무엇이 바뀌나 | 운영자 · 회원이 보는 변화 |\n| 3. 순서 | 이 문서 3절을 판 번호 · sha 로 채운 블록(한 블록씩 칠 수 있게 그대로 둠) |\n| 4. 적용 직후 | 화면 확인 표 · 적용 뒤 할 일(스위치 · 채우기 등) |\n| 5. 되돌리기 | rollback 하면 남는 DB 변화 · 그 상태에서 무엇이 동작하나 |\n| 6 · 7 | 하지 말 것(이번 판 몫) · 확인하지 못한 것(운영 DB · 운영 네트워크 등) |\n\n## 9. 지난 적용 기록 찾기\n\n- 인계 메모 `sgb-docs/handoff/handoff_20261028.md` — 판마다 「운영 적용 v10.x」 줄(시각 · 스냅샷 이름 · postcheck 수 · 남은 판)\n- `CLAUDE.md` 의 「운영 v10.x」 — 지금 운영 판 · rollback 대상\n- 운영 서버 `~/sgb-data/logs/` — `precheck_*` · `apply_*` · `postcheck_*` 결과 파일(30일 넘으면 `cleanup.sh` 가 지울 수 있음)\n"}, {"id": "ops", "name": "운영 지침서", "who": "운영 화면을 쓰는 운영자", "file": "322_운영지침서_v10.202_20261106.md", "md": "# 322. 운영 지침서 — v10.202 (2026-11-06)\n\n> 운영 화면(관리자 페이지)을 날마다 쓰는 운영진을 위한 지침서입니다. 개발 문서가 아닙니다.\n> 기준 판은 **v10.203**(개발 · docs/324 까지)입니다. 운영 서버는 v10.202(11/6 docs/320 적용)라 v10.203 의 것(사용자 설명서 탭 · 내 2단계 인증 「설정 바꾸기」 · 「모든 기기에서 로그아웃」 · 운영 알림 한국어 이름 21종)은 docs/325 적용 뒤에 보입니다.\n> 이 문서는 **코드에 적힌 것만** 옮겼습니다. 코드로 확인할 수 없는 것은 「추가 확인이 필요합니다」로 적고 9절에 모았습니다.\n> 지금 외부 연동(결제 · 본인인증 · 1원 계좌인증 · 중개사 대조 · 전자세금계산서 · 알림톡 · 메일 등)은 **끝나지 않았습니다.** 여러 기능이 **간주 모드**(연결된 것으로 치고 실제로는 돌지 않는 상태)로 돌아갑니다. 화면에 「결제 완료」가 떠도 실제 돈이 오가지 않을 수 있습니다.\n> 가장 중요한 세 가지:\n> 1. 아침마다 **대시보드 「공개 직후 지켜보기」 → 운영 알림 → 검수 큐 → 신고 처리** 순서로 봅니다(3절).\n> 2. **긴급(CRITICAL) 알림은 처리한 뒤 꼭 「확인」**을 누릅니다. 확인하지 않은 긴급이 남아 있으면 배포 점검이 실패합니다(4절).\n> 3. **「주문 받기」는 결제대행사 연결 전에는 켜지 않습니다.** 잘못 켜졌으면 누구든(운영 · 최고 관리자) 바로 끕니다(5절 · 8절).\n\n## 1. 이 문서 · 읽는 사람 · 기준 판\n\n| 항목 | 내용 |\n|---|---|\n| 읽는 사람 | 운영 화면을 쓰는 운영진 — 최고 관리자(SUPER) · 운영(ADMIN) · 검수 담당(REVIEWER) · 지급 담당(PAYOUT) · 안심 파트너 담당(PARTNER_MAL) · 제휴 파트너 담당(PARTNER_AFF) |\n| 기준 판 | v10.202 (2026-11-06 · 개발 main). 운영 적용 절차는 docs/320(v10.200 → v10.202) |\n| 근거 | 메뉴 `web/src/lib/adminMenu.ts` · 탭별 역할 `web/src/App.tsx`(`TAB_ROLES` · `SUPER_ONLY`) · 화면 `web/src/app/admin/*.tsx` · 서버 권한 `src/modules/**/*.controller.ts`(`@Roles`) · 설정 잠금 `src/modules/admin/admin.service.ts`(`updateSetting`) · 알림 `src/worker/scheduler.service.ts` · `src/modules/admin/launch-watch.service.ts` · 마이그레이션 D174 ~ D179 · 결정 기록 `decisions/super-all-permissions.md` · `partner-center-account-basis.md` #19 · `open-blockers.md` #29 |\n| 운영 화면 주소 | 허용된 IP 에서만 열립니다(운영 Nginx 설정 · 바꾸려면 대표 결정). 사용자 웹(sogaebank.com)은 2026-11-01 부터 누구나 열 수 있습니다 |\n| 쓰는 말 | 아래 표 |\n\n### 1-1. 자주 나오는 말 풀이\n\n| 말 | 쉬운 뜻 |\n|---|---|\n| 간주 모드(assume.*) | 외부 업체와 연결된 것으로 **치고** 돌리는 상태. 예: 간주 결제 = 결제 화면은 지나가지만 실제 돈은 받지 않음 |\n| 시험 결제 주문 | 간주 결제 상태에서 「결제 완료」가 된 소개몰 주문. **돈을 받지 않은 주문**입니다 |\n| 운영 알림 | 정기 작업(서버가 몇 분 · 몇 시간마다 저절로 하는 일)이나 스크립트가 남긴 알림. 메뉴 「위험감지 › 운영 알림」 |\n| 등급 | 긴급(CRITICAL) · 경고(WARN) · 안내(INFO) |\n| 확인 | 사람이 「봤고 처리했다」고 남기는 것. **한 번만** 되고 되돌릴 수 없습니다(누가 · 언제 · 메모가 남음) |\n| 풀림 | 원인이 없어져서 정기 작업이 저절로 적는 표시. 사람의 「확인」과 따로입니다 |\n| 급한 알림 | 메일 · 텔레그램으로 10분 안에 보내는 알림(4-1) |\n| 오픈 차단 | 정식 오픈을 막고 있는 항목. 메뉴 「관 관리 › 오픈 체크리스트」 |\n| SLA | 처리 기한. 검수는 24시간 |\n| 2단계 인증 | 비밀번호 다음에 휴대폰 인증 앱의 6자리 번호를 한 번 더 넣는 것 |\n\n### 1-2. 운영 화면 쓰는 기본\n\n1. **로그인**: 로그인 전에는 로그인 화면만 보입니다. 2단계 인증이 켜져 있으면 로그인 뒤 6자리 번호 넣기 화면(등록 안 했으면 등록 화면)만 보입니다.\n2. **메뉴 모양**: 위 어두운 줄 = 묶음 메뉴 18개 · 본문 위 줄 = 그 묶음의 탭. 묶음을 누르면 그 묶음에서 볼 수 있는 첫 탭으로 갑니다. 권한이 없는 탭은 보이지 않습니다.\n3. **주소로 바로 가기**: 지금 보는 탭이 주소 끝(`#/탭이름`)에 남습니다. 새로 고침 · 뒤로 가기에도 같은 탭이 열립니다. 예: `#/ops-alerts`(운영 알림) · `#/hlt-orders`(소개몰 주문).\n4. **화면 번호**: 각 화면 제목 줄에 `SB-ADM-…` 번호가 있습니다. 개발에 문의할 때 이 번호를 함께 적습니다.\n5. **사용자 웹에서 들어오기**: 운영 계정으로 사용자 웹에 로그인하면 머리줄 오른쪽에 **방패 아이콘**(마우스를 올리면 「관리자 페이지」)이 보입니다(v10.202). 휴대폰은 메뉴 줄 끝 「관리자 페이지」 글자입니다.\n6. **기록이 남는 일**: 설정 바꾸기 · 확인 · 승인 · 반려 · 역할 주기 등은 누가 · 언제가 감사 기록에 남습니다. 사유 칸이 있으면 나중에 남이 읽고 알 수 있게 적습니다.\n7. **문의 · 보고할 때 적을 것**: 화면 번호 · 시각 · 누른 단추 · 나온 글(오류 코드가 있으면 그대로 · 예: `ORDER_OPEN_REASON`).\n\n## 2. 역할과 권한\n\n### 2-1. 원칙\n\n1. **최고 관리자(SUPER)는 모든 권한**을 가집니다. 서버 · DB · 운영 화면 모두 「SUPER 는 권한 검사를 늘 통과」로 만들어져 있습니다(decisions/super-all-permissions #1 · #2). 감사 기록은 SUPER 도 그대로 남습니다(#3).\n2. 다만 **두 사람 원칙**(확정한 사람 ≠ 지급한 사람 · 신청자 ≠ 승인자 ≠ 집행자)은 SUPER 도 지킵니다(#5). 자기가 확정한 지급은 자기가 지급 기록을 남길 수 없습니다.\n3. 운영 화면은 역할에 맞는 탭만 보여 줍니다. 보이지 않는 탭은 서버도 거절합니다(App.tsx 주석 「서버가 막는 탭을 보여 주면 눌러도 403 만 납니다」).\n4. **역할 주기 · 회수는 SUPER 만** 합니다(메뉴 「권한 계층 › 권한 관리」 · 서버 `POST /admin/reports/roles` = SUPER). 사유를 꼭 적어야 하고, **자기 권한은 바꿀 수 없습니다**(`SELF_GRANT`).\n5. 안심 · 제휴 파트너 담당과 운영(ADMIN)은 **지급 담당(PAYOUT)을 겸할 수 없습니다** — SUPER 는 예외(decisions/super-all-permissions #6 · partner-center-account-basis #19).\n\n### 2-2. 역할별 할 수 있는 것 / 없는 것\n\n| 역할 | 화면 이름 | 보이는 메뉴(탭) | 할 수 있는 것 | 할 수 없는 것 |\n|---|---|---|---|---|\n| SUPER | 최고 관리자 | 전부 | 모든 일 + 아래 「SUPER 만」 표의 일 | 자기가 확정한 지급 · 자기가 신청한 퍼블리셔 지급 승인(두 사람 원칙) · 자기 권한 바꾸기 |\n| ADMIN | 운영 | `SUPER_ONLY` 9개(오픈 체크리스트 · 정책 · 외부 연동 · 통합 허브 · 코드 라벨 · 통합 현황 · 약관 · 개인정보 접속기록 · 운영자 권한)를 뺀 모든 탭 | 검수 · 신고 · 회원 · 정산 승인 · 지급 확정 · 운영 알림 확인 · 「주문 받기 끄기」 · 「가입 잠시 막기」 · 입점 신청 「끄기」 · 다국어 켜기/끄기 · 회원 투표 만들기 켜기/끄기 | 「주문 받기 켜기」 · 「입점 신청 켜기」 · AI 설정 · 약관 게시 · 2단계 인증 설정 · 역할 주기 · **지급 기록 · 입금 기록**(지급 담당만) · 아래 「SUPER 만」 표의 일 |\n| REVIEWER | 검수 담당 | 대시보드(안내만) · 검수 큐 · 배지 신청 · 표본 감사 · 내 2단계 인증 | 매물 검수(승인 · 반려) · 배지 신청 승인 · 반려 · 표본 감사(적정 · 부적정 · 「표본 다시 뽑기」) | 그 밖의 모든 탭. 대시보드 숫자도 보지 않음(요약 API 가 ADMIN · SUPER 전용) |\n| PAYOUT | 지급 담당 | 대시보드(안내만) · 지급 · 퍼블리셔 지급 · 내 2단계 인증 | 확정된 지급의 「지급 기록」 · 광고비 「입금 기록」 · 퍼블리셔 지급 「집행」 | 지급 확정(운영이 함) · 그 밖의 탭. 운영 화면에서 이 역할을 줄 수 없음(9절) |\n| PARTNER_MAL | 안심 파트너 담당 | 대시보드(안내만) · 파트너사 · 안심소개 입점 심사 · 법률·세무 정액 노출 · 자격 심사 · 내 2단계 인증 | 안심소개 입점 · 공인중개사 인증 · 자격 심사 · 정액 노출 처리 | **돈을 움직이는 일**(리드 이용료 · 정산 등 — 서버에서 ADMIN 만) · 그 밖의 탭 |\n| PARTNER_AFF | 제휴 파트너 담당 | 대시보드(안내만) · 제휴 · 내 2단계 인증 | 제휴 신청 · 제휴상품 · 목표 · 홍보 자료 · 안내 | 제휴 정산 · 지급(서버에서 ADMIN · PAYOUT) · 그 밖의 탭 |\n\n> 대시보드 안내 글(Dashboard.tsx): 파트너 담당 「돈을 움직이는 일은 운영(ADMIN)이 합니다.」 · 지급 담당 「확정된 지급과 광고비 입금을 기록합니다.」 · 검수 담당 「검수 큐 · 배지 신청 · 표본 감사를 처리합니다.」\n\n### 2-3. SUPER 만 하는 일 (서버가 막는 것)\n\n| 일 | 어디서 | 서버가 막을 때 나오는 코드 |\n|---|---|---|\n| 「주문 받기 켜기」 | 대시보드 › 공개 직후 지켜보기 | 403 `ORDER_SETTING_SUPER` |\n| 「입점 신청 받기」 켜기 | 정산 › 소개몰 정산 › 입점 신청 | 403 `TENANT_SETTING_SUPER` |\n| AI 설정(`agent.*` · AI 번역 설정) | 위험감지 › AI 운영 › AI 에이전트 | 403 `AI_SETTING_SUPER` |\n| 본인인증 · 알림톡 · 전자계약 · 안심번호 방식 설정 | 통합 현황 › 외부 연동 | 403 `INTEG_SETTING_SUPER` |\n| 약관 설정 · 약관 게시 · 「법무 검토용 내려받기」 | 관 관리 › 법정 고지(약관 구역) · 약관 | 약관 API 전체가 SUPER(`terms.controller`) · 설정은 403 `TERMS_SETTING_SUPER` |\n| 동네 인증 켜기 | (설정 `community.town_verify`) | 403 `TOWN_SETTING_SUPER` |\n| 운영자 2단계 인증 설정 | 권한 계층 › 내 2단계 인증 「설정 바꾸기」(v10.203) | 403 `MFA_SETTING_SUPER` · 켜는 사람이 먼저 등록 안 했으면 422 `MFA_ENROLL_FIRST` |\n| 역할 주기 · 회수 | 권한 계층 › 권한 관리 | SUPER 만 |\n| 「시험 메일 보내기」 · 「대화방 찾기」 · 「시험 메시지 보내기」 · 「하루 요약 끄기 / 하루 요약도 받기」 단추 | 위험감지 › 운영 알림 | 모두 서버도 SUPER — 대화방 · 하루 요약 · 낯선 로그인 알림 설정은 403 `OPS_PUSH_SETTING_SUPER`(v10.203 · 끄기도) |\n| 「시험 결제 주문 정리(발송 전 취소 · 알림)」 | 대시보드 › 공개 직후 지켜보기 | 서버 SUPER(`POST /admin/launch-watch/stub-orders/cancel`) — v10.203 부터 단추도 SUPER 에게만 보임 |\n| 「확정 질문으로 빈 자리 채우기」 | 소개광장 › 투표 관리 | 서버 SUPER |\n| 회원 비밀번호 재설정 「링크 만들기」 · 운영자 「2단계 초기화」 | 회원 › 회원 상세 | 화면이 SUPER 에게만 보여 줌 |\n| 「점검 완료」(개인정보 접속기록 · 운영자 권한) | 위험감지 › 개인정보 접속기록 · 운영자 권한 | 서버 SUPER |\n| 관 관리 안의 새 관 · 관 설정 · 공유 경계 | 관 관리 › 관 관리 | 화면이 SUPER 에게만 보여 줌 |\n| 메인 운영 안의 관 노출 · 화면 구성 · 콘텐츠 | 노출 › 메인 운영 | 화면이 SUPER 에게만 보여 줌(배너 · 공지는 ADMIN 도) |\n\n## 3. 매일 할 일 체크리스트\n\n> 아래 순서는 대시보드 칸 · 운영 알림 · 검수 기한(24시간) · 신고 「오래된 것이 위로」 원칙에 맞춘 권장 순서입니다. 하루 몇 번 볼지는 운영진이 정합니다(코드에는 정해져 있지 않음).\n\n### 3-1. 아침 (09:00 하루 요약이 만들어진 뒤)\n\n| # | 할 일 | 어디서 | 무엇을 보나 · 무엇을 누르나 | 누가 |\n|---|---|---|---|---|\n| 1 | 빨간 띠가 있는지 | 운영 화면 모든 쪽 머리줄 아래 | 「소개몰 「주문 받기」가 켜져 있습니다 …」 띠가 보이면 **8-2** 로 | 모두 |\n| 2 | 공개 직후 지켜보기 12칸 | 대시보드 맨 위 | 노란 칸(시험 결제 주문 > 0 · 확인 안 한 알림 > 0 · 서버 오류 > 0 · 메인 투표 3 미만 · 한도 걸림 > 0 · 느린 응답 기준 넘음)을 눌러 해당 화면으로 | ADMIN · SUPER |\n| 3 | 주문 받기 · 간주 결제 | 같은 카드 「소개몰 주문 받기 … · 간주 결제 …」 줄 | 간주 결제가 「켜짐(시험 결제)」인데 주문 받기가 「켜짐」이면 「주문 받기 끄기」 | ADMIN · SUPER |\n| 4 | 서버 디스크 | 같은 카드 「서버 디스크 …%」 줄 | 기준(85%) 넘으면 노란 줄 → 서버 담당(사람 · ubuntu)에게 정리 요청(`cleanup.sh`는 목록부터) | ADMIN · SUPER |\n| 5 | 올린 파일 백업 | 같은 카드 「올린 파일 백업: 마지막 … 시간 전」 | 36시간 넘으면 노란 줄 → 서버 담당에게 | ADMIN · SUPER |\n| 6 | 어제 요약 | 같은 카드 「어제 요약 보기」 | 가입 · 주문 · 시험 결제 주문 · 「어제 바뀐 중요 설정」 · 「!! 확인 안 한 긴급 알림 N건」 줄을 읽음(이 단추는 알림 · 메일을 남기지 않음) | ADMIN · SUPER |\n| 7 | 확인이 필요한 것 | 대시보드 가운데 | 「확인하지 않은 CRITICAL 경보 N건」 · 「SLA 24시간 초과 N건」 · 「오픈 차단 N건」 · 「진행 중인 분쟁 N건」 → 「보러 가기」 | ADMIN · SUPER |\n| 8 | 운영 알림 | 위험감지 › 운영 알림 | 4절 표대로 처리 → 「확인」(메모에 무엇을 했는지) | ADMIN · SUPER |\n| 9 | 검수 큐 | 검수 › 검수 큐 | 「SLA 순」으로 오래된 것부터 · 남은 4시간 미만은 「임박」 | REVIEWER · ADMIN |\n| 10 | 신고 처리 | 위험감지 › 신고 처리 | 「3일 넘은 것」 먼저 · 처리 내용을 적고 「신고가 맞습니다」 / 「아닙니다 (기각)」 | ADMIN |\n| 11 | 권리 요청 | 위험감지 › 권리 요청 | 「기한 2일 안」 · 「기한 넘김」 숫자 | ADMIN |\n\n### 3-2. 낮 동안 (틈틈이)\n\n1. 대시보드 「공개 직후 지켜보기」의 **오늘 가입 · 오늘 로그인 · 소개광장 글 · 매물** 숫자가 평소와 다르게 튀는지 봅니다. 가입이 갑자기 몰리면 「가입 급증」 알림이 따로 납니다(1시간 30명 기준).\n2. 소개광장 › 글 검수에서 첫 글 · 신고된 글을 봅니다.\n3. 거래 › 분쟁 · 거래 모니터링에서 진행 중인 분쟁을 봅니다(분쟁이 걸린 거래는 정산이 보류됨).\n4. 파트너 담당은 파트너사 · 자격 심사 대기를, 제휴 담당은 제휴 › 입점 심사를 봅니다.\n\n### 3-3. 퇴근 전\n\n| # | 확인 | 맞으면 |\n|---|---|---|\n| 1 | 빨간 띠 없음 | 주문 받기가 꺼져 있음 |\n| 2 | 운영 알림 「확인 안 한 것」에 긴급 없음 | 배포 점검이 막히지 않음 |\n| 3 | 검수 큐에 24시간 넘은 것 없음 | 「검수 기한 넘김」 알림이 풀림 |\n| 4 | 신고 처리에 3일 넘은 것 없음 | 경고 띠가 없음 |\n| 5 | 권리 요청에 기한 넘김 없음 | 「개인정보 권리 요청 기한」 알림이 긴급으로 바뀌지 않음 |\n\n### 3-4. 정기로 (달 · 분기)\n\n| 주기 | 할 일 | 어디서 | 안 하면 |\n|---|---|---|---|\n| 매달 | 개인정보 접속기록 점검 → 「점검 완료」 | 위험감지 › 개인정보 접속기록(SUPER) | 운영 알림 `PII_REVIEW_DUE` |\n| 분기마다 | 운영자 권한 점검(역할 · 마지막 로그인 · 2단계 등록) → 점검 완료 | 위험감지 › 운영자 권한(SUPER) | 운영 알림 `ROLE_REVIEW_DUE` |\n| 매일 03:00(저절로) | 개인정보 파기 작업 | 위험감지 › 파기 기록 | 실패 · 안 돌면 `PII_PURGE_FAILED` · `PII_PURGE_MISSED` |\n\n> 90일(설정 `ops.role_idle_days`) 넘게 로그인하지 않은 운영 계정은 운영자 권한 화면에 「정지 권함」으로 표시됩니다. 저절로 정지하지는 않습니다.\n\n### 3-5. 역할별 하루 할 일 요약\n\n| 역할 | 하루 할 일 |\n|---|---|\n| SUPER | 3-1 전부 + 운영 알림의 긴급 확인 · 시험 결제 주문 정리 · 역할 · 2단계 인증 관리 · 달마다 · 분기마다 점검(3-4) · 약관 게시(7절) |\n| ADMIN | 3-1 의 1 ~ 11 · 3-2 · 3-3. 「주문 받기」는 끄기만 · 켜야 하면 SUPER 에게 |\n| REVIEWER | 검수 큐(「SLA 순」) → 배지 신청 → 표본 감사. 24시간 넘는 건이 생기지 않게 |\n| PAYOUT | 지급 화면에서 운영이 「확정」한 건의 「지급 기록」 · 광고비 「입금 기록」 · 퍼블리셔 지급 「집행」. 지금은 정산 · 결제가 간주 모드라 실제 돈의 흐름과 맞는지 대표와 확인 |\n| PARTNER_MAL | 파트너사(입점 신청 · 서비스 검수) → 안심소개 입점 심사 → 자격 심사 → 정액 노출 |\n| PARTNER_AFF | 제휴 › 입점 심사 → 제휴상품 · 목표 · 자료 |\n\n## 4. 운영 알림 대응표\n\n### 4-1. 먼저 알아 둘 것\n\n1. **알림 화면**: 위험감지 › 운영 알림. 맨 위 「급한 알림 메일」 줄 · 「급한 알림 텔레그램」 줄 → 「종류별」 표(확인 안 함 · 풀림 · 지난 7일 · 「모두 확인」) → 알림 목록(「확인」 · 「자세히」).\n2. **급한 알림**(메일 · 텔레그램으로 10분 안에 보냄): 모든 **긴급(CRITICAL)** + `SETTING_CHANGED` · `UPLOADS_BACKUP_FAILED` · `UPLOADS_BACKUP_BAD` · `ORDER_OPEN_EXPIRED` · `STAFF_LOGIN_NEW` · `AGENT_LIVE` · `AGENT_READY_GAP` · `AGENT_CAP_NEAR` · `AGENT_STEP_READY`(D179 · D181 · D182 `fn_ops_alert_mail_pending`). 같은 종류는 1시간에 1통 · 24시간 지난 것은 보내지 않음 · 확인한 것 · 풀린 것은 보내지 않음.\n3. **다시 알림**: 긴급을 보낸 뒤 12시간 넘게 「확인」하지 않으면 한 번 더 보냅니다(「[다시]」).\n4. **지금 상태**: 운영 메일은 준비되지 않았습니다(「준비 안 됨 — 메일 설정 없음」 · NO_SMTP). 텔레그램은 대표가 봇 토큰 · 대화방을 넣어야 켜집니다(docs/317 4-3). **둘 다 준비 전이면 알림은 이 화면에만 쌓입니다** — 그래서 화면을 직접 보는 것이 중요합니다.\n5. 텔레그램에는 **제목 · 등급 · 시각만** 갑니다. 자세한 내용은 운영 화면에서 봅니다.\n6. **긴급이 확인 안 된 채 남아 있으면 배포 점검(deploy-check · postcheck)이 실패**합니다. 처리한 뒤 꼭 「확인」합니다.\n7. 「풀림」은 원인이 없어졌다는 표시입니다. 풀린 알림은 「확인 안 한 알림」 수 · 메일 · 배포 점검에서 빠집니다. 화면은 기본으로 숨기고 「풀린 것도 보기(N건 숨김)」로 볼 수 있습니다.\n8. v10.203 부터 아래 표의 모든 종류가 한국어 이름으로 보입니다(전에는 21종이 영어 코드로 보였음).\n\n### 4-2. 운영 · 보안 알림\n\n| 코드 | 화면 이름 | 등급 | 언제 생기나 | 할 일 | 끝내는 법 |\n|---|---|---|---|---|---|\n| `STAFF_LOGIN_NEW` | 운영자 낯선 로그인 | 경고 · 급한 알림 | 운영 역할 계정이 지난 30일에 없던 IP 대역(앞 두 마디) · 브라우저로, 또는 30일 만에 처음 로그인했을 때(실패 로그인 · 회원 로그인은 남기지 않음). 제목 예: `운영자 낯선 로그인 — ko***@gmail.com(SUPER) · 121.168.*.* · Chrome · 처음 보는 브라우저` | 그 사람에게 직접 물어봄 → 본인이면 「확인」(메모 「본인 · 새 PC」 등). 본인이 아니면 **8-1** | 「확인」만(풀림 없음). v10.202 적용 직후 계정마다 한 번씩 날 수 있음(정상) |\n| `SETTING_CHANGED` | 중요 설정 바뀜 | 경고 · 급한 알림 | `mall.order_open` · `signup.open` · `admin.mfa_required` · `assume.*` · `feature.*` 값이 바뀔 때. 「자세히」에 누가(`by`) · 어디서(`via` APP = 운영 화면 / DB = 서버에서 직접) · 사유(`reason`) | 바꾼 사람 · 사유가 맞는지 봄. **via DB** 이거나 아무도 바꾼 적 없다면 대표에게 바로 알림. 주문 받기가 켜졌으면 **8-2** | 「확인」 |\n| `ORDER_OPEN_NO_END` | 주문 받기 꺼질 시각 없음 | **긴급** | 간주 결제가 켜진 채 주문 받기가 꺼질 시각 없이 1시간 넘게 켜져 있을 때(서버에서 직접 켠 경우 등) | 대시보드 「주문 받기 끄기」 → 「확인」 | 주문 받기가 꺼지면 「풀림」 |\n| `ORDER_OPEN_EXPIRED` | 주문 받기 저절로 꺼짐 | 경고 · 급한 알림 | SUPER 가 정한 꺼질 시각(1 ~ 24시간)이 지나 서버가 주문 받기를 껐을 때 | 시험 결제 주문이 생겼는지 봄(대시보드 「시험 결제 주문」 칸) → 「확인」 | 「확인」 |\n| `STUB_PAYMENT_ORDER` | 시험 결제 주문 | 경고 | 지난 15분 안에 간주 결제로 「결제 완료」된 소개몰 주문이 있을 때 | 주문 받기를 끔 → SUPER 가 「시험 결제 주문 정리(발송 전 취소 · 알림)」 → 「확인」 | 「확인」 |\n| `SIGNUP_SPIKE` | 가입 급증 | 경고 | 지난 1시간 가입이 기준(`ops.signup_spike_per_hour` · 기본 30명) 이상 · 1시간에 한 번 | 회원 화면에서 가입한 계정이 비슷한지(이름 · 이메일 모양) 봄 → 자동 가입으로 보이면 대시보드 「가입 잠시 막기」 → 「확인」 | 「확인」 |\n| `SERVER_ERROR_SPIKE` | 서버 오류 몰림 | 경고 | 지난 10분 서버 오류(5xx)가 기준(`ops.server_error_per_10min` · 기본 20건) 이상 · 1시간에 한 번 | 위험감지 › 서버 오류에서 「많이 난 곳」 주소를 적어 개발에 보냄(**8-5**) → 「확인」 | 「확인」 |\n| `SLOW_API` | 느린 응답 | 경고 | 지난 10분 느린 쪽 5% 응답이 기준(`ops.slow_p95_ms` · 기본 1500ms) 이상 · 요청 50건 이상 | 대시보드 「느린 주소」 상세를 개발에 보냄 → 「확인」 | 「확인」 |\n| `DISK_LOW` | 디스크 모자람 | 경고(85% 이상) · **긴급**(95% 이상) | 서버 디스크가 기준(`ops.disk_warn_pct` · 85)을 넘을 때 · 같은 등급 하루 한 번 | 서버 담당(ubuntu)에게 `cleanup.sh`(목록 먼저 → 맞으면 `--apply`) 요청 → 「확인」 | 기준 아래로 내려가면 「풀림」 |\n| `DAILY_DIGEST` | 하루 요약 | 안내 | 매일 09:00 어제 요약(가입 · 주문 · 시험 결제 주문 · 알림 · 어제 바뀐 중요 설정) | 읽고 「확인」. 메일 · 텔레그램이 준비되면 그쪽으로도 감 | 「확인」 |\n| `AGENT_CHAT_HANDOFF` | AI 상담 담당자 연결 | 안내 | AI 상담이 담당자에게 넘어왔을 때(AI 는 지금 꺼짐) | 고객 문의로 처리 → 「확인」 | 「확인」 |\n| `AGENT_CAP_REACHED` | AI 월 상한 닿음 | **긴급** | AI 월 상한(달러)에 닿아 AI 를 저절로 껐을 때 | 대표에게 알림(상한을 올릴지 결정) → 「확인」 | 「확인」 |\n| `AGENT_CAP_NEAR` | AI 월 상한 가까움 | 경고 · 급한 알림 | 이번 달 AI 비용이 월 상한의 80%(설정 `agent.cap_warn_pct`)에 닿았을 때 · 그달 한 번(v10.204) | 대표에게 알림(상한을 올릴지 · 그대로 둘지) → 「확인」 | 「확인」 |\n| `AGENT_LIVE` | AI 사용 가능해짐 | 정보(빠진 것이 있으면 경고) · 급한 알림 | 국외 이전 조항이 든 처리방침이 시행되어 AI 잠금이 풀린 때 한 번. 제목에 빠진 것(AI 키 · 월 상한 0 · AI 전체 꺼짐)과 검수 보조 · AI 상담 스위치 상태(v10.204) | 빠진 것이 있으면 운영 화면 › AI 에이전트에서 채움(SUPER) → 「확인」 | 「확인」 |\n| `AGENT_READY_GAP` | AI 준비 덜 됨 | 경고 · 급한 알림 | 국외 이전 조항이 든 처리방침 새 판이 3일 안에 시행 예정인데 AI 키 · 월 상한 · AI 전체 중 빠진 것이 있을 때 · 판마다 한 번(v10.204) | 시행일 전에 운영 화면 › AI 에이전트에서 준비 → 「확인」 | 「확인」 |\n| `AGENT_STEP_READY` | AI 다음 단계 켤 수 있음 | 정보 · 급한 알림 | AI 켜기 단계의 다음 단계(검수 보조 · AI 상담 · 내 정보 조회 · 신청서 초안)가 「할 차례」(앞 단계 기준 넘음 · 아직 꺼짐)가 된 때 · 단계마다 한 번(v10.205) | 운영 화면 › AI 에이전트 › AI 켜기 단계에서 앞 단계 결과를 보고 대표가 켬(SUPER) → 「확인」 | 「확인」 |\n\n### 4-3. 백업 알림\n\n| 코드 | 화면 이름 | 등급 | 언제 | 할 일 | 끝내는 법 |\n|---|---|---|---|---|---|\n| `UPLOADS_BACKUP_FAILED` | 올린 파일 백업 실패 | 경고 · 급한 알림 | 매일 04:30 백업이 묶기 · 확인에 실패(하루 한 번) | 서버 담당에게: `bash ~/sgb/deploy/aws/uploads-backup.sh check` 결과 받기 → 「확인」 | 그 뒤 새 묶음이 생기면 「풀림」 |\n| `UPLOADS_BACKUP_BAD` | 올린 파일 백업 묶음 깨짐 | 경고 · 급한 알림 | 7일마다 하는 묶음 검사에서 깨진 묶음 발견 | 서버 담당에게 알림 → 「확인」 | 그 뒤 검사에서 깨짐 0 이면 「풀림」 |\n| `UPLOADS_BACKUP_STALE` | 올린 파일 백업 멈춤 | 경고 | 36시간 넘게 새 백업 묶음이 없을 때 | 서버 담당에게 `pm2 logs sgb-jobs` · 디스크 확인 요청 → 「확인」 | 새 묶음이 생기면 「풀림」 |\n| `UPLOADS_BACKUP_SKIPPED` | 올린 파일 백업 건너뜀 | 경고 | 디스크 여유가 모자라 백업을 건너뜀 | `DISK_LOW` 와 같이 처리 | 「확인」 |\n| `UPLOADS_BACKUP_OFFSITE_FAILED` | 백업 디스크 밖 올리기 실패 | 경고 | 디스크 밖(S3) 보관이 켜졌는데 올리기 실패. **지금은 꺼져 있어 나지 않는 것이 정상** | 서버 역할 권한 · 버킷 확인(대표) → 「확인」 | 「확인」 |\n\n### 4-4. 검수 · 신고 · 위험 알림\n\n| 코드 | 화면 이름 | 등급 | 언제 | 할 일 |\n|---|---|---|---|---|\n| `REVIEW_SLA_BREACH` | 검수 기한 넘김 | 경고(20건 미만) · **긴급**(20건 이상) | 1시간마다 검수 기한(24시간) 넘긴 건을 셈. 확인 안 한 같은 등급 줄이 있으면 새 줄 대신 건수만 고침 | 검수 큐 「SLA 순」으로 처리. 0건이 되면 「풀림」 |\n| `K_VALUE_BREACH` | 검수 부담(k값) 경보 | **긴급** | 검수 부담 지표(k값)가 경보선을 2개월 연속 넘음 — 「검수 증원 안건 발의」 | 대표에게 보고 → 「확인」 |\n| `POSTING_SUSPENDED` | 등록 잠시 막음(반려 3회) | 경고 | 한 등록자가 제한업종 · 금칙 표현으로 3회 반려되어 7일 등록 정지 | 회원 상세에서 사정 확인 · 필요하면 「등록 정지 풀기」 → 「확인」 |\n| `RESTRICTION_ENFORCED` | 제한업종 노출 중단 | 경고 | 제한업종을 지정해서 노출이 중단된 매물이 생김 | 의도한 지정인지 확인 → 「확인」 |\n| `POLL_HIDDEN_BY_REPORTS` | 회원 투표 신고 감춤 | 경고 | 회원 투표가 신고 3건으로 저절로 감춰짐 | 소개광장 › 글 검수 / 투표 관리에서 내용 확인 → 「확인」 |\n| `RISK_DETECTED` | 위험 탐지 | 경고 | 위험감지 규칙이 「자동 탐지 N건」을 찾음 | 위험감지 › 위험감지에서 경보마다 「조치 완료」 또는 「오탐」 → 「확인」 |\n| `RISK_RULE_BROKEN` | 위험 탐지 규칙 고장 | **긴급** | 탐지 질의가 실패한 규칙이 있음(그 규칙은 아무것도 못 잡음) | 개발에 보고 → 「확인」 |\n| `PROMO_EXPIRY_UNNOTIFIED` | 프로모션 만료 안내 못 함 | 경고(50건 미만) · **긴급**(50건 이상) | 프로모션 만료 14일 전 안내를 못 한 건이 있음 | 개발 · 대표에 보고 → 「확인」 |\n\n### 4-5. 개인정보 알림\n\n| 코드 | 화면 이름 | 등급 | 언제 | 할 일 |\n|---|---|---|---|---|\n| `PRIVACY_REQUEST_DUE` | 개인정보 권리 요청 기한 | 경고 · 기한 넘긴 것이 있으면 **긴급** | 권리 요청 처리 기한이 2일 안(하루 요약 때) | 위험감지 › 권리 요청에서 처리(**8-4**) → 「확인」 |\n| `PII_REVIEW_DUE` | 개인정보 접속기록 점검 | 경고 | 그달 개인정보 접속기록 점검이 없음 | SUPER 가 「점검 완료」 → 「확인」 |\n| `ROLE_REVIEW_DUE` | 운영자 권한 점검 | 경고 | 그 분기 운영자 권한 점검이 없음 | SUPER 가 운영자 권한 화면에서 점검 완료 → 「확인」 |\n| `PII_PURGE_FAILED` | 개인정보 파기 실패 | **긴급** | 개인정보 파기 작업 실패 | 위험감지 › 파기 기록에서 오류 확인 → 개발 보고 → 「확인」 |\n| `PII_PURGE_MISSED` | 개인정보 파기 안 돎 | 경고 | 파기 작업이 오래(또는 한 번도) 돌지 않음 | 개발 · 서버 담당에 정기 작업 확인 요청 → 「확인」 |\n| `PII_PURGE_OVERDUE` | 파기 기한 넘긴 개인정보 | 경고 | 파기 기한을 넘긴 개인정보가 남음(법정 기한 초과) | 개발 · 대표에 바로 보고 → 「확인」 |\n\n### 4-6. 돈 · 정산 · 리드 알림\n\n| 코드 | 화면 이름 | 등급 | 언제 | 할 일 |\n|---|---|---|---|---|\n| `SUBSCRIPTION_CARD_UNUSABLE` | 구독 카드 교체 필요 | **긴급** | 카드 교체가 필요한 구독(재시도로 안 풀림) | 정산 › 청구에서 대상 확인 · 회원 안내 → 「확인」 |\n| `SUBSCRIPTION_BILLING_FAILED` | 정기결제 실패 | 경고 | 정기결제 실패 · 결제수단 없음 | 정산 › 청구 확인 → 「확인」 |\n| `SUBSCRIPTION_BILLING_REVIEW` | 정기결제 확인 필요 | **긴급** | 금액이 다르게 승인됐거나 하루 넘게 닫히지 않은 청구 · 환불 | 운영 화면(청구)과 결제사 관리자 화면을 대조(결제 연동 전이면 개발 보고) → 「확인」 |\n| `SETTLEMENT_AUDIT_FAILED` | 정산 점검 이상 | **긴급** | 정산 정합성 점검에서 이상 발견 | 정산 승인 · 지급을 멈추고 개발 · 대표에 보고 → 「확인」 |\n| `NOTIFY_STUCK` | 회원 알림 못 나감 | **긴급** | 사흘 넘게 밖으로 나가지 못한 회원 알림이 있음 — 「채널이 준비되지 않았습니다」 | 메일 · 알림톡 준비 상태를 대표에게 보고 → 「확인」(9절) |\n| `LEAD_UNMATCHED` | 보낼 업체 없는 상담 신청 | 경고 | 기한 안에 보낼 업체가 없는 상담 신청 | 파트너사 › 리드 배정에서 직접 보냄 → 「확인」 |\n| `LEAD_ASSIGN_FAILED` | 리드 배정 오류 | 경고 | 리드 배정 중 오류 | 개발 보고 → 「확인」 |\n| `LEAD_CASH_AUTO_FAILED` | 리드 이용료 자동 충전 실패 | 경고 | 리드 이용료 자동 충전 일부 실패 | 파트너사 › 리드 이용료 · 정산 확인(ADMIN) → 「확인」 |\n\n### 4-7. 알림 하나를 처리하는 순서\n\n1. **등급을 봅니다.** 긴급 → 경고 → 안내 순서로 처리합니다.\n2. **「자세히」를 엽니다.** 건수 · 기준 · 누가 · 어디서 같은 내용이 들어 있습니다.\n3. **위 표에서 「할 일」을 찾습니다.** 표에 없는 코드면 개발에 화면 번호(SB-ADM-OPS-010) · 코드 · 제목을 보냅니다.\n4. **원인부터 처리합니다.** 예: 검수 기한 넘김 → 검수 큐 처리 · 주문 받기 → 끄기.\n5. **「풀림」이 붙는 종류는 잠시 기다려 봅니다.** 정기 작업이 원인이 없어진 것을 보면 「풀림」을 적습니다(백업 · 디스크 · 검수 기한 · 주문 받기 꺼질 시각 없음).\n6. **「확인」을 누르고 메모를 남깁니다.** 긴급은 반드시.\n7. **혼자 판단하기 어려우면** 대표에게 보고하고, 확인 메모에 「대표 보고 HH:MM」을 적습니다.\n\n### 4-8. 「확인」 · 「모두 확인」 쓰는 법\n\n1. 알림 한 줄의 「확인」 → 메모 칸(선택 · 200자)에 **무엇을 했는지** 적습니다. 예: 「주문 받기 끔 · 시험 주문 0건」.\n2. 「모두 확인」은 그 종류의 확인 안 한 알림을 **풀린 것까지 함께** 한 번에 확인합니다. 원인을 보지 않고 누르지 않습니다.\n3. 확인은 되돌릴 수 없습니다. 알림 내용도 고치거나 지울 수 없습니다.\n\n## 5. 중요 스위치\n\n> 스위치는 모두 사이트 설정(`site_settings`)입니다. 바꾸면 감사 기록이 남고, 아래 「알림」 칸이 ○인 것은 운영 알림 「중요 설정 바뀜」이 생깁니다.\n> 「되돌리는 쪽」(끄기 · 간주 다시 켜기)은 언제나 바로 됩니다 — 문제가 생기면 곧바로 되돌릴 수 있게 만든 원칙입니다.\n\n### 5-1. 한눈에\n\n| 스위치 | 설정 키 | 어디서 | 켜기 | 끄기 | 알림 |\n|---|---|---|---|---|---|\n| 주문 받기 | `mall.order_open` | 대시보드 › 공개 직후 지켜보기 「주문 받기 켜기 / 끄기」 | **SUPER** | ADMIN 도 | ○ |\n| 입점 신청 받기 | `mall.tenant` | 정산 › 소개몰 정산 › 입점 신청 「켜기 / 끄기」 | **SUPER** | ADMIN 도 | ○(v10.203 부터) |\n| 새 가입 받기 | `signup.open` | 대시보드 「가입 잠시 막기 / 가입 다시 받기」 | ADMIN | ADMIN | ○ |\n| 간주 모드 4종 | `assume.payment` · `assume.broker` · `assume.etax` · `assume.bank` | 관 관리 › 오픈 체크리스트 › 관리자 스위치 | (간주 끄기) 조건 맞을 때 | (간주 다시 켜기) 언제나 | ○ |\n| 소개비 기능 | `feature.referral_fee` | 같은 곳 「소개비 켜기 / 끄기」 | 조건 맞을 때 | 언제나 | ○ |\n| 다국어 | `i18n.enabled` | 관 관리 › 번역 「다국어 켜기 / 끄기」 | ADMIN | ADMIN | × |\n| AI 전체 · 기능별 | `agent.enabled` 등 `agent.*` · AI 번역 설정 | 위험감지 › AI 운영 › AI 에이전트 | **SUPER** + 조건 | **SUPER** | × |\n| 회원 투표 만들기 | `poll.member_create` | 소개광장 › 투표 관리 「켜기 / 끄기」 | ADMIN | ADMIN | × |\n| 메인 투표 자동 채우기 | `poll.home_autofill` | 같은 곳 「자동 채우기 끄기」 | ADMIN | ADMIN | × |\n| 운영자 2단계 인증 | `admin.mfa_required`(off · SUPER · ALL) | 권한 계층 › 내 2단계 인증 「설정 바꾸기」(v10.203) | **SUPER** + 본인 먼저 등록 | **SUPER** | ○ |\n| 급한 알림 텔레그램 대화방 | `ops.telegram_chat` | 운영 알림 「대화방 찾기」 → 고르기 | **SUPER**(v10.203 서버도) | **SUPER** | × |\n| 하루 요약 텔레그램 | `ops.telegram_digest`(기본 on) | 운영 알림 「하루 요약 끄기 / 하루 요약도 받기」 | **SUPER**(v10.203 서버도) | **SUPER** | × |\n| 운영자 낯선 로그인 알림 | `ops.staff_login_alert`(기본 on) | 운영 화면 칸 없음 | — | 끄는 것은 권하지 않음(docs/320 4-2) | × |\n\n### 5-2. 주문 받기 (`mall.order_open`)\n\n| 항목 | 내용 |\n|---|---|\n| 끄면 | 소개몰 상품 보기 · 장바구니 담기는 되고 **주문 · 결제만** 막힘 |\n| 지금 원칙 | **결제대행사(PG) 연결 전에는 끈 채로 둡니다**(open-blockers #27 · #29). 간주 결제가 켜져 있으면 손님 주문이 돈 없이 「결제 완료」가 됩니다 |\n| 켜기 전 확인 | ① 정말 시연 · 시험 주문이 필요한지 대표 확인 ② 간주 결제 상태(같은 줄 「간주 결제 켜짐(시험 결제)」) ③ 끝나고 정리할 사람(시험 결제 주문 정리는 SUPER) |\n| 켜는 법(간주 결제 켜짐일 때) | SUPER 가 「주문 받기 켜기」 → 경고 칸 → 사유 10자 이상 · 확인 문구 **「시험 결제 주문을 받습니다」** · 「저절로 끄기」 1 · 2 · 4 · 8 · 24시간 중 고르기(기본 2) → 「그래도 켜기」 |\n| 켜면 일어나는 일 | ① 운영 화면 모든 쪽에 **빨간 띠**(「… 에 저절로 꺼짐」) ② 운영 알림 「중요 설정 바뀜」(사유 포함 · 급한 알림) ③ 고른 시간이 지나면 정기 작업(10분마다)이 저절로 끄고 「주문 받기 저절로 꺼짐」 ④ 시험 결제 주문이 생기면 「시험 결제 주문」 알림 |\n| 서버가 막는 조건 | 403 `ORDER_SETTING_SUPER`(SUPER 아님) · 422 `ORDER_OPEN_CONFIRM`(확인 문구 다름) · 422 `ORDER_OPEN_REASON`(사유 10자 미만) · 422 `ORDER_OPEN_HOURS`(1 · 2 · 4 · 8 · 24 밖) · 422 `ORDER_UNTIL_AUTO`(꺼질 시각 `mall.order_open_until` 을 직접 고치려 함) |\n| 끄는 법 | 「주문 받기 끄기」 → 확인 창 → 끝. ADMIN 도 됩니다. 꺼질 시각도 함께 지워집니다 |\n\n### 5-3. 입점 신청 받기 (`mall.tenant`)\n\n| 항목 | 내용 |\n|---|---|\n| 켜면 | 사용자 웹 머리줄에 **가게 아이콘**(로그인한 회원 모두) → 입점 신청 화면. 운영은 같은 화면에서 「승인」 · 「반려」 |\n| 켜기 전 순서 | ① 입점 약관(HLT_SELLER) 법무 확인 ② 약관 화면에서 시행일 넣고 게시(7절) ③ SUPER 가 「켜기」 ④ 판매 시작은 결제대행사 하위가맹점 계약 · 하위가맹점 ID · 주문 받기 켜기(간주 결제 끈 뒤) 다음 |\n| 켜도 되는 범위 | **신청 접수 · 심사까지만** 실제로 동작. 판매 · 판매대금 지급은 ④ 뒤 |\n| 서버가 막는 조건 | 403 `TENANT_SETTING_SUPER` · 422 `TENANT_TERMS_FIRST`(입점 약관이 아직 시행 중이 아님) |\n| 알림 | 켜고 끄면 운영 알림 「중요 설정 바뀜」(v10.203 · 누가 · 사유) |\n| 지금 | 꺼짐(v10.202 적용으로 켜지지 않음 · docs/320 4-3 「누르지 않습니다」) |\n\n### 5-4. 새 가입 받기 (`signup.open`)\n\n1. 「가입 잠시 막기」를 누르면 가입 화면에 안내만 나오고 가입이 막힙니다(서버 422 `SIGNUP_CLOSED`). **기존 회원 로그인은 그대로**입니다.\n2. 쓰는 때: 가입 급증 · 자동 가입(같은 모양의 계정이 몰림)이 보일 때.\n3. 같은 줄에 「안내 띠 올리기 / 내리기」가 있습니다 — 사용자 웹 맨 위 안내(200자 안). 기본 문구 「시범 운영 중입니다 — 소개몰 결제 등 일부 기능은 시험 모드로 동작합니다.」\n4. 다시 받을 때는 「가입 다시 받기」.\n\n### 5-5. 간주 모드 4종 · 소개비 (오픈 체크리스트 › 관리자 스위치)\n\n| 스위치 | 「실제로 돌리는 쪽」 | 서버가 보는 조건 | 막힐 때 |\n|---|---|---|---|\n| 전자세금계산서 간주 `assume.etax` | 간주 끄기(국세청 실제 전송) | 전자세금계산서 연동 시험 중 · 연결됨 + (「간주 끄기 전 설정 확인」 켜짐이면) 업체 주소 · 키 + 7일 안 키 확인 · 시험 발행 성공 | 422 `SWITCH_PREREQ` · `ETAX_CONFIG_FIRST` · `ETAX_TEST_FIRST` |\n| 중개사 인증 간주 `assume.broker` | 간주 끄기(국토부 실제 대조) | 국토부 중개사 대조 시험 중 · 연결됨 | 422 `SWITCH_PREREQ` |\n| 결제 간주 `assume.payment` | 간주 끄기(실제 결제) | 전자결제(PG) 시험 중 · 연결됨 | 422 `SWITCH_PREREQ` |\n| 수금 계좌 간주 `assume.bank` | 간주 끄기 | 사이트 기본 정보에 실제 수금 계좌 세 항목(시험용 글자 아님) | 422 `SWITCH_PREREQ` |\n| 소개비 기능 `feature.referral_fee` | 소개비 켜기 | 본인인증 · 1원 계좌인증이 모두 연결됨(LIVE) | 422 `SWITCH_PREREQ` |\n\n1. 끄는 순서(화면 안내): **전자세금계산서 → 중개사 → 결제 → 수금 계좌 → 소개비 켜기**.\n2. 지금은 외부 연동이 끝나지 않아 간주를 끌 조건이 맞지 않습니다. 단추가 흐리게 보이는 것이 정상입니다.\n3. 화면 안내: 「간주 모드를 하나라도 남긴 채 사용자 웹 접근 제한을 풀지 마십시오.」 — 사용자 웹은 2026-11-01 대표 결정으로 간주 모드인 채 공개되었습니다(open-blockers #27 · 대표가 위험을 알고 결정).\n4. 오픈 체크리스트 탭은 SUPER 만 봅니다.\n\n### 5-6. 다국어 (`i18n.enabled`)\n\n1. 「다국어 켜기」 → 확인 창 「1분 안에 손님 화면 머리에 언어 단추가 나옵니다. 승인하지 않은 번역은 한국어 그대로 보입니다.」\n2. **승인한 번역만** 손님 화면에 나갑니다. 켜기 전에 번역 화면에서 번역을 넣고 승인해 둡니다.\n3. AI 자동 번역 · 「번역 보기」(소개광장)는 AI 설정이라 SUPER 만 바꿉니다.\n4. 운영에서 지금 켜져 있는지는 추가 확인이 필요합니다.\n\n### 5-7. AI (`agent.*`)\n\n| 항목 | 내용 |\n|---|---|\n| 누가 | SUPER 만(403 `AI_SETTING_SUPER`) |\n| 켜기 전 확인 | ① AI 키(위험감지 › AI 운영 › AI 에이전트 › 「AI 키」) ② 월 상한(0 보다 큰 달러 · 이번 달 비용보다 커야) ③ 국외 이전 조항(AI 고지)이 든 개인정보처리방침이 게시돼 있어야 함 ④ 모델이 요금표에 있어야 함 |\n| 서버가 막는 조건 | 422 `SWITCH_PREREQ`(키 · 상한) · `PRIVACY_FIRST`(처리방침 전) · `MODEL_UNPRICED`(요금표에 없는 모델) |\n| 켜면 | 켠 기능만 AI 를 부르고 **부를 때마다 비용**이 듭니다. 월 상한에 닿으면 저절로 꺼지고 긴급 알림 `AGENT_CAP_REACHED` |\n| 지금 | 기본값 꺼짐. 운영 값은 추가 확인이 필요합니다 |\n\n### 5-8. 회원 투표 만들기 · 메인 투표\n\n1. 「회원이 투표 만들기」(`poll.member_create` · 기본 꺼짐): 켜면 회원이 「궁금해요」 · 「써본 의견」 투표를 만들 수 있고 만들자마자 열립니다. 메인에는 나가지 않고, **신고 3건이면 저절로 감춰집니다**(알림 `POLL_HIDDEN_BY_REPORTS`).\n2. 메인 「이건 어때?」 세 자리가 비면 사용자 웹에 「준비 중」이 보입니다. 대시보드 「메인 투표(3자리 중)」 칸이 3 아래면 노랗습니다.\n3. 빈 자리는 SUPER 가 「확정 질문으로 빈 자리 채우기」 — **비어 있는 종류만** 확정 질문으로 만들고 바로 엽니다(표 0). 같은 질문이 이미 있으면 만들지 않고 알려 줍니다.\n\n### 5-9. 운영자 2단계 인증 (`admin.mfa_required`)\n\n1. 값: off(쓰지 않음) · SUPER(최고 관리자만) · ALL(운영 역할 모두 — 검수 · 운영 · 지급 · 최고 · 안심 파트너 · 제휴 파트너).\n2. 켜기 전에 **켜는 사람이 먼저** 권한 계층 › 내 2단계 인증 「2단계 인증 등록」을 마쳐야 합니다(아니면 422 `MFA_ENROLL_FIRST` — 스스로 잠기는 일을 막음).\n3. 켜면 운영 화면 로그인 뒤 6자리 번호를 넣어야 하고, 한 번 넣으면 `admin.mfa_hours`(기본 12시간) 동안 다시 묻지 않습니다.\n4. 휴대폰을 잃어버린 운영자는 SUPER 가 회원 상세에서 「2단계 초기화」(본인 확인 뒤 · 사유 5자 이상).\n5. 운영 화면에서 바꾸는 곳: 권한 계층 › 내 2단계 인증 「설정 바꾸기」(SUPER · v10.203 · 바꾸면 「중요 설정 바뀜」). 아무도 들어오지 못할 때 서버에서 비상으로 끄는 길은 `deploy/aws/mfa-reset.sh off`(서버 담당 · 사람이 · 「중요 설정 바뀜」 알림이 via DB 로 남음).\n6. 지금 운영은 꺼진 채입니다(docs/318 계기 글).\n\n### 5-10. 급한 알림 텔레그램 · 하루 요약\n\n| 순서 | 할 일 | 누가 |\n|---|---|---|\n| 1 | 텔레그램에서 봇을 만들고 토큰 받기(BotFather) | 대표 |\n| 2 | 통합 현황 › 외부 연동 › 연동 키 › 메일 칸 「텔레그램 봇 토큰」에 넣기 | SUPER |\n| 3 | 텔레그램에서 봇에게 아무 말이나 한 번 | 대표 |\n| 4 | 위험감지 › 운영 알림 「대화방 찾기」 → 대화방 고르기 → 「시험 메시지 보내기」(1분에 한 번) | SUPER |\n| 5 | 줄이 「급한 알림 텔레그램 준비됨」이면 끝. 하루 요약도 매일 09:00 같은 대화방으로(끄려면 「하루 요약 끄기」) | — |\n\n- 「준비 안 됨」 까닭: 「봇 토큰 없음」 · 「받을 대화방 없음」. 시험이 실패하면 「봇 토큰이 맞지 않음」 · 「텔레그램으로 나가는 길 막힘」 · 「텔레그램 응답 없음」 · 「텔레그램이 거절(대화방 번호 확인)」.\n- 「나가는 길 막힘」이면 서버 담당이 운영 서버의 바깥 연결(api.telegram.org)을 확인합니다(docs/316).\n- 텔레그램 요금 · 정책은 추가 확인이 필요합니다.\n- 급한 알림 메일은 「시험 메일 보내기」(SUPER)로 확인합니다. 받는 주소는 하루 요약 받는 주소(`ops.digest_to`)입니다. 지금은 메일 설정이 없어 「준비 안 됨」이 정상입니다.\n\n## 6. 메뉴별 하는 일\n\n> 순서는 운영 화면 위 묶음 메뉴(`GROUPS`) 순서입니다. 탭이 하나뿐인 묶음은 탭 줄이 없습니다. 「(SUPER)」 표시는 그 탭을 SUPER 만 봅니다.\n\n### 6-1. 대시보드\n- **대시보드**(SB-ADM-DSH-010) — 「오늘 처리해야 할 것과 처리할 수 있는 양」. 맨 위 「공개 직후 지켜보기」(ADMIN · SUPER) 칸을 누르면 해당 화면으로 갑니다. 그 아래 숫자 5칸(검수 대기 · 정산 승인 대기 · 신규 가입 승인 · 업종 신청 · 파트너 입점 · 검수) · 「검수 처리 여력」(하루 처리 기준 · 기본 50건) · 「확인이 필요한 것」 · 「활주로」(손익분기 · 필요 유료회원 등 · 실제 매출과 넣은 월 비용으로 계산) · 「다른 운영 화면」.\n- 주요 단추: 「주문 받기 켜기 / 끄기」 · 「가입 잠시 막기」 · 「안내 띠 올리기」 · 「어제 요약 보기」 · 「시험 결제 주문 정리(발송 전 취소 · 알림)」(SUPER).\n\n### 6-2. 검수\n- **검수 큐** — 매물(리스팅) 검수. 기한 24시간 · 남은 4시간 미만은 임박. 「SLA 순」 · 「AI 의견 순」 · 「열기」 → 사유를 고르고 「반려」 또는 「승인」. **사유를 고르기 전에는 반려할 수 없습니다.** 같은 등록자가 제한업종 · 금칙 표현으로 3회 반려되면 7일 등록 정지(관리자에게도 알림). 「AI 의견과 같게 확인」은 AI 가 켜졌을 때만 뜻이 있고, 결정 · 책임은 검수자에게 있습니다.\n- **자동검수 규칙** — 금칙어와 제한업종. 「배포 없이 바뀌지만, 잘못 넣으면 정상 등록이 반려됩니다.」 「규칙 추가」 · 「등록 차단」.\n- **표본 감사** — 자동 승인된 건을 표본(약 5%)으로 다시 봅니다. 「적정」 · 「부적정」(부적정이면 그 매물 노출 중단) · 「표본 다시 뽑기」.\n- **배지 신청** — 신뢰 배지 신청 「승인」 · 「반려」. 배지는 목록 노출에 영향을 주므로 근거 없이 주지 않습니다.\n- **소개몰 리뷰 · 문의** — 효능 · 효과 단정 표현에 걸린 리뷰만 확인(「가리기」 · 「보이기」) · 상품 문의는 운영자가 답합니다.\n\n### 6-3. 파트너사\n- **파트너사** — 파트너센터에서 올라온 것을 본사가 처리. 하위 탭: 파트너사 목록 · 입점 신청 · 서비스 검수 · 리드 배정 · 리드 반려 · 리드 이용료 · 정산 · 의료 심의 · 카테고리 마스터 · 자격 심사. 돈이 걸린 일(이용료 등)은 ADMIN 만.\n- **안심소개 입점 심사** — 안심소개 입점 신청을 축별로 「승인」 · 「반려」. 「중개사 인증이 먼저입니다」 안내가 뜨면 자격 심사부터.\n- **법률·세무 정액 노출** — 전문가 정액 노출. 「입금 확인 · 노출 켜기」 · 「연장 입금 확인」 · 「반려」(사유 5자 이상 · 업체에게 그대로 보임) · 「종료」.\n\n### 6-4. 정산\n- **정산** — 「신청 → 승인 → 지급 실행」. 「승인」 · 「반려」. 소개비에서 떼는 금액은 없고, 지급은 당사자가 직접 합니다(화면 설명 INV-9 · INV-11).\n- **지급** — 지급 데스크. 운영이 「확정」, 지급 담당(PAYOUT)이 「지급 기록」 · 광고비 「입금 기록」. 자기가 확정한 건은 자기가 지급 기록을 못 남깁니다.\n- **소개몰 정산** — 주 단위 마감(배송 완료 뒤 7일 지난 건만). 「이번 주 마감」 · 반품 · 교환 처리 · 「지급 요청」. 맨 위 **입점 신청** 구역에 「입점 신청 받기 켜짐 / 꺼짐」 줄(5-3)과 신청 「승인」 · 「반려」.\n- **청구** — 구독료 청구 현황(매출 감시). 「지금 대조」 · 「지금 청구 실행」 · 유예 일수 · 재시도 횟수 「저장」(설정이라 바로 반영). 결제는 지금 간주 모드입니다.\n\n### 6-5. 거래\n- **거래 모니터링** — 진행 중 거래 · 분쟁. 7일간 양측 확인이 안 된 건이 자동으로 올라옵니다. **관리자도 임의로 성사를 확정할 수 없습니다.** 「분쟁 처리로」.\n- **분쟁** — 접수된 분쟁 처리(「보는 중」 · 「저장」). 분쟁이 걸린 거래는 정산이 보류됩니다.\n- **소개몰 주문** — 결제 완료 주문 발송: 택배사 · 송장번호 넣고 「발송 처리」 → 「배송 완료로」. 「송장 고치기」. 지금 결제는 간주 모드라 「결제 완료」가 실제 입금이 아닐 수 있습니다.\n\n### 6-6. 회원\n- **회원** — 이름 · 이메일 · 연락처로 「찾기」 → 회원 상세. 「상태 변경」(정상 ↔ 정지 · 사유 필수 · 지울 수 없음) · 「등록 정지 풀기」 · 「잠금 풀기」(고객센터 본인 확인 뒤) · SUPER 만 「링크 만들기」(비밀번호 재설정 · 메일 준비 전) · 「2단계 초기화」.\n- **사업자 인증** — 사업자 신청 「승인」 · 「반려」 · 회원 「정지」 · 「정지 해제」. 승인 시각이 소개비 수령 자격의 기준일입니다.\n\n### 6-7. 업종\n- **업종 승인** — 업종은 열린 집합: 신청 → 「승인」 / 「반려」 → 노출.\n\n### 6-8. 노출\n- **메인 운영** — 메인에 무엇을 띄울지(배포 없이 바로 반영). 하위: 배너 · 공지(ADMIN) · 관 노출 · 화면 구성 · 콘텐츠(SUPER). 광고는 추천 순위에 섞이지 않고 별도 자리에만 나갑니다.\n\n### 6-9. 정책\n- **정책**(SUPER) — 화면이 따르는 규칙의 원본. 값이 바뀌면 화면 문구와 계산이 함께 바뀝니다.\n- **코드 라벨**(SUPER) — 화면에 보이는 상태 문구. 코드는 고정, 라벨만 바뀝니다(운영 · 이용자 쪽).\n\n### 6-10. 관 관리\n- **관 관리** — 관(사이트) 목록 · 순서. 새 관 만들기 · 관 설정 · 공유 경계는 SUPER.\n- **관 UI/UX** — 관마다 화면 축을 켜고 끄고 UI 유형을 정합니다.\n- **통합 허브**(SUPER) — 통합 메인(관으로 보내는 허브) 관리.\n- **오픈 체크리스트**(SUPER) — 오픈을 막는 항목. 위에 「대표 결정 · 법무 / 업체 대기 / 운영 화면에서 바로 / 날짜만 정하면 됨」 요약 · 「종류별로 보기」. 아래에 **관리자 스위치**(5-5). 「하나라도 미충족이면 열리지 않습니다」.\n- **법정 고지** — 바닥줄 법정 고지 원본(「주소 반영」 · 「저장」 · 「오픈 체크리스트로」) · 요청 열람 한도 · 소개코드 범위 · 사회관계망 주소 · 맨 아래 **약관** 구역(SUPER).\n- **약관**(SUPER) — 7절.\n- **번역** — 번역을 넣고 「승인」 · 「반려(사유)」. 「다국어 켜기 / 끄기」(5-6).\n- **소개몰 상품** — 상품 · 옵션 · 재고 · 그림 · 고시 「고치기」.\n\n### 6-11. 광고\n- **광고** — 소재 · 슬롯 · 세그먼트. 「심의필 확인」 · 「정상」 / 「중지」.\n- **광고 과금** — 광고주 · 청구 · 입금 · 미수금(광고비는 소개비와 따로). 입금 기록은 지급 담당이 지급 화면에서.\n- **외부 송출** — 외부 사이트 광고(클릭당 과금). 「도메인 확인」 · 「승인」 · 「보류」. 「자기가 신청한 것은 승인할 수 없습니다」.\n- **퍼블리셔 지급** — 「월 마감 → 명세서」 → 신청 → 승인 → 「집행」(지급 담당). 퍼블리셔 실제 지급은 닫아 두고 정산서 · 장부까지만 운영합니다(프로젝트 규칙).\n\n### 6-12. 위험감지\n- **위험감지** — 규칙이 만든 경보마다 근거 · 오탐 가능성. 「조치 완료」 · 「오탐」. 「탐지 질의가 깨진 규칙 N건」 경고가 뜨면 개발에 보고.\n- **운영 알림** — 4절.\n- **신고 처리** — 오래된 것이 위로. 처리 내용(신고한 분에게 그대로 전달)을 적고 「신고가 맞습니다」 / 「아닙니다 (기각)」. 처리 내용 없이는 닫을 수 없습니다.\n- **AI 운영** — 분류 · 검색 · 성향 · 위험감지 품질과 학습. 하위: 분류 품질 · 분류 학습 · 검색 사전 · 검색 파서 · 성향 학습 · 위험감지 학습 · 에이전트(AI 스위치 · 월 상한 · 사용량 — SUPER).\n- **감사** — 감사 징후를 보고 「판단 기록」. 「기록 보기」는 운영 · 회원 행위 기록(고치거나 지울 수 없음).\n- **개인정보 접속기록**(SUPER) — 운영자가 개인정보를 본 기록을 달마다 점검 → 「점검 완료」(고칠 수 없음).\n- **운영자 권한**(SUPER) — 운영자별 역할 · 마지막 로그인 · 2단계 등록을 분기마다 점검 → 점검 완료.\n- **파기 기록** — 매일 03:00 개인정보 파기 작업이 지운 건수(날짜별 · 달별).\n- **권리 요청** — 8-4.\n- **서버 오류** — API 가 지난 1시간 보낸 서버 오류(5xx) 최근 50건(요청 내용 · 개인정보는 남기지 않음 · API 를 다시 띄우면 지워짐). 「새로 보기」.\n\n### 6-13. 인증 심사\n- **자격 심사** — 자동 대조를 통과한 신청만 사람이 봄. 하위: 중개사 인증 심사 · 규제 자격 심사 · 의료 심의 · 카테고리 마스터. 「승인」 · 「반려」(사유 필수). 중개사 대조는 지금 간주 모드라 실제 국토부 대조가 아닙니다.\n- **소유 확인** — 등기사항증명서를 직접 보고(「문서 열기」) 「승인」 · 「거절」.\n\n### 6-14. 소개광장\n- **글 검수** — 첫 글 · 신고된 글 「승인」 · 모든 글 · 댓글을 「찾기」 → 「감추기」 · 「되살리기」.\n- **이건 어때? 투표** — 투표 「만들기 (준비 중으로)」 · 「열기」 · 「마감」 · 「감추기」 · 「고름(메인에 내기)」 · 「메인에서 빼기」 · 회원 투표 만들기 스위치 · 자동 채우기 · 「확정 질문으로 빈 자리 채우기」(SUPER).\n- **이벤트** — 지급 대기를 먼저 보여 줌. 「지급 처리」.\n\n### 6-15. 제휴\n- **제휴** — 관리자가 승인해야 링크 발급. 하위: 입점 심사 · 제휴상품 · 단가 · 목표 설정 · 마케팅자료 · 가이드 · 트랙별 정산(정산은 ADMIN · PAYOUT).\n\n### 6-16. 통합 현황\n- **통합 현황**(SUPER) — 지금 상태 한 장(실제 DB 조회값 · 등록된 서버 주소).\n- **외부 연동**(SUPER) — 연동 상태와 다음 할 일(「키 발급 · 등록」 · 「계약 · 발신 IP 등록」 등) · 연동 키(텔레그램 봇 토큰 포함) · 본인인증 · 알림톡 · 메일 · 전자계약 · 안심번호 패널. **연동은 대부분 끝나지 않았습니다**(간주 · 시험 방식).\n- **경영 지표** — 어긋남 신호 · 결정 대기 · 매출 · 최근 30일 · 월 비용 넣기(활주로 계산용).\n- **수집 관리** — 식약처 성분 데이터를 받아 대조(게이트를 모두 통과해야 돎).\n\n### 6-17. 권한 계층\n- **권한 관리** — 「권한 보유자」(회수 · 사유) · 「역할 주기」(찾기 → 역할 고르기 → 사유 → 「주기」 · SUPER) · 「권한 계층」. 줄 수 있는 역할: 안심 파트너 담당 · 제휴 파트너 담당 · 검수 담당 · 운영 · 최고 관리자.\n- **내 2단계 인증** — 모든 운영 역할. 「2단계 인증 등록」(휴대폰 인증 앱). 설정이 꺼져 있어도 미리 등록할 수 있습니다.\n\n### 6-18. 불변식\n- **불변식** — 감시 뷰(지켜야 할 규칙이 깨졌는지 보는 목록)를 한 번에 훑습니다. 건수가 생기면 개발에 보고.\n\n## 7. 약관 · 처리방침 게시 순서\n\n> **원칙: 법무가 확인한 글만, 운영 화면에서 게시합니다.** 서버 스크립트 `publish-terms.sh` 는 쓰지 않습니다(docs/300 ~ 320 「하지 말 것」).\n> 약관 게시는 SUPER 만 합니다(약관 API 전체가 SUPER).\n\n### 7-1. 순서\n\n| 순서 | 할 일 | 어디서 · 무엇을 | 누가 |\n|---|---|---|---|\n| 1 | 초안 고치기 | 관 관리 › 약관 → 「고치기」 → 판 번호 · 본문(50자 이상) → 「바뀐 곳 보기」 → 「저장(게시 아님)」. 게시 · 보관된 판은 고칠 수 없어 새 판 번호로 저장됩니다 | SUPER |\n| 2 | 법무 검토 묶음 만들기 | 「법무 검토용 내려받기」 → HTML 파일 한 개(게시 안 된 초안 전부 · 지금 게시판과 바뀐 줄 초록/빨강 · 남은 〔미확정〕 노란 표시 · 확인 칸). 브라우저로 열어 PDF 로 인쇄해 보냄 | SUPER |\n| 3 | 법무 확인 | 법무가 읽고 고칠 곳을 알려 줌. **이 파일은 검토를 돕는 자료일 뿐, 법적 판단은 법무가 합니다.** 파일은 공개된 곳에 올리지 않습니다 | 대표 · 법무 |\n| 4 | 〔미확정〕 채우기 | 본문에 〔미확정〕이 한 곳이라도 있으면 「게시」 단추가 눌리지 않습니다(서버도 `TERM_HOLES`) | SUPER |\n| 5 | 시행일 정하기 | 「시행일」 칸(오늘 이후 · 오픈일에 맞추는 것을 권함). 회원에게 불리한 변경이면 「회원에게 불리한 변경(30일 전 고지)」 체크 | SUPER · 법무 판단 |\n| 6 | 게시 | 「게시」 → 확인 창(앞 판은 시행일 전날까지 그대로 · 재동의는 시행일부터 · 「법무 확인을 마친 글입니까?」) → 확인 | SUPER |\n| 7 | 결과 확인 | 「… 을 시행 예정으로 게시했습니다 … 남은 오픈 차단 N건」 글 · 표의 상태 「시행 예정」 | SUPER |\n\n### 7-2. 게시 때 알아 둘 것\n\n1. **시행일 고지 기간**(이용약관 제14조 · 화면 확인 창 기준): 시행 7일 전 고지 · 회원에게 불리한 변경은 30일 전. 불리한 변경을 30일 안으로 게시하면 서버가 거절합니다(`TERM_ADVERSE_30D`). 실제 법 기준은 법무 확인이 필요합니다.\n2. 시행일 전까지는 앞 판이 그대로 시행되고, 사용자 웹에 「바뀔 약관」 알림이 나갑니다.\n3. 「시행 예정 게시 때 회원 알림」이 「보냄」이면 회원마다 「약관 변경 안내」 1건이 갑니다(사이트 안. 메일 · 알림톡은 켜진 뒤).\n4. 「새 판 재동의: 시행일부터」가 기본입니다. 「게시 즉시로 바꾸기(법무 판단 뒤)」는 법무 판단 없이 누르지 않습니다.\n5. 게시하면 이용자와의 계약 조건이 되고, 되돌려도 이미 받은 동의 기록은 남습니다.\n6. 시행일 전이고 동의 기록이 없을 때만 「예정 취소」가 됩니다(법무 검토 판으로 돌아감). 동의가 한 건이라도 있으면 새 판으로 바꿔야 합니다(`TERM_HAS_CONSENT`).\n7. 시행 예정인 판이 이미 있으면 새로 게시할 수 없습니다 — 먼저 그 판을 「예정 취소」(`TERM_SCHEDULED_EXISTS`).\n8. **개인정보처리방침**은 표에 「국외 이전 조항 있음(AI 켜기 조건) / 없음」이 함께 보입니다. AI 를 켜려면 이 조항이 든 판이 게시돼 있어야 합니다(5-7).\n9. **입점 약관(HLT_SELLER)**을 게시해야 「입점 신청 받기」를 켤 수 있습니다(5-3).\n10. 운영의 게시 안 된 초안 수 · 남은 〔미확정〕 수는 운영 화면 결과 글로만 알 수 있습니다(9절).\n\n## 8. 비상시 판단 순서\n\n### 8-1. 「운영자 낯선 로그인」이 본인이 아님\n\n| 순서 | 할 일 | 누가 |\n|---|---|---|\n| 1 | 알림 「자세히」에서 계정(이메일 앞 두 글자) · 역할 · IP 대역 · 브라우저 · 까닭을 적어 둠 | 본 사람 |\n| 2 | 그 운영자에게 전화 등 **다른 길로** 직접 확인 | 본 사람 |\n| 3 | 본인이 아니면 대표(SUPER)에게 바로 알림 | 본 사람 |\n| 4 | 그 계정 비밀번호를 바꾸고 「모든 기기에서 로그아웃」 — 운영 화면 › 권한 계층 › 내 2단계 인증(v10.203 · 운영 역할 모두 · 지금 비밀번호 필요) | 그 운영자 |\n| 5 | 그래도 의심되면 SUPER 가 회원 상세 「상태 변경」 → 정지(사유 필수 · 정지된 계정은 로그인이 막힘) 또는 권한 관리에서 역할 회수 | SUPER |\n| 6 | 그 계정이 바꾼 것을 확인: 운영 알림 「중요 설정 바뀜」(by) · 위험감지 › 감사 › 기록 보기 | SUPER |\n| 7 | 2단계 인증이 꺼져 있으면 켜는 것을 검토(5-9) | 대표 |\n| 8 | 알림 「확인」(메모에 한 일) | SUPER |\n\n- 정지 · 역할 회수는 **다음 요청부터 바로** 적용됩니다(서버가 요청마다 계정 상태와 역할을 다시 읽음 — 정지된 계정은 비로그인으로 봄).\n\n### 8-2. 「주문 받기」가 잘못 켜짐\n\n| 순서 | 할 일 |\n|---|---|\n| 1 | **먼저 끕니다.** 대시보드 「주문 받기 끄기」(ADMIN 도 됨) → 빨간 띠가 사라졌는지 확인 |\n| 2 | 대시보드 「시험 결제 주문」 칸 숫자 확인 |\n| 3 | 0 보다 크면 SUPER 가 「시험 결제 주문 정리(발송 전 취소 · 알림)」 — 발송 전 주문을 취소하고 주문한 분께 알림(돈은 받지 않았으므로 환불 없음) |\n| 4 | 이미 발송 처리한 주문이 있으면 소개몰 주문 화면에서 하나씩 확인하고 대표에게 보고(정리 단추는 발송 전 주문만 취소) |\n| 5 | 운영 알림 「중요 설정 바뀜」에서 누가 · 어디서(APP / DB) · 사유 확인 → 대표 보고 |\n| 6 | 관련 알림(`SETTING_CHANGED` · `ORDER_OPEN_NO_END` · `STUB_PAYMENT_ORDER`) 「확인」 |\n\n### 8-3. 이상 거래 · 위험감지\n\n1. 위험감지 › 위험감지에서 경보의 근거 · 규칙 원문 · 오탐 가능성을 봅니다.\n2. 실제 문제면: 해당 매물 · 글을 감추거나(글 검수 · 표본 감사 「부적정」) 회원을 「상태 변경」 → 정지(사유 필수).\n3. 거래가 걸려 있으면 거래 모니터링 → 분쟁 처리로(분쟁이 걸리면 정산 보류).\n4. 처리 뒤 경보 「조치 완료」, 잘못 잡은 것이면 「오탐」(오탐을 따로 세야 규칙을 고칠 수 있음).\n5. 「탐지 질의가 깨진 규칙」이 보이면 개발에 보고합니다.\n6. 돈이 걸린 이상(정산 정합성 · 청구 금액 불일치 알림)은 정산 승인 · 지급을 멈추고 대표 · 개발에 보고합니다.\n\n### 8-4. 개인정보 권리 요청 (열람 · 정정 · 삭제 · 처리정지)\n\n| 순서 | 할 일 |\n|---|---|\n| 1 | 위험감지 › 권리 요청 「처리 중」에서 기한 가까운 것부터. 기한은 접수일 + `privacy.request_due_days`(기본 10일) |\n| 2 | **본인 확인**(회원 상세에서 계정 확인) |\n| 3 | 요청대로 처리(정정 · 삭제 등은 해당 화면에서) |\n| 4 | 결과를 5자 이상 적고 「처리 완료」 — 회원에게 그대로 알림. 끝난 요청은 고칠 수 없음 |\n| 5 | 거절할 때는 사유를 적고 「거절」 |\n| 6 | 기한 안에 못 하면 사유를 적고 「기한 연장」(한 번만) |\n\n- 법정 처리 기한 · 연장 · 거절 사유의 법 기준은 최신 법령 확인이 필요합니다(화면 안내 · docs/283).\n\n### 8-5. 서버 오류 급증\n\n| 순서 | 할 일 |\n|---|---|\n| 1 | 대시보드 「서버 오류(1시간)」 칸 → 위험감지 › 서버 오류 |\n| 2 | 「많이 난 곳」 주소 · 시각 · 건수를 적음(요청 내용 · 개인정보는 남지 않음) |\n| 3 | 사용자 웹에서 그 기능을 한 번 해 보고 되는지 확인 |\n| 4 | 개발 · 서버 담당에 보고. 운영 서버 조치(재시작 · 되돌리기)는 **대표 승인 뒤 서버 담당(ubuntu)이** 합니다 |\n| 5 | 디스크가 같이 높으면 `DISK_LOW` 처리를 먼저 |\n| 6 | 원인이 해결되면 `SERVER_ERROR_SPIKE` 「확인」 |\n\n- 서버 오류 목록은 API 를 다시 띄우면 지워집니다. 적어 두고 보고합니다.\n\n### 8-6. 가입 급증 · 자동 가입\n\n1. 회원 화면에서 최근 가입 모양을 봅니다.\n2. 이상하면 대시보드 「가입 잠시 막기」(기존 회원 로그인은 그대로).\n3. 필요하면 「안내 띠 올리기」로 사용자에게 알립니다.\n4. 대표에게 보고하고, 풀 때는 「가입 다시 받기」.\n\n## 9. 확인하지 못한 것\n\n| # | 무엇 | 까닭 · 확인하는 법 |\n|---|---|---|\n| 1 | 운영 서버의 지금 판 · 설정 값(주문 받기 · 다국어 · AI · 2단계 인증 · 텔레그램 대화방) | 운영 DB 를 볼 수 없음. 인계 기록상 운영은 v10.202(11/6) · 주문 받기 꺼짐 · 메일 준비 안 됨(NO_SMTP) · 2단계 인증 꺼짐. 운영 화면에서 직접 확인 |\n| 2 | `ops.digest_to` · 알림 기준 값(`ops.*` 나머지)을 바꾸는 운영 화면 칸 | 화면 칸이 없음 — 사이트 설정 API 로만 바꿀 수 있음. 필요하면 개발에 요청 |\n| 3 | 지급 담당(PAYOUT) 역할을 주는 길 | 운영 화면 · 서버 「역할 주기」가 받지 않음. **대표 결정(11/6): 정산 · 지급을 열 때 다시 정함**(그때까지 SUPER 가 대신) |\n| 4 | `NOTIFY_STUCK`(회원 알림 못 나감)이 지금 운영에서 나는지 | 메일 · 알림톡이 준비 전이라 날 수 있음. 운영 알림 화면에서 확인 |\n| 5 | 외부 연동 7건의 실제 진행 상태 | 외부 연동 화면(SUPER)에서 확인. 업체 계약 · 심사는 개발 밖 |\n| 6 | 법정 기한(권리 요청 · 약관 고지) | 화면 안내대로 최신 법령 · 법무 확인이 필요합니다 |\n| 7 | 텔레그램 요금 · 정책 | 추가 확인이 필요합니다(docs/316) |\n| 8 | 하루 몇 번 대시보드를 볼지 · 담당자 배정 | 코드에 정해져 있지 않음 — 대표가 정함 |\n\n## 부록. 화면에 오류 코드가 떴을 때\n\n> 운영 화면에서 단추를 눌렀는데 아래 코드가 섞인 글이 나오면, 고장이 아니라 **서버가 일부러 막은 것**입니다.\n\n| 코드 | 뜻 | 할 일 |\n|---|---|---|\n| `ORDER_SETTING_SUPER` | 주문 받기 켜기는 SUPER 만 | SUPER 에게 요청(결제대행사 연결 전이면 켜지 않는 것이 원칙) |\n| `ORDER_OPEN_CONFIRM` | 확인 문구가 다름 | 「시험 결제 주문을 받습니다」를 그대로 입력 |\n| `ORDER_OPEN_REASON` | 사유가 10자 미만 | 사유를 10자 이상 |\n| `ORDER_OPEN_HOURS` | 꺼질 시각이 1 · 2 · 4 · 8 · 24시간 밖 | 목록에서 고름 |\n| `ORDER_UNTIL_AUTO` | 꺼질 시각을 직접 고치려 함 | 「주문 받기 켜기」에서만 고름 |\n| `TENANT_SETTING_SUPER` | 입점 신청 켜기는 SUPER 만 | SUPER 에게 요청 |\n| `TENANT_TERMS_FIRST` | 입점 약관이 아직 시행 중이 아님 | 7절 순서로 입점 약관부터 게시 |\n| `AI_SETTING_SUPER` | AI 설정은 SUPER 만 | SUPER 에게 요청 |\n| `SWITCH_PREREQ` | 스위치를 바꿀 조건이 아직 안 됨(연동 상태 · 키 · 월 상한 · 수금 계좌) | 글에 적힌 조건을 먼저 갖춤 |\n| `PRIVACY_FIRST` | AI 고지가 든 처리방침이 게시 전 | 처리방침 게시(7절) 뒤 |\n| `MODEL_UNPRICED` | 요금표에 없는 AI 모델 | 「모델 요금표」에 먼저 넣음(SUPER) |\n| `ETAX_CONFIG_FIRST` · `ETAX_TEST_FIRST` | 세금계산서 업체 설정 · 7일 안 시험 성공이 없음 | 외부 연동에서 키 확인 · 시험 발행 뒤 |\n| `MAIL_CONFIG_FIRST` · `MAIL_TEST_FIRST` | 메일 설정 · 7일 안 시험 메일 성공이 없음 | 외부 연동 › 메일 준비 뒤 |\n| `MFA_SETTING_SUPER` · `MFA_ENROLL_FIRST` | 2단계 인증 설정은 SUPER 만 · 켜는 사람이 먼저 등록 | 「내 2단계 인증」 등록 뒤 |\n| `TERMS_SETTING_SUPER` | 약관 설정은 SUPER 만 | SUPER 에게 요청 |\n| `TERM_HOLES` | 본문에 〔미확정〕이 남음 | 채운 뒤 게시 |\n| `TERM_ADVERSE_30D` | 불리한 변경인데 시행일이 30일 안 | 시행일을 30일 뒤 이후로 |\n| `TERM_SCHEDULED_EXISTS` | 시행 예정 판이 이미 있음 | 그 판 「예정 취소」 뒤 |\n| `TERM_HAS_CONSENT` | 이미 동의 기록이 있어 예정 취소 불가 | 새 판으로 |\n| `SETTING_FORMAT` | 값 형식이 틀림 | 글에 적힌 예처럼 |\n| `SELF_GRANT` | 자기 권한을 바꾸려 함 | 다른 SUPER 에게 요청 |\n| `MAIL_TEST_WAIT` · `PUSH_TEST_WAIT` | 시험은 1분에 한 번 | 1분 뒤 다시 |\n\n## 10. 다음 단계\n\n1. v10.203 에서 지난 9절의 4 · 5 · 6 · 7 · 9(시험 결제 정리 단추 · 텔레그램 설정 잠금 · 정지 즉시 적용 · 운영 계정 모든 기기 로그아웃 · 입점 신청 바뀜 알림)를 고치거나 확인했습니다.\n2. docs/320 적용 뒤 4-2 「운영자 낯선 로그인」을 운영진과 한 번 같이 확인합니다.\n3. 텔레그램을 켜면(5-10) 4-1 의 「지금 상태」를 고칩니다.\n"}, {"id": "manual", "name": "사용자 설명서", "who": "회원 · AI 상담 자료", "file": "323_사용자설명서_v10.202_20261106.md", "md": "# 323. 사용자 설명서 — v10.202 (2026-11-06)\n\n> 법무 확인 완료(2026-11-06 대표) · AI 상담 참고 자료로도 쓰임\n\n이 설명서는 소개뱅크(sogaebank.com) 회원이 사이트를 쓰는 방법을 주제별로 정리한 것입니다. 각 절은 따로 읽어도 이해되도록 썼습니다. 메뉴 이름은 「」, 주소는 `/...` 로 적었습니다.\n\n---\n\n## 1. 소개뱅크는 어떤 곳인가요\n\n### 1-1. 소개뱅크 한눈에 보기\n- 소개뱅크는 **소개하고 소개비를 받는 곳**입니다. 아는 상품 · 서비스 · 매물 · 사업 기회를 필요한 사람에게 소개하고, 거래가 성사되면 당사자끼리 정한 소개비를 받습니다.\n- 소개뱅크는 회원끼리 직접 거래하는 **개인 간(P2P) 서비스**입니다. 개인 회원도 본인인증을 하면 모든 업무를 할 수 있습니다. 등록에 자격이 필요한 업종(공인중개사 · 보험 · 의료 등)만 그 자격 확인을 받은 뒤 등록합니다.\n- 소개비 금액은 정해진 요율표가 없고 **당사자끼리 협의**해서 정합니다. 소개뱅크는 소개비에서 **아무것도 떼지 않습니다**.\n- 소개뱅크는 거래 대금을 **받지도 보관하지도 않습니다**. 대금은 당사자끼리 직접 주고받습니다. 소개뱅크 계좌로 돈을 보내라는 요구는 사기입니다.\n- 운영: (주)한국바이오헬스케어 소개뱅크 사업부. 소개몰은 소개뱅크가 직접 파는 직판(통신판매업자)이고, 나머지 관은 회원 사이 거래를 돕는 통신판매중개자입니다. 사업자 정보는 화면 맨 아래 바닥줄에 있습니다.\n\n### 1-2. 관(서비스 묶음) 구성\n화면 위 머리줄 메뉴는 다음 순서입니다.\n\n| 메뉴 | 주소 | 다루는 것 |\n|---|---|---|\n| 소개장터 | `/money` | 상품 · 서비스 소개. 급구 · 급매, 베스트매칭, 이벤트 포함 |\n| 안심소개 | `/mall` | 인증이 필요한 거래 — 기계 · 설비 · 시설 / 부동산 / 생활 · 금융 상담 |\n| 소개창업 | `/biz` | 창업 · 가맹 · 점포 양수도, 인력(도급), 운영지원, 정보 |\n| 소개몰 | `/health` | 건강 상품 쇼핑몰(직판) |\n| 소개광장 | `/community` | 소개 후기 · 업종 이야기 · 질문 · 「이건 어때?」 투표 · 우리동네 맛집 |\n| 이용안내 | `/guide` | 이용 흐름 · 자주 묻는 것 · 약관 목록 |\n\n- 필요한 것을 올려 소개를 받는 「소개받기」는 `/request` 입니다.\n- 통합 검색은 `/search` 입니다. 두 글자 이상 넣으세요. 「문장으로 찾기」에 \"10평 이내 상가 급매 있어?\"처럼 문장으로 써도 됩니다.\n- 화면 오른쪽 위 🌐 단추로 한국어 · 영어를 바꿀 수 있습니다. 약관은 한국어판이 우선합니다.\n\n---\n\n## 2. 가입 · 로그인 · 비밀번호 · 탈퇴\n\n### 2-1. 회원가입 (`/signup`)\n1. 「무료 회원가입」을 누르고 가입 유형을 고릅니다: **개인 회원 · 개인 사업자 · 법인 사업자**. 어느 유형이든 하는 업무는 같습니다.\n2. 사업자는 사업자등록번호(법인은 법인등록번호도)를 조회합니다. 휴업 · 폐업 사업자는 사업자로 가입할 수 없고, 사업자당 계정은 1개입니다.\n3. 이름(실명) · 이메일 · 비밀번호를 넣습니다. 이메일이 로그인 아이디입니다. 비밀번호는 **영문 · 숫자 · 특수문자를 섞어 10자 이상**입니다.\n4. 약관에 동의합니다. 필수 항목에 모두 동의해야 넘어갑니다. 선택 항목(마케팅 · 맞춤형 광고 등)은 나중에 바꿀 수 있습니다.\n5. 관심 성향(선택)은 건너뛰어도 가입됩니다.\n- 개인 회원은 **바로 가입**됩니다. 사업자 인증은 운영자 확인 뒤 끝나며, 그 전에도 본인인증만으로 모든 업무를 할 수 있습니다.\n- \"지금은 새 가입을 잠시 받지 않습니다\"가 보이면 잠시 뒤 다시 시도하세요. 이미 가입한 분은 로그인할 수 있습니다.\n\n### 2-2. 본인인증 · 사업자 인증 (`/verify`)\n- **본인인증**은 사람을 확인합니다. 문의하기 · 매물 등록 · 거래 참여 · 소개비 받기에 필요합니다. 정산 때 예금주명과 대조하므로 실명이어야 합니다.\n- 휴대폰 본인확인 연동은 **준비 중**입니다. 화면에 \"연동 준비 중\"이 보이면 실제 확인이 이루어진 것이 아닙니다. 막히면 고객센터로 문의해 주세요.\n- **사업자 인증은 선택**입니다. 사업자로 소개비(세금계산서)를 받을 때만 필요하고, 인증이 끝난 시각 뒤에 성사된 거래부터 적용됩니다(소급 없음). 「나의공간 › 사업자 전환」(`/my/business`)에서 신청합니다.\n\n### 2-3. 로그인 (`/login`)\n- 이메일과 비밀번호로 로그인합니다. 「로그인 상태 유지」를 고를 수 있습니다.\n- 비밀번호를 **5번 틀리면 30분 동안 잠깁니다**. 30분 뒤 다시 시도하거나 비밀번호를 재설정하세요.\n- 약관이 바뀐 뒤 로그인하면 약관 동의 화면(`/terms/agree`)으로 갑니다. 바뀐 점을 보고 필수 약관에 동의하면 가려던 화면으로 이어집니다.\n- 가입한 이메일이 기억나지 않으면 로그인 화면 「이메일 찾기」 → 고객센터 「계정」 문의로 알려 주세요. 본인 확인 뒤 도와 드립니다.\n\n### 2-4. 비밀번호 찾기 · 바꾸기\n- 잊었을 때: 「비밀번호 찾기」(`/login/forgot`)에서 이메일을 넣으면 재설정 링크를 보냅니다. 링크는 **30분 동안 한 번만** 쓸 수 있습니다.\n- 메일이 오지 않으면 스팸함을 확인하세요. 메일 발송이 준비 중이라 보낼 수 없다는 안내가 나오면 고객센터 「계정」 문의로 알려 주세요.\n- 알 때: 「나의공간 › 프로필 · 사업자 정보」(`/my/account`) › 비밀번호 변경.\n- 비밀번호를 바꾸면 **다른 기기의 로그인이 모두 풀립니다**.\n\n### 2-5. 회원 탈퇴 (`/my/account/withdraw`)\n- 「나의공간 › 프로필 · 사업자 정보 › 회원 탈퇴」에서 합니다. 탈퇴 사유 · 지금 비밀번호 · 확인란이 필요합니다.\n- 진행 중인 거래 · 정산 · 주문이 있으면 그것이 끝나야 탈퇴할 수 있습니다. 화면에 남은 일과 「보러 가기」가 나옵니다.\n- 탈퇴하면 올린 매물 · 요청이 바로 내려가고 발급한 소개코드가 멈춥니다. 유료 구독은 자동 결제가 멈추고, 파트너 활동도 함께 끝납니다.\n- 거래 기록이 있으면 관련 법령에 따라 일정 기간 보관한 뒤 파기하며, 그동안에도 로그인할 수 없습니다. 거래 기록이 없으면 회원 정보를 바로 파기합니다. 자세한 기준은 약관 · 개인정보처리방침을 보세요.\n- 같은 이메일로 다시 가입하려면 파기가 끝난 뒤에 할 수 있습니다. **탈퇴는 되돌릴 수 없습니다.**\n\n---\n\n## 3. 내 정보 · 나의공간\n\n### 3-1. 나의공간 (`/my`)\n머리줄 「나의공간」을 누르면 진행 중 소개 · 성사 · 정산 대기 · 누적 수익과 아래 메뉴가 보입니다.\n\n| 메뉴 | 주소 | 내용 |\n|---|---|---|\n| 내 등록 리스팅 | `/my/listings` | 등록한 상품 · 서비스와 노출 상태 |\n| 소개 내역 | `/my/deals` | 내가 소개한 건과 귀속 코드 |\n| 계약 진행 | `/my/contracts` | 당사자끼리 맺는 계약 |\n| 문의 · 대화 | `/my/inquiries` | 진행 중인 1:1 대화 |\n| 정산 · 지급 | `/my/settlement` | 소개비 정산 신청 · 지급 내역 |\n| 관심 목록 | `/my/likes` | 담아 둔 상품 · 서비스 |\n| 구독 · 소개코드 | `/my/subscription` | 요금제와 남은 소개코드 |\n| 중개사 인증 | `/my/broker` | 부동산 등록 전 공인중개사 인증 |\n| 알림 | `/my/notifications` | 거래 · 정산 · 검수 소식 |\n| 사업자 전환 | `/my/business` | 사업자로 소개비 받기 |\n| 소개 활동 | `/my/intro` | 초대 · 활동 · 포인트 |\n| 프로필 · 사업자 정보 | `/my/account` | 이름 · 연락처 · 비밀번호 · 탈퇴 · 개인정보 · 보안 |\n| 소개몰 주문 · 취소 · 반품 · 배송지 | `/my/health/...` | 소개몰 이용 내역 |\n\n- 이메일은 로그인 수단이라 프로필에서 바로 바꿀 수 없습니다. 바꾸려면 고객센터로 문의해 주세요.\n- 본인인증 뒤 이름을 바꾸면 다시 인증해야 합니다. 인증이 끝난 사업자 정보는 고칠 수 없고 「사업자 정보 다시 인증」으로 바꿉니다.\n\n### 3-2. 로그인 기록 확인 (`/my/account/security`)\n- 「나의공간 › 프로필 · 사업자 정보 › 개인정보 · 보안 › 로그인 기록 · 보안」에서 봅니다.\n- 최근 로그인 30건의 때 · 결과(로그인 / 비밀번호 틀림) · IP 앞 두 자리 · 브라우저 종류가 나옵니다.\n- 지난 7일 비밀번호가 틀린 기록이 있으면 경고가 뜹니다. 직접 한 것이 아니면 **비밀번호를 바꾸고 「모든 기기에서 로그아웃」**을 누르세요.\n- 로그인 기록은 정해진 기간 보관한 뒤 지웁니다(기간은 화면에 표시).\n\n### 3-3. 모든 기기에서 로그아웃\n- 같은 화면(`/my/account/security`) 아래 「모든 기기에서 로그아웃」에서 지금 비밀번호를 넣고 누릅니다.\n- 다른 휴대폰 · 컴퓨터에 남은 로그인이 모두 풀리고, **지금 쓰는 기기는 그대로** 쓸 수 있습니다.\n- 기기를 하나씩 골라 로그아웃하는 기능은 없습니다.\n\n### 3-4. 내 정보 내려받기 (`/my/account/data`)\n- 소개뱅크가 보관한 내 정보를 **JSON 파일 하나**로 받습니다. 지금 비밀번호를 넣고 「내 정보 내려받기」를 누르세요.\n- 들어가는 것: 프로필 · 약관 동의 · 매물 · 요청 · 소개코드 · 소개비 · 소개광장 글 · 댓글 · 투표 · 관심 목록 · 동네 · 소개몰 주문 · 반품 · 배송지 · 포인트 · 알림 · 문의 · 권리 요청 · 로그인 기록.\n- 다른 회원의 이름 · 연락처, 운영 내부 메모, 비밀번호는 들어 있지 않습니다.\n- 하루에 받을 수 있는 횟수가 정해져 있습니다(남은 횟수는 화면에 표시). 다 쓰면 다음 날 받으세요.\n- 파일은 메모장이나 엑셀(데이터 › JSON 가져오기)로 열 수 있습니다. 안전한 곳에 보관하세요.\n\n### 3-5. 개인정보 권리 요청 (`/my/account/privacy`)\n- 내 개인정보의 **열람 · 정정 · 삭제 · 처리정지**를 요청합니다. 종류를 고르고 내용을 5 ~ 1000자로 적어 「요청 보내기」를 누릅니다. 주민등록번호 · 비밀번호는 적지 마세요.\n- 처리 기한은 화면에 표시되며, 결과는 **알림**으로 알려 드립니다. 사정이 있으면 기한을 한 번 늘릴 수 있고 그때 사유를 알려 드립니다.\n- 상태: 접수 → (기한 연장) → 처리 완료 또는 거절. 「내 요청」 표에서 확인합니다.\n- 바로 할 수 있는 것: 열람은 「내 정보 내려받기」, 이름 · 연락처 정정은 프로필, 모두 지우기는 회원 탈퇴.\n- 대리인 요청 등은 고객센터로 문의해 주세요. 법적 기준은 개인정보처리방침(`/terms`)을 보세요.\n\n### 3-6. 알림 (`/my/notifications`)\n- 머리줄 종 모양 단추를 누르면 알림 센터가 열리고, 읽지 않은 수가 표시됩니다.\n- 거래 · 정산 · 검수 · 계약 · 약관 변경 · 권리 요청 결과 같은 소식이 쌓입니다. 알림을 누르면 관련 화면으로 갑니다.\n- 아래 「수신 설정」에서 종류별로 켜고 끌 수 있습니다. 돈 · 계약이 걸린 안내는 끌 수 없습니다.\n- **이메일 · 문자 · 알림톡 발송은 준비 중**입니다. 지금은 사이트 안 알림만 나갑니다.\n\n---\n\n## 4. 소개장터 · 매물 · 요청 · 소개코드 · 거래\n\n### 4-1. 매물 찾기\n- 머리줄에서 관(소개장터 · 안심소개 · 소개창업)을 고르거나 `/search` 에서 검색합니다. 열람과 검색은 로그인 없이도 됩니다.\n- 목록 · 상세에는 지역이 시 · 구까지만 보입니다. 상세주소는 등록자 본인과 운영만 봅니다.\n- 「광고」 표시가 붙은 것은 광고이며 추천 순위 계산에는 들어가지 않습니다.\n- 마음에 드는 매물은 관심 목록에 담을 수 있습니다(`/my/likes`).\n\n### 4-2. 매물 올리기 (`/register`)\n- 로그인과 **본인인증**이 필요합니다. 개인 회원도 소개장터 · 안심소개 · 소개창업 모두에 올릴 수 있습니다.\n- 관과 업종을 고르고 제목(5자 이상) · 내용 · 사진 · 지역을 적습니다. 업종에 따라 등급이 정해지며, 최종 확정은 운영자 검수입니다.\n- 등록하면 **검수**를 거쳐 노출됩니다. 검수 승인 전에는 어디에도 보이지 않습니다. 일부는 자동 승인되고, 첫 등록 등은 담당자가 확인합니다.\n- 검수가 오래 걸리면 고객센터 1:1 문의로 알려 주세요.\n- 고치기는 「나의공간 › 내 등록 리스팅」에서 합니다. 고치면 다시 검수를 받습니다.\n- 급하게 사거나 팔아야 하면 매물을 올린 뒤 내 매물에서 「급구 · 급매」를 신청하세요(운영 심사 · 기한이 지나면 자동 해제).\n- 자격이 필요한 업종: 부동산은 「나의공간 › 중개사 인증」(`/my/broker`) 등 인증 뒤, 보험 · 의료는 자격 심사 승인 뒤 등록됩니다. 다단계 · 대부 · 사행성 등 제한 업종은 올릴 수 없습니다.\n- 안심소개 부동산은 소개비가 아니라 노출료 방식입니다. 소개뱅크는 중개보수를 받지 않습니다.\n\n### 4-3. 소개받기 — 필요한 것 요청하기 (`/request`)\n- 필요한 물품 · 용역 · 부동산 · 장비 · 창업 공간을 올리면 소개자가 제안합니다. 올리기는 `/request/new` 입니다.\n- 요청한 분이 공개 범위를 정할 수 있고, 회사명을 감출 수 있습니다.\n- 요청은 등록 후 **30일**이 지나면 자동으로 닫힙니다.\n- 「예상 소개비」는 요청자가 적은 희망 금액이며, 최종 금액은 대화에서 정합니다.\n- 제안하기: 로그인 + 본인인증 뒤, 요청 상세에서 소개할 업체 · 관계 · 제안 내용(10자 이상)을 보냅니다. 요청 1건에 한 번만 제안할 수 있고, 제안은 요청자에게만 보입니다.\n- 요청자가 「수락하고 대화 시작」을 누르면 1:1 대화가 열립니다. 거절한 제안은 되돌릴 수 없습니다.\n- 요청 열람 · 제안 횟수에는 요금제별 한도가 있을 수 있습니다(화면에 표시).\n\n### 4-4. 소개코드\n- 소개코드는 **매물마다 따로** 받습니다. 소개할 매물 상세에서 「소개코드 공유」를 누르고 링크를 복사해 보내세요. 같은 매물은 다시 눌러도 같은 코드입니다.\n- 상대가 내 링크로 들어와 **90일 안에** 그 매물에 문의하면 소개자로 기록됩니다. 처음 들어온 소개코드가 90일 동안 유지되며, 뒤에 다른 코드로 들어와도 바뀌지 않습니다.\n- 귀속은 1:1 대화가 시작될 때 확정됩니다. 전화 등 사이트 밖에서만 진행하면 기록되지 않습니다.\n- 받을 수 없는 경우: 본인 매물, 게시 중이 아닌 매물, 보험 · 의료 매물(법령상 소개 대가 금지).\n- 본인인증 뒤에 받을 수 있습니다. **무료(베이직) 요금제에는 무료 소개코드가 없고**, 유료 요금제는 월 포함 건수까지 무료입니다. 넘으면 건당 추가 결제 뒤 발급됩니다. 요금제 금액 · 추가 발급 비용은 「구독 · 소개코드」(`/my/subscription`) 화면 표시를 따릅니다.\n- **결제 연동은 준비 중**입니다. \"시험 결제\"로 표시되는 결제는 실제 돈이 오가지 않습니다.\n\n### 4-5. 문의 · 1:1 대화\n- 매물 상세의 「문의하기」를 누르면 등록자와 1:1 대화가 열립니다. 로그인과 본인인증이 필요합니다.\n- 대화 목록은 「나의공간 › 문의 · 대화」(`/my/inquiries`)에 있습니다.\n- 대화는 소개뱅크 대화방 안에서 하세요. 기록이 분쟁 근거로 남습니다.\n\n### 4-6. 거래 진행: 계약 → 대금 → 성사 확정\n1. **조건 협의**: 1:1 대화에서 조건을 맞춘 뒤 「계약서 요청하기」를 누릅니다.\n2. **계약서**: 표준계약서 양식의 빈칸만 채웁니다(조항은 고칠 수 없음). 조건 합의 → 양측 서명 순서이며, 한쪽이 조건을 바꾸면 상대의 합의를 다시 받아야 합니다. 서명 뒤에는 바꿀 수 없어 파기 후 다시 맺어야 합니다. 전자서명 연동은 준비 중입니다. 진행은 「나의공간 › 계약 진행」(`/my/contracts`).\n3. **결제 · 대금**: 대금은 당사자끼리 직접 주고받고, 화면에서는 지급 사실만 신고합니다. 대금은 계약 상대 명의 계좌로만 보내세요.\n4. **성사 확정**: 양측이 **각각** 눌러야 성사됩니다. 한쪽만 눌러서는 넘어가지 않습니다.\n5. **후기**: 성사 뒤 후기를 쓸 수 있습니다.\n- 소개뱅크는 양식만 제공하며 계약 당사자가 아닙니다. 조건과 이행 책임은 당사자에게 있습니다.\n\n### 4-7. 정산 · 소개비 받기 (`/my/settlement`)\n- 본인인증 회원이면 개인도 소개비를 받습니다. 사업자 인증을 하면 사업자로 받고, 세금계산서는 소개자가 직접 발행합니다.\n- 성사가 확정된 건만 정산을 신청할 수 있습니다. 순서: 승인 대기 → 승인됨 · 지급 대기 → 소개비를 받으면 「받았음 표시」(지급 완료).\n- **소개비는 거래 당사자가 직접 지급합니다.** 소개뱅크는 소개비를 대신 받거나 보내지 않으며, 소개비에서 떼는 금액도 없습니다.\n- 받을 계좌는 본인 명의여야 하며 1원 입금으로 확인합니다. 계좌 확인 연동은 준비 중입니다. 확인 코드를 다섯 번 틀려 막히면 고객센터로 연락 주세요.\n- 소개비는 받는 분의 소득이므로 세금 신고는 받는 분이 합니다.\n- 화면에 \"소개비 기능은 아직 열리지 않았습니다\"가 보이면 연동 준비 중이라는 뜻입니다.\n- 분쟁을 접수하면 그 거래의 정산이 보류되고, 처리가 끝나면 풀립니다.\n\n### 4-8. 구독 · 요금제 (`/my/subscription`)\n- 개인도 구독할 수 있습니다. 현재 요금제 · 남은 소개코드는 「구독 · 소개코드」, 열람 · 슬롯 한도는 「한도 안내 · 요금제」(`/my/subscription/upgrade`)에서 봅니다.\n- 요금제 금액은 화면 표시를 따르며 바뀔 수 있습니다. **정기결제 연동은 준비 중**입니다. 결제 카드 등록은 「결제 수단」(`/my/payment`).\n\n---\n\n## 5. 안심소개 · 소개몰\n\n### 5-1. 안심소개 상담 신청 (`/mal/consult`)\n- 이사 · 청소 · 인테리어 · 렌탈 · 보험 같은 생활 · 금융 상담을 신청하면 **인증업체 1곳**이 연락합니다. 신청 정보는 그 1곳에만 전달됩니다.\n- 로그인하지 않아도 신청할 수 있습니다. 이름 · 휴대폰 · 이메일 · 지역을 적고, 휴대폰 확인(인증번호 6자리)을 마쳐야 업체에 전달됩니다.\n- 같은 번호로 하루에 신청할 수 있는 횟수가 정해져 있고, 같은 업종은 24시간 안에 다시 신청할 수 없습니다. 업체가 정해진 시간 안에 확인하지 않으면 다른 1곳으로 넘어갑니다.\n- 자격 확인 업종(보험 · 의료 등)은 자격 심사를 통과한 업체에만 연결합니다. 법률 · 세무는 사무소 정보를 보고 직접 연락하는 방식입니다.\n- 로그인한 채 신청하면 「내 상담 신청」에서 연락처를 받아 간 업체를 볼 수 있습니다.\n- **인증번호 발송(문자 · 메일)이 준비 중**이라 신청이 닫혀 있거나 \"아직 받지 않습니다\"가 보일 수 있습니다. 그때는 고객센터로 문의해 주세요.\n- 소개뱅크는 자격을 확인할 뿐 상담 결과를 보증하지 않습니다.\n\n### 5-2. 소개몰 둘러보기 (`/health`)\n- 건강식품 등 건강 상품을 소개뱅크가 직접 파는 쇼핑몰입니다. 고민별 · 성분별 찾기, 상품 검색이 있습니다.\n- 의약품 · 의료 서비스는 팔지 않습니다.\n\n### 5-3. 소개몰 주문 — 지금은 받지 않습니다\n- **지금은 소개몰 주문을 받지 않습니다.** 결제 연동을 준비 중이기 때문입니다.\n- 상품 보기와 장바구니(`/health/cart`) 담기는 됩니다. 주문 단추 대신 안내가 보입니다.\n- 주문이 열리면 사이트에서 알려 드립니다. 그 전에 결제를 요구하는 연락은 응하지 마세요.\n\n### 5-4. 주문 조회 · 취소 · 반품 · 환불 (주문이 열린 뒤)\n- 주문 · 배송 조회: 「나의공간 › 소개몰 주문」(`/my/health/orders`).\n- 취소 · 반품 신청: `/my/health/returns/new`, 처리 결과: `/my/health/returns`. 배송지 관리: `/my/health/addresses`.\n- 발송 전 취소와 판매자 사유(파손 · 오배송 · 표시와 다름 · 지연)는 전액 환불됩니다. 회원 사정(단순 변심 등) 반품은 왕복 배송비를 빼고 환불하며, 금액은 신청 화면에 표시됩니다.\n- 자세한 기준은 약관 화면(`/terms`)의 판매 · 환불 약관을 따릅니다.\n\n---\n\n## 6. 소개광장\n\n### 6-1. 글 쓰기 (`/community`)\n- 게시판: 소개 후기 · 업종 이야기 · 질문 · 공지 · 우리동네 맛집 · 「이건 어때?」 투표.\n- 로그인하면 누구나 글을 쓸 수 있습니다(`/community/write`). 제목과 내용을 쓰면 게시판을 골라 드리며, 맞지 않으면 직접 고르세요. 제목 2 ~ 100자, 내용 10자 이상입니다.\n- **첫 글은 확인 후 올라갑니다**(보통 하루 안). 두 번째부터는 바로 올라갑니다.\n- 가입 7일이 안 되면 링크를 넣을 수 없고, 하루에 쓸 수 있는 글 수가 정해져 있습니다.\n- 소개 후기는 성사된 거래가 있어야 쓸 수 있습니다.\n- 우리동네 맛집(`/community/food`)은 카카오맵에서 가게를 찾아 고릅니다. 대가를 받고 쓴 글은 반드시 「광고 · 협찬」에 체크하세요.\n- 동네 인증(위치 확인)은 준비 중입니다.\n\n### 6-2. 댓글\n- 로그인하면 댓글을 달 수 있습니다(두 글자 이상). 답글은 1단계까지입니다.\n- \"신고가 들어와 가려진 댓글\" 또는 \"운영 기준에 따라 가려진 댓글\"로 보이는 것은 운영 확인 중이거나 운영이 감춘 댓글입니다.\n\n### 6-3. 신고\n- 글 · 댓글 · 매물 등의 「신고」 단추를 누르고 문제점을 적습니다(`/report/...`).\n- 신고 1건으로 바로 내려가지 않습니다. 여러 사람이 짜고 남의 글을 내리는 일을 막기 위해서입니다. 신고가 여러 건 쌓이면 운영 확인 때까지 가려질 수 있습니다.\n- 처리 결과는 신고한 분께 알려 드립니다. 내 신고는 「나의공간 › 내 신고 내역」(`/my/reports`)에서 봅니다.\n\n### 6-4. 「이건 어때?」 투표 (`/community/polls`)\n- **로그인 없이도 투표할 수 있습니다.** 회원은 1인 1표, 비로그인은 기기 1표입니다.\n- 같은 인터넷 주소에서는 투표 1건당 하루에 넣을 수 있는 표 수가 정해져 있습니다(운영이 정함).\n- 넣은 표는 바꿀 수 없고, 결과는 투표한 뒤에 보입니다. 참여 수는 실제로 투표한 수입니다.\n- 회원 투표 만들기(`/community/polls/new`)는 운영이 열었을 때만 쓸 수 있습니다. 만들자마자 열리고, 링크 · 금칙어는 넣을 수 없으며, 표가 들어온 뒤에는 고치거나 지울 수 없고 마감만 됩니다. 신고 3건이면 운영 확인 때까지 감춰집니다. 가입 직후에는 만들 수 없고 하루 만들 수 있는 수가 정해져 있습니다. 내 투표는 `/community/polls/mine`.\n\n---\n\n## 7. 파트너 · 제휴 · 소개몰 입점\n\n### 7-1. 머리줄 아이콘의 뜻\n로그인하면 자격에 따라 머리줄 오른쪽에 아이콘이 보입니다. 마우스를 올리면 이름이 나옵니다.\n\n| 아이콘 | 이름 | 누가 보나 | 가는 곳 |\n|---|---|---|---|\n| 방패 | 관리자 페이지 | 운영자만 | 운영 화면 |\n| 집 | 안심소개 파트너 | 안심소개 파트너(심사 중 포함) | `/partner` |\n| 두 사람 | 파트너센터 | 제휴 파트너로 활동 중인 회원 | `/partners` |\n| 가게 | 소개몰 입점 신청 / 소개몰 판매자센터 | 입점 신청이 열려 있을 때 로그인한 회원 | `/health/seller` · 입점한 판매자는 `/health/seller/center` |\n\n- 자격이 없으면 아이콘이 보이지 않습니다. 「파트너센터」는 글자 링크로 보입니다.\n- 휴대폰(좁은 화면)에서는 아이콘 대신 메뉴 끝에 글자로 나옵니다.\n\n### 7-2. 안심소개 파트너(입점 업체) 신청 (`/partner/apply`)\n- 안심소개에서 상담 · 매물을 받는 업체용입니다. 본인인증을 하면 **개인으로도** 신청할 수 있고, 사업자 인증은 선택입니다.\n- 순서: 본인 · 사업자 확인 → 업종 · 지역 선택 → 운영 승인. 자동 승인은 없고 사람이 확인합니다(접수 안내에 결과 예정이 표시됨).\n- 반려되면 사유를 알림으로 보내 드리며, 고쳐서 다시 신청할 수 있습니다.\n\n### 7-3. 제휴 파트너 (`/partners`)\n- 제휴상품 링크를 퍼뜨리고, 링크로 들어온 주문이 확정되면 건당 정해진 수수료를 소개뱅크가 지급하는 제도입니다. 안심소개 파트너 신청과는 **따로**입니다.\n- 본인인증을 하면 개인으로 신청할 수 있습니다. 운영이 직접 확인 뒤 승인합니다. 처음이면 「파트너가이드」(`/partners/guides`)를 먼저 보세요.\n- 제휴 링크는 마지막 클릭 기준 72시간 안의 주문이 인정됩니다. 소개코드(90일 첫 유입)와는 다른 규칙입니다.\n- 수수료 지급 계좌는 1원 입금으로 확인하며, 인증 전에는 지급되지 않습니다. 소개몰 주문이 열리기 전에는 수익이 생기지 않습니다.\n\n### 7-4. 소개몰 입점 신청 (`/health/seller`)\n- 소개몰에 상품을 팔고 싶은 회원이 신청합니다. **운영이 입점 신청을 열었을 때만** 가게 아이콘과 신청 화면이 보입니다.\n- 신청할 때 입점 약관 동의가 필요하고, 운영이 심사합니다.\n- 실제 판매와 판매대금 지급은 결제 연동이 끝난 뒤 시작됩니다. 그 전에는 신청 · 심사까지만 됩니다.\n\n---\n\n## 8. 고객센터 · 문의 · 약관\n\n### 8-1. 고객센터 (`/support/new`)\n- 자주 묻는 질문을 먼저 찾아보고, 답이 없으면 아래 문의 양식으로 보내세요. 영업일 기준 1일 이내 답변이 목표입니다.\n- 1:1 문의(`/support`)는 먼저 챗봇이 답하고, 금액 · 계정 · 분쟁처럼 사람이 판단할 일은 상담원에게 넘깁니다.\n- 내 문의와 답변은 「내 문의 내역」(`/support/history`)에서 봅니다.\n- 운영시간 · 연락처는 고객센터 화면에 표시됩니다.\n\n### 8-2. 분쟁 접수 (`/support/dispute`)\n- 거래 분쟁은 일반 문의가 아니라 「분쟁 접수」로 해야 합니다. 접수하면 그 거래의 정산이 보류되고, 처리가 끝나면 풀립니다.\n\n### 8-3. 사기 예방 (`/safety/guide`)\n- 시세보다 지나치게 싼 조건은 의심하고, 계약 전 현장 · 실물과 사업자등록증 등 공식 서류를 확인하세요.\n- 소개뱅크는 인증번호 · 비밀번호를 묻지 않습니다. 소개뱅크 계좌로 대금을 보내라는 요구는 사기입니다.\n- 돈 피해가 났다면 경찰(112) · 경찰청 사이버범죄 신고시스템에도 함께 신고하세요. 대화 · 계약 기록은 소개뱅크가 보존합니다.\n\n### 8-4. 약관 보기 (`/terms`)\n- 「약관 · 법적 고지」에서 이용약관 · 개인정보처리방침 · 환불 정책 등을 봅니다. 문서 이름을 누르면 판 번호 · 시행일과 함께 전문(`/terms/[문서]`)이 열립니다. 바닥줄 링크로도 갈 수 있습니다.\n- 약관이 바뀌면 시행일 전에 알림으로 알려 드리고, 필수 약관은 시행일부터 다시 동의를 받습니다.\n- 선택 동의(마케팅 · 맞춤형 광고 등)는 약관 동의 화면(`/terms/agree`)의 「선택 항목 바꾸기」에서 언제든 바꿀 수 있습니다. 필수 약관 동의는 탈퇴로만 철회됩니다.\n\n---\n\n## 9. 자주 묻는 질문\n\n**Q1. 개인도 가입하고 소개비를 받을 수 있나요?**\n네. 개인 회원도 가입할 수 있고, 본인인증을 하면 모든 업무와 소개비 받기가 됩니다. 사업자 인증은 세금계산서로 받을 때만 필요합니다.\n\n**Q2. 소개비는 얼마인가요?**\n정해진 요율표가 없습니다. 당사자끼리 협의해 정하고, 소개뱅크는 한 푼도 떼지 않습니다.\n\n**Q3. 소개비는 누가, 어떻게 주나요?**\n거래 당사자가 소개자에게 직접 지급합니다. 소개뱅크는 대신 받거나 보내지 않습니다. 「나의공간 › 정산 · 지급」에서 진행 상태를 봅니다.\n\n**Q4. 소개뱅크는 무엇으로 돈을 버나요?**\n구독료와 추가 소개코드 발급비, 광고입니다. 거래금액에 따른 수수료는 없습니다.\n\n**Q5. 등록한 매물이 안 보여요.**\n검수 승인 전에는 노출되지 않습니다. 「나의공간 › 내 등록 리스팅」에서 상태를 확인하고, 오래 걸리면 고객센터 1:1 문의로 알려 주세요.\n\n**Q6. 소개코드로 들어왔는데 다른 사람이 소개자로 잡혔어요.**\n처음 들어온 소개코드가 90일 동안 유지됩니다. 그 뒤에 다른 코드로 들어와도 바뀌지 않습니다.\n\n**Q7. 무료 회원도 소개코드를 받나요?**\n무료(베이직) 요금제에는 무료 소개코드가 없고 건마다 추가 결제 뒤 받습니다. 결제 연동은 준비 중입니다.\n\n**Q8. 소개몰에서 주문이 안 돼요.**\n지금은 결제 연동 준비로 주문을 받지 않습니다. 상품 보기와 장바구니 담기는 됩니다.\n\n**Q9. 비밀번호 재설정 메일이 안 와요.**\n스팸함을 확인하세요. 메일 발송 준비 중이라는 안내가 나오면 고객센터 「계정」 문의로 알려 주세요.\n\n**Q10. 로그인이 잠겼어요.**\n비밀번호를 5번 틀리면 30분 동안 잠깁니다. 30분 뒤 다시 시도하거나 「비밀번호 찾기」를 이용하세요.\n\n**Q11. 다른 사람이 내 계정에 들어온 것 같아요.**\n「나의공간 › 프로필 · 사업자 정보 › 로그인 기록 · 보안」에서 기록을 보고, 비밀번호를 바꾼 뒤 「모든 기기에서 로그아웃」을 누르세요.\n\n**Q12. 내 정보를 받아 보거나 지우고 싶어요.**\n받기는 「내 정보 내려받기」(`/my/account/data`), 정정 · 삭제 · 처리정지는 「개인정보 권리 요청」(`/my/account/privacy`), 모두 지우기는 회원 탈퇴입니다.\n\n**Q13. 탈퇴가 안 돼요.**\n진행 중인 거래 · 정산 · 주문이 있으면 끝난 뒤 탈퇴할 수 있습니다. 탈퇴 화면의 「남은 일」을 확인하세요.\n\n**Q14. 로그인 없이 투표할 수 있나요?**\n네. 비로그인은 기기 1표, 회원은 1인 1표입니다. 넣은 표는 바꿀 수 없습니다.\n\n**Q15. 첫 글이 바로 안 올라가요.**\n첫 글은 확인 후 올라갑니다(보통 하루 안). 두 번째 글부터는 바로 올라갑니다.\n\n**Q16. 신고하면 바로 내려가나요?**\n아니요. 운영이 확인한 뒤 처리하고, 결과를 신고한 분께 알려 드립니다.\n\n**Q17. 이메일이나 문자 알림이 오지 않아요.**\n이메일 · 문자 · 알림톡 발송은 준비 중입니다. 지금은 사이트 안 알림(종 모양 단추)으로만 알려 드립니다.\n\n**Q18. 본인인증이 안 돼요.**\n휴대폰 본인확인 연동은 준비 중입니다. 진행이 막히면 고객센터로 문의해 주세요.\n\n**Q19. 부동산도 올릴 수 있나요?**\n공인중개사 인증 등 필요한 인증을 받은 뒤 안심소개에 올릴 수 있습니다. 소개뱅크는 중개보수를 받지 않습니다.\n\n**Q20. 머리줄에 집 · 두 사람 · 가게 아이콘이 보여요.**\n집은 안심소개 파트너, 두 사람은 제휴 파트너센터, 가게는 소개몰 입점 신청(또는 판매자센터)입니다. 자격이 있는 회원에게만 보입니다.\n"}];
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let cur=null, heads=[];
function render(id){
  const d=DOCS.find(x=>x.id===id)||DOCS[0]; cur=d.id;
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.id===d.id?'true':'false'));
  const html=window.marked?marked.parse(d.md,{gfm:true}):'<pre>'+esc(d.md)+'</pre>';
  const el=$('#doc'); el.innerHTML='<div class="file">'+esc(d.file)+'</div>'+html;
  el.querySelectorAll('table').forEach(t=>{const w=document.createElement('div');w.className='tbl';t.replaceWith(w);w.appendChild(t)});
  heads=[]; let n=0;
  el.querySelectorAll('h2,h3').forEach(h=>{h.id=d.id+'-'+(++n);heads.push({id:h.id,lv:h.tagName.toLowerCase(),t:h.textContent})});
  drawToc(); try{localStorage.setItem('sgbdoc',d.id)}catch(e){}
  if(location.hash.slice(1)!==d.id){try{history.replaceState(null,'','#'+d.id)}catch(e){}}
  window.scrollTo(0,0);
}
function drawToc(){
  const q=$('#flt').value.trim(); const box=$('#toc');
  const list=heads.filter(h=>!q||h.t.includes(q));
  box.innerHTML='<div class="lbl">목차 · '+list.length+'</div>'+(list.length?list.map(h=>{
    let t=esc(h.t); if(q){t=t.split(esc(q)).join('<mark>'+esc(q)+'</mark>')}
    return '<a class="'+h.lv+'" href="#'+h.id+'" data-go="'+h.id+'">'+t+'</a>'}).join(''):'<div class="none">맞는 제목이 없습니다</div>');
}
$('#toc').addEventListener('click',e=>{const a=e.target.closest('a[data-go]');if(!a)return;e.preventDefault();
  const h=document.getElementById(a.dataset.go); if(h)h.scrollIntoView({behavior:'smooth',block:'start'});
  if(matchMedia('(max-width:860px)').matches)$('#tocbox').open=false;});
$('#flt').addEventListener('input',drawToc);
$('#tabs').innerHTML=DOCS.map(d=>'<button class="tab" role="tab" data-id="'+d.id+'"><b>'+esc(d.name)+'</b><span>'+esc(d.who)+'</span></button>').join('');
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(b){$('#flt').value='';render(b.dataset.id)}});
let start=location.hash.slice(1); if(!DOCS.some(d=>d.id===start)){try{start=localStorage.getItem('sgbdoc')||''}catch(e){start=''}}
render(DOCS.some(d=>d.id===start)?start:DOCS[0].id);
</script>
