<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}</style></head><body>
<title>소개뱅크 거래·정산·백오피스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
  :root{
    --bl:#2563EB; --bl-d:#1D4ED8; --bl-l:#EFF6FF;
    --pp:#7C3AED; --pp-l:#F5F1FE;
    --or:#F97316; --or-d:#EA580C; --or-l:#FFF7ED;
    --gr:#10B981; --gr-d:#059669; --gr-l:#ECFDF5;
    --rd:#EF4444; --rd-l:#FEF2F2;
    --am:#D97706; --am-l:#FFFBEB;
    --navy:#1E293B; --navy-2:#0F172A;
    --g900:#111827; --g700:#374151; --g500:#6B7280; --g400:#9CA3AF;
    --g200:#E5E7EB; --g100:#F3F4F6; --g50:#F9FAFB;
    --shell:#EDEEF0; --page:#F7F8FA; --card:#FFFFFF;
    --ink:#111827; --ink2:#4B5563; --ink3:#6B7280; --line:#E5E7EB; --line2:#F3F4F6;
    --f:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    --m:"IBM Plex Mono",ui-monospace,Menlo,monospace;
    --sh:0 1px 2px rgba(17,24,39,.06);
    --sh2:0 4px 16px rgba(17,24,39,.10);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bl:#7FA9F5; --bl-d:#6B9AF0; --bl-l:#182335;
      --pp:#B695F5; --pp-l:#231B36;
      --or:#F79055; --or-d:#F0803F; --or-l:#33200F;
      --gr:#5FCFA6; --gr-d:#4EC298; --gr-l:#122A22;
      --rd:#F27F7F; --rd-l:#301A1A;
      --am:#E0AE55; --am-l:#2E2413;
      --navy:#141A24; --navy-2:#0D1218;
      --g900:#E9EBEE; --g700:#B9BFC7; --g500:#8B929B; --g400:#6E757E;
      --g200:#333941; --g100:#262B32; --g50:#20242A;
      --shell:#111418; --page:#171A1F; --card:#1E2228;
      --ink:#E9EBEE; --ink2:#AEB4BC; --ink3:#868D96; --line:#333941; --line2:#262B32;
      --sh:0 1px 2px rgba(0,0,0,.45); --sh2:0 4px 18px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bl:#7FA9F5; --bl-d:#6B9AF0; --bl-l:#182335;
    --pp:#B695F5; --pp-l:#231B36;
    --or:#F79055; --or-d:#F0803F; --or-l:#33200F;
    --gr:#5FCFA6; --gr-d:#4EC298; --gr-l:#122A22;
    --rd:#F27F7F; --rd-l:#301A1A;
    --am:#E0AE55; --am-l:#2E2413;
    --navy:#141A24; --navy-2:#0D1218;
    --g900:#E9EBEE; --g700:#B9BFC7; --g500:#8B929B; --g400:#6E757E;
    --g200:#333941; --g100:#262B32; --g50:#20242A;
    --shell:#111418; --page:#171A1F; --card:#1E2228;
    --ink:#E9EBEE; --ink2:#AEB4BC; --ink3:#868D96; --line:#333941; --line2:#262B32;
    --sh:0 1px 2px rgba(0,0,0,.45); --sh2:0 4px 18px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--shell);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.6;
       -webkit-font-smoothing:antialiased;word-break:keep-all}
  button{font-family:inherit;font-size:inherit;cursor:pointer;border:0;background:none;color:inherit}
  input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--bl);outline-offset:2px}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

  /* ================= shell ================= */
  .app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
  @media (max-width:920px){ .app{grid-template-columns:1fr} .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)} }

  .rail{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--page);
        border-right:1px solid var(--line);padding:16px 13px 40px}
  .rail h1{font-size:14.5px;font-weight:900;letter-spacing:-.03em;margin:0 0 2px;display:flex;align-items:center;gap:7px}
  .rail .sub{font-size:10.5px;color:var(--ink3);font-family:var(--m);letter-spacing:.05em;margin-bottom:14px}

  .modesw{display:flex;gap:3px;background:var(--g100);border-radius:9px;padding:3px;margin-bottom:16px}
  .modesw button{flex:1;padding:7px 8px;border-radius:7px;font-size:12px;font-weight:700;color:var(--ink3)}
  .modesw button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--sh)}

  .grp{margin-bottom:13px}
  .grp > .lbl{font-family:var(--m);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
              color:var(--ink3);padding:0 8px;margin-bottom:5px;display:block}
  .navbtn{display:block;width:100%;text-align:left;border:1px solid transparent;
          padding:7px 9px;border-radius:7px;color:var(--ink2);line-height:1.35;margin-bottom:2px}
  .navbtn .t{font-size:12.5px;font-weight:500;display:block}
  .navbtn .id{font-family:var(--m);font-size:9px;color:var(--ink3);letter-spacing:.03em}
  .navbtn:hover{background:var(--g100)}
  .navbtn[aria-current="true"]{background:var(--card);border-color:var(--line);color:var(--ink);box-shadow:var(--sh)}
  .navbtn[aria-current="true"] .t{font-weight:700}
  .navbtn .bdg{float:right;font-family:var(--m);font-size:9.5px;background:var(--or);color:#fff;
               border-radius:9px;padding:1px 6px;margin-top:1px}
  .navbtn .bdg.z{background:var(--g200);color:var(--ink3)}

  .railfoot{margin-top:16px;padding:0 8px;font-size:11px;color:var(--ink3);line-height:1.55}
  .resetb{margin-top:10px;width:100%;border:1px solid var(--line);border-radius:7px;
          padding:6px;font-size:11.5px;color:var(--ink3);background:var(--card)}
  .resetb:hover{color:var(--ink)}

  .stage{padding:18px 22px 60px;min-width:0;background:var(--shell)}
  @media (max-width:640px){ .stage{padding:12px 12px 40px} }
  .stagebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .sid{font-family:var(--m);font-size:10.5px;color:var(--ink3);letter-spacing:.04em}
  .snote{font-size:12px;color:var(--ink2);flex:1;min-width:200px}
  .chip{font-family:var(--m);font-size:10px;letter-spacing:.05em;padding:3px 8px;border-radius:5px;white-space:nowrap}
  .c-u{background:var(--bl-l);color:var(--bl)}
  .c-a{background:var(--pp-l);color:var(--pp)}

  /* pipeline */
  .pipe{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;
        max-width:1120px;background:var(--card);margin-bottom:14px}
  .pipe div{flex:1;padding:8px 6px;text-align:center;font-size:11px;color:var(--ink3);
            border-right:1px solid var(--line2);font-family:var(--m);letter-spacing:.02em;
            white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pipe div:last-child{border-right:0}
  .pipe div.on{background:var(--or);color:#fff;font-weight:500}
  .pipe div.done{background:var(--gr-l);color:var(--gr-d)}

  /* frame */
  .frame{background:var(--card);border:1px solid var(--line);border-radius:12px;
         overflow:hidden;box-shadow:var(--sh2);max-width:1120px}
  .fbar{display:flex;align-items:center;gap:7px;padding:9px 13px;background:var(--g50);border-bottom:1px solid var(--line)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--g200);flex:none}
  .furl{flex:1;font-family:var(--m);font-size:10.5px;color:var(--ink3);background:var(--card);
        border:1px solid var(--line);border-radius:5px;padding:3px 9px;overflow:hidden;
        text-overflow:ellipsis;white-space:nowrap}

  /* ================= product chrome ================= */
  .gnb{display:flex;align-items:center;gap:20px;padding:11px 18px;border-bottom:1px solid var(--line);background:var(--card)}
  .logo{display:flex;align-items:center;gap:7px;font-size:15px;font-weight:900;letter-spacing:-.04em;flex:none}
  .gnbm{display:flex;gap:18px;flex:1;font-size:12.5px;font-weight:500;color:var(--ink2);overflow-x:auto;scrollbar-width:none}
  .gnbm::-webkit-scrollbar{display:none}
  .gnbr{display:flex;gap:7px;align-items:center;flex:none}

  .body{padding:18px}
  .h-pg{font-size:19px;font-weight:900;letter-spacing:-.035em;margin:0 0 3px}
  .h-sub{font-size:12.5px;color:var(--ink3);margin:0 0 14px}
  .h-sec{font-size:13px;font-weight:700;margin:20px 0 8px;display:flex;align-items:center;gap:7px}
  .h-sec:first-child{margin-top:0}

  .btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 15px;
       border-radius:8px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
  .btn:hover{background:var(--g50)}
  .btn.sm{padding:5px 11px;font-size:11.5px;border-radius:6px}
  .btn.bl{background:var(--bl);border-color:var(--bl);color:#fff;font-weight:700}
  .btn.or{background:var(--or);border-color:var(--or);color:#fff;font-weight:700}
  .btn.gr{background:var(--gr-d);border-color:var(--gr-d);color:#fff;font-weight:700}
  .btn.rd{background:var(--rd);border-color:var(--rd);color:#fff;font-weight:700}
  .btn:disabled{opacity:.42;cursor:not-allowed}

  .panel{border:1px solid var(--line);border-radius:10px;background:var(--card)}
  .pad{padding:14px 16px}

  .bdg{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;
       padding:3px 9px;border-radius:999px;white-space:nowrap}
  .b-gr{background:var(--gr-l);color:var(--gr-d)}
  .b-or{background:var(--or-l);color:var(--or-d)}
  .b-bl{background:var(--bl-l);color:var(--bl)}
  .b-rd{background:var(--rd-l);color:var(--rd)}
  .b-am{background:var(--am-l);color:var(--am)}
  .b-n{background:var(--g100);color:var(--ink3)}

  .alert{display:flex;gap:9px;padding:11px 13px;border-radius:9px;font-size:12.5px;
         line-height:1.6;margin:10px 0;border:1px solid transparent}
  .alert .ic{font-family:var(--m);font-weight:700;flex:none}
  .a-i{background:var(--bl-l);color:var(--bl);border-color:color-mix(in srgb,var(--bl) 22%,transparent)}
  .a-g{background:var(--gr-l);color:var(--gr-d);border-color:color-mix(in srgb,var(--gr-d) 22%,transparent)}
  .a-w{background:var(--am-l);color:var(--am);border-color:color-mix(in srgb,var(--am) 24%,transparent)}
  .a-r{background:var(--rd-l);color:var(--rd);border-color:color-mix(in srgb,var(--rd) 22%,transparent)}

  dl.kv{display:grid;grid-template-columns:110px 1fr;margin:0;font-size:13px}
  dl.kv dt{color:var(--ink3);padding:6px 0;border-bottom:1px solid var(--line2);font-size:12.5px}
  dl.kv dd{margin:0;padding:6px 0;border-bottom:1px solid var(--line2);font-weight:500}
  dl.kv dt:last-of-type,dl.kv dd:last-of-type{border-bottom:0}

  .calc{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
  .calc .r{display:flex;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line2);font-size:13px}
  .calc .r:last-child{border-bottom:0;background:var(--g50);font-weight:900;font-size:14.5px}
  .calc .n{font-variant-numeric:tabular-nums}
  .calc .r.neg .n{color:var(--rd)}

  .fld{margin-bottom:13px}
  .fld label{display:block;font-size:12.5px;font-weight:700;margin-bottom:5px}
  .fld label .req{color:var(--or)}
  .fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);background:var(--card);
    border-radius:8px;padding:8px 11px;font-size:13.5px}
  .fld textarea{min-height:70px;resize:vertical;line-height:1.6}
  .fld .hint{font-size:11.5px;color:var(--ink3);margin-top:4px}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
  .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 14px}
  @media (max-width:640px){ .g2,.g3{grid-template-columns:1fr} }

  /* chat */
  .chat{border:1px solid var(--line);border-radius:10px;height:250px;overflow-y:auto;
        padding:13px;background:var(--page);display:flex;flex-direction:column;gap:8px}
  .msg{max-width:74%;padding:9px 12px;border-radius:12px;font-size:13px;line-height:1.55}
  .msg.them{background:var(--card);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
  .msg.me{background:var(--bl);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
  .msg .who{font-size:10px;opacity:.75;font-family:var(--m);display:block;margin-bottom:3px}
  .sysmsg{align-self:center;font-size:11.5px;color:var(--ink3);background:var(--g100);
          padding:5px 13px;border-radius:999px;text-align:center;max-width:90%}
  .chatin{display:flex;gap:8px;margin-top:10px}
  .chatin input{flex:1;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:9px 12px;font-size:13px}

  /* parties */
  .parties{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:12px 0}
  @media (max-width:600px){ .parties{grid-template-columns:1fr} }
  .party{border:1px solid var(--line);border-radius:10px;padding:13px 15px;background:var(--card)}
  .party.done{border-color:var(--gr-d);background:var(--gr-l)}
  .party .pn{font-size:13px;font-weight:700}
  .party .pr{font-size:11.5px;color:var(--ink3);margin-bottom:9px}

  /* contract */
  .doc{border:1px solid var(--line);border-radius:10px;background:var(--card);
       padding:20px 22px;font-size:12.5px;line-height:1.9;max-height:270px;overflow-y:auto}
  .doc h4{text-align:center;font-size:15px;font-weight:900;margin:0 0 16px;letter-spacing:-.02em}
  .doc .cl{margin-bottom:11px}
  .doc .cl b{display:block;font-size:12.5px;margin-bottom:1px}
  .doc .sig{display:flex;justify-content:space-between;gap:16px;margin-top:18px;
            padding-top:14px;border-top:1px solid var(--line2)}
  .doc .sig div{flex:1;font-size:11.5px}
  .doc .sig .nm{font-weight:700;font-size:12.5px;margin-top:3px}
  .doc .sig .st{margin-top:5px}

  /* ================= admin chrome ================= */
  .adm-hd{display:flex;align-items:center;gap:20px;padding:11px 18px;background:var(--navy);color:#E5E7EB}
  .adm-hd .lg{font-size:14px;font-weight:900;letter-spacing:-.03em;display:flex;align-items:center;gap:7px;flex:none}
  .adm-hd .lg .tag{font-family:var(--m);font-size:9px;background:rgba(255,255,255,.16);
                   padding:2px 6px;border-radius:4px;letter-spacing:.08em}
  .adm-hd nav{display:flex;gap:16px;flex:1;font-size:12.5px;overflow-x:auto;scrollbar-width:none}
  .adm-hd nav::-webkit-scrollbar{display:none}
  .adm-hd nav span{white-space:nowrap;opacity:.65}
  .adm-hd nav span.on{opacity:1;font-weight:700;border-bottom:2px solid #fff;padding-bottom:2px}
  .adm-hd .who{font-size:11.5px;opacity:.7;flex:none}

  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:14px}
  @media (max-width:840px){ .kpis{grid-template-columns:repeat(2,1fr)} }
  .kpi{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:13px 15px}
  .kpi .k{font-size:11.5px;color:var(--ink3);display:flex;align-items:center;gap:6px}
  .kpi .v{font-size:26px;font-weight:900;letter-spacing:-.04em;line-height:1.15;
          font-variant-numeric:tabular-nums;margin-top:3px}
  .kpi .d{font-size:11px;color:var(--ink3);margin-top:2px}
  .kpi.hot .v{color:var(--or)}
  .kpi.warn .v{color:var(--am)}
  .kpi.ok .v{color:var(--gr-d)}
  .kpi.info .v{color:var(--bl)}

  table.q{width:100%;border-collapse:collapse;font-size:12.5px}
  table.q th{background:var(--g50);font-size:11px;font-weight:700;color:var(--ink3);
             padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
  table.q td{padding:10px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
  table.q tr:last-child td{border-bottom:0}
  table.q td.mono{font-family:var(--m);font-size:11.5px;color:var(--ink2);white-space:nowrap}
  table.q td.num{font-variant-numeric:tabular-nums;text-align:right;font-weight:600;white-space:nowrap}
  table.q td.act{text-align:right;white-space:nowrap}
  .tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
  .tw table{min-width:660px}

  .empty{padding:34px 16px;text-align:center;color:var(--ink3);font-size:12.5px}

  /* footer */
  .ft{border-top:1px solid var(--line);background:var(--g50);padding:18px 20px}
  .ft .lk{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:11px}
  .ft .lk span.em{color:var(--ink);text-decoration:underline}
  .ft .info{font-size:11px;color:var(--ink3);line-height:1.85}
  .ft .info b{color:var(--ink2);font-weight:600}
  .ft .tbd{background:var(--am-l);color:var(--am);font-family:var(--m);font-size:10px;
           padding:1px 6px;border-radius:4px;margin-left:3px}
  .ft .notice{margin-top:12px;padding:10px 13px;background:var(--card);border:1px solid var(--line);
              border-radius:8px;font-size:11.5px;color:var(--ink2);line-height:1.7}
  .ft .notice b{color:var(--ink)}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);
         background:var(--g900);color:var(--page);padding:11px 20px;border-radius:9px;font-size:13px;
         box-shadow:var(--sh2);opacity:0;pointer-events:none;z-index:80;max-width:88vw;text-align:center}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (prefers-reduced-motion:no-preference){
    .toast{transition:opacity .2s,transform .2s}
    .btn,.navbtn,.modesw button{transition:background .13s,color .13s,border-color .13s}
  }
  [hidden]{display:none !important}
</style>

<div class="app">
  <aside class="rail">
    <h1>
      <svg width="15" height="15" viewBox="0 0 20 20" aria-hidden="true">
        <rect x="1" y="1" width="18" height="18" rx="3" fill="var(--or)"></rect>
        <path d="M5.5 6.6h9M5.5 10h9M5.5 13.4h5.6" stroke="var(--card)" stroke-width="1.7" stroke-linecap="round"></path>
      </svg>
      거래 · 정산 · 백오피스
    </h1>
    <div class="sub">04–06 STAGE + ADMIN</div>

    <div class="modesw" role="group" aria-label="화면 모드">
      <button id="mUser" aria-pressed="true">사용자</button>
      <button id="mAdmin" aria-pressed="false">백오피스</button>
    </div>

    <div id="navUser"></div>
    <div id="navAdmin" hidden></div>

    <div class="railfoot">
      두 모드가 <b>같은 데이터</b>를 씁니다. 사용자 화면에서 정산을 신청하면
      백오피스 승인 대기에 실제로 나타납니다.
      <button class="resetb" id="reset">데이터 초기화</button>
    </div>
  </aside>

  <main class="stage">
    <div class="stagebar">
      <span class="chip c-u" id="sChip">04 매칭</span>
      <span class="sid" id="sId">SB-HOM-MCH-010</span>
      <span class="snote" id="sNote"></span>
    </div>
    <div class="pipe" id="pipe" hidden>
      <div data-p="4">04 매칭</div><div data-p="5a">05 계약</div><div data-p="5b">05 결제</div>
      <div data-p="5c">05 성사</div><div data-p="6a">06 정산신청</div><div data-p="6b">06 지급</div>
    </div>
    <div class="frame"><div id="screen"></div></div>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  "use strict";

        '<tr><td>수익 보장</td><td>수익 보장 · 확정 수익 · 원금 보장 · 누구나 월 ○○만원</td><td>제출 차단</td></tr>'+
        '<tr><td>부업 프레이밍</td><td>부업 · 투잡 · 쉽게 버는</td><td>제출 차단</td></tr>'+
        '<tr><td>서열 용어</td><td>하위 · 산하 · 라인 · 센터장 · 직급</td><td>제출 차단</td></tr>'+
        '<tr><td>과장 표현</td><td>업계 1위 · 최고 · 100% 성사</td><td>검수 대상 표시</td></tr>'+
      '</tbody></table></div>'+
      '<h3 class="h-sec">요율</h3>'+
      '<div class="tw"><table class="q"><thead><tr><th>관</th><th style="text-align:right">요율</th><th style="text-align:right">상한</th><th>부담 주체</th></tr></thead><tbody>'+
        '<tr><td><span class="bdg b-bl">소개머니</span></td><td class="num">3.0%</td><td class="num">300,000원</td><td>등록 시 판매자/구매자 선택</td></tr>'+
        '<tr><td><span class="bdg b-gr">소개몰</span></td><td class="num">5.0%</td><td class="num">1,000,000원</td><td>업체 고정</td></tr>'+
        '<tr><td><span class="bdg b-or">소개창업</span></td><td class="num">1.5%</td><td class="num">5,000,000원</td><td>양도인 · 본사 고정</td></tr>'+
        '<tr><td><span class="bdg b-or">프랜차이즈 가맹</span></td><td class="num">정액</td><td class="num">1,000,000원</td><td>본사</td></tr>'+
        '<tr><td><span class="bdg b-rd">사업용 부동산</span></td><td class="num">소개비 없음</td><td class="num">—</td><td>중개사 노출료 별도</td></tr>'+
      '</tbody></table></div>'+
      '<div class="alert a-w"><span class="ic">!</span><span>'+
        '요율 변경은 <b>변경 시점 이후 신규 소개코드부터</b> 적용됩니다. 이미 발급된 소개코드는 발급 당시 요율을 유지합니다 — '+
        '소급 적용은 분쟁의 직접 원인이 됩니다.</span></div>'+
    '</div>';
  }

  var RENDER = {
    mch:scMch, del1:scDel1, del2:scDel2, del3:scDel3, stl1:scStl1, stl2:scStl2, ft:scFooter,
    adsh:scAdSh, adrev:scAdRev, adusr:scAdUsr, addeal:scAdDeal, adstl:scAdStl, addsp:scAdDsp, adpol:scAdPol
  };

  /* ---------------- render ---------------- */
  function render(){
    var k = S.screen;
    if (!RENDER[k]) k = S.screen = (S.mode === "admin" ? "adsh" : "mch");
    $("#screen").innerHTML = RENDER[k]();

    var m = META[k] || {};
    var isAdm = k.indexOf("ad") === 0;
    $("#sChip").className = "chip " + (isAdm ? "c-a" : "c-u");
    $("#sChip").textContent = isAdm ? "백오피스" : (m.p ? ({"4":"04 매칭","5a":"05 계약","5b":"05 결제","5c":"05 성사","6a":"06 정산","6b":"06 지급"}[m.p]) : "전역");
    $("#sId").textContent = m.id || "";
    $("#sNote").textContent = m.note || "";

    var pipe = $("#pipe");
    if (isAdm || !m.p) { pipe.hidden = true; }
    else {
      pipe.hidden = false;
      var order = ["4","5a","5b","5c","6a","6b"];
      var cur = order.indexOf(stageOf());
      $$("#pipe div").forEach(function(el){
        var p = el.getAttribute("data-p"), i = order.indexOf(p);
        el.classList.toggle("on", p === m.p);
        el.classList.toggle("done", i < cur && p !== m.p);
      });
    }

    $("#mUser").setAttribute("aria-pressed", S.mode === "user" ? "true" : "false");
    $("#mAdmin").setAttribute("aria-pressed", S.mode === "admin" ? "true" : "false");
    $("#navUser").hidden = S.mode !== "user";
    $("#navAdmin").hidden = S.mode !== "admin";
    drawNav();

    var cb = $("#chatBox"); if (cb) cb.scrollTop = cb.scrollHeight;
    save();
  }
  function go(k){ S.screen = k; render(); window.scrollTo({top:0, behavior:"instant"}); }

  /* ---------------- events ---------------- */
  $("#mUser").addEventListener("click", function(){ S.mode="user"; S.screen="mch"; render(); });
  $("#mAdmin").addEventListener("click", function(){ S.mode="admin"; S.screen="adsh"; render(); });
  $("#reset").addEventListener("click", function(){
    S = JSON.parse(JSON.stringify(DEFAULT)); render(); toast("데이터를 초기화했습니다.");
  });

  document.addEventListener("click", function(e){
    var t = e.target.closest("[data-go],[data-act]");
    if (!t) return;
    if (t.hasAttribute("data-go")) { go(t.getAttribute("data-go")); return; }
    var a = t.getAttribute("data-act"), i = Number(t.getAttribute("data-i"));

    if (a === "startContract") {
      S.deal.status = "CONTRACT";
      S.chat.push({w:"them", n:"홍길동 · 인증소개자", t:"좋습니다. 계약서 양식 보내드리겠습니다."});
      go("del1"); toast("계약 단계로 이동했습니다."); return;
    }
    if (a === "signSeeker" || a === "signPartner") {
      S.deal[a === "signSeeker" ? "signSeeker" : "signPartner"] = true;
      render(); if (bothSigned()) toast("양측 서명 완료 — 성사 확정으로 진행할 수 있습니다."); return;
    }
    if (a === "resetSign") { S.deal.signSeeker = S.deal.signPartner = false; render(); return; }
    if (a === "cfSeeker" || a === "cfPartner") {
      var el = $("#amt"); if (el) S.deal.amount = Number(el.value) || S.deal.amount;
      S.deal[a === "cfSeeker" ? "cfSeeker" : "cfPartner"] = true;
      render();
      if (bothConfirmed()) toast("성사 확정 — 정산 단계가 열렸습니다.");
      else toast("확인 1 / 2 — 상대에게 알림이 발송되었습니다.");
      return;
    }
    if (a === "resetConfirm") { S.deal.cfSeeker = S.deal.cfPartner = false; S.settle.status = "NONE"; render(); return; }

    if (a === "requestSettle") {
      var b = $("#bank"), x = $("#tax");
      if (b) S.settle.bank = b.value;
      if (x) S.settle.tax = x.value;
      S.settle.status = "REQUESTED";
      logit("이대표 (소개자)", "정산 신청 ST-" + S.deal.id + " · " + won(net()));
      render(); toast("정산 신청 접수 — 백오피스 정산 화면에서 확인하세요."); return;
    }
    if (a === "stlApprove") { S.settle.status = "APPROVED";
      logit("운영자 admin@", "정산 승인 ST-" + S.deal.id); render(); toast("승인 완료 — 지급 실행 대기."); return; }
    if (a === "stlHold") { S.settle.status = "REQUESTED";
      logit("운영자 admin@", "정산 보류 ST-" + S.deal.id); render(); toast("보류 처리했습니다."); return; }
    if (a === "stlPay") { S.settle.status = "PAID";
      logit("운영자 admin@", "지급 실행 ST-" + S.deal.id + " · " + won(net())); render();
      toast("지급 완료 — 누적수익 · 신뢰도에 반영됩니다."); return; }

    if (a === "approve") { var r = S.reviews.splice(i,1)[0];
      logit("운영자 admin@", "리스팅 승인 " + r.id + " · " + r.t); render(); toast("승인 — 노출을 시작합니다."); return; }
    if (a === "reject") {
      var sel = document.querySelector('[data-rej="'+ i +'"]');
      var code = sel ? sel.value : "";
      if (!code) { toast("반려 사유 코드를 선택하세요."); return; }
      var r2 = S.reviews.splice(i,1)[0];
      logit("운영자 admin@", "리스팅 반려 " + r2.id + " · " + code);
      render(); toast("반려 " + code + " — 사유와 수정 가이드가 전달됩니다."); return;
    }
    if (a === "vapprove") { var v = S.verifies.splice(i,1)[0];
      logit("운영자 admin@", v.type + " 인증 승인 " + v.id + " · " + v.n); render(); toast("인증 승인 완료."); return; }
    if (a === "vreject") { var v2 = S.verifies.splice(i,1)[0];
      logit("운영자 admin@", v2.type + " 인증 반려 " + v2.id); render(); toast("인증 반려 — 사유가 전달됩니다."); return; }

    if (a === "nudge") { logit("운영자 admin@", "Deal #" + S.deal.id + " 확인 알림 재발송"); render();
      toast("확인 알림을 재발송했습니다."); return; }
    if (a === "toDispute") {
      if (S.disputes.some(function(x){ return x.deal === S.deal.id; })) { toast("이미 분쟁이 접수된 거래입니다."); return; }
      S.disputes.unshift({id:"D-105", deal:S.deal.id, who:"운영자", reason:"관리자 직권 전환", ago:"방금", status:"접수"});
      if (S.settle.status === "REQUESTED" || S.settle.status === "APPROVED") S.settle.status = "REQUESTED";
      logit("운영자 admin@", "Deal #" + S.deal.id + " 분쟁 전환 · 정산 보류");
      go("addsp"); toast("분쟁 전환 — 해당 거래 정산이 보류됩니다."); return;
    }
    if (a === "dspClose") { var d3 = S.disputes.splice(i,1)[0];
      logit("운영자 admin@", "분쟁 종결 " + d3.id); render(); toast("분쟁을 종결했습니다."); return; }
  });

  document.addEventListener("click", function(e){
    var b = e.target.closest(".navbtn");
    if (b) go(b.getAttribute("data-s"));
  });

  document.addEventListener("click", function(e){
    if (e.target.id === "chatSend") {
      var inp = $("#chatIn"); var v = (inp.value||"").trim();
      if (!v) return;
      if (/\d{2,3}-?\d{2,4}-?\d{4}|\d{6}-?\d{7}|계좌|입금/.test(v)) {
        toast("계좌 · 연락처가 감지되었습니다. 안전을 위해 플랫폼 안에서 진행해 주세요.");
      }
      S.chat.push({w:"me", n:"나 (이대표)", t:v});
      S.chat.push({w:"them", n:"홍길동 · 인증소개자", t:"확인했습니다. 매장 방문 상담 일정 잡아드릴까요?"});
      render();
    }
  });

  load(); render();
})();
</script>

</body></html>
