<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root{
    --pp:#7C3AED; --pp-d:#6D28D9; --pp-l:#F5F1FE;
    --bl:#2563EB; --bl-l:#EFF6FF; --or:#F97316; --or-l:#FFF7ED;
    --gr:#059669; --gr-l:#ECFDF5; --am:#D97706; --am-l:#FFFBEB;
    --rd:#DC2626; --rd-l:#FEF2F2;
    --nv:#1E293B; --ink:#0F172A; --mut:#64748B; --mut2:#94A3B8;
    --line:#E2E8F0; --line2:#F1F5F9; --page:#F7F8FA; --card:#FFFFFF; --shell:#F1F3F6;
    --rail:#141E33; --railln:#22314F; --railtx:#CBD5E1; --raildk:#0B1220;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--ink);
    font-family:"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
    font-size:14px;line-height:1.7;-webkit-font-smoothing:antialiased}
  .mono,code{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}
  button,input,select,textarea{font-family:inherit;font-size:inherit}
  button{cursor:pointer}

  .app{display:grid;grid-template-columns:264px 1fr;min-height:100vh}
  @media (max-width:920px){ .app{grid-template-columns:1fr} .rail{position:static!important;height:auto!important;border-right:0;border-bottom:1px solid var(--railln)} }

  /* ---------- 좌측 레일 ---------- */
  .rail{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--rail);color:var(--railtx)}
  .rhd{padding:16px 16px 13px;border-bottom:1px solid var(--railln)}
  .rhd .lg{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:800;color:#fff;letter-spacing:-.3px}
  .rhd .lg .d{width:8px;height:8px;border-radius:50%;background:var(--pp);box-shadow:0 0 0 3px rgba(124,58,237,.25)}
  .rhd .lg .tag{font-size:9.5px;font-weight:800;color:#C4B5FD;background:rgba(124,58,237,.2);
    border:1px solid rgba(124,58,237,.42);border-radius:5px;padding:2px 6px;letter-spacing:.4px}
  .rhd p{margin:7px 0 0;font-size:11px;color:#64748B;line-height:1.6}
  .grp{padding:14px 16px 5px;font-size:9.5px;font-weight:800;color:#475569;letter-spacing:.8px;text-transform:uppercase}
  .nv{display:flex;align-items:center;gap:9px;padding:8px 12px;margin:0 8px 1px;border-radius:8px;cursor:pointer}
  .nv:hover{background:var(--raildk)}
  .nv.on{background:#1B2947}
  .nv .t{flex:1;font-size:12.5px;color:#CBD5E1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nv.on .t{color:#fff;font-weight:700}
  .nv .c{font-family:"IBM Plex Mono",monospace;font-size:9px;color:#475569;flex:none}
  .nv .sw{width:9px;height:9px;border-radius:3px;flex:none}
  .railfoot{margin:14px 12px 26px;padding:12px 13px;background:var(--raildk);border:1px solid var(--railln);
    border-radius:10px;font-size:11px;color:#64748B;line-height:1.7}
  .railfoot b{color:#CBD5E1;display:block;margin-bottom:4px;font-size:11.5px}

  /* ---------- 스테이지 ---------- */
  .stage{padding:0 0 60px;min-width:0;background:var(--shell)}
  .meta{display:flex;align-items:center;gap:10px;padding:11px 24px;background:var(--card);
    border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;z-index:15}
  .chip{font-size:10.5px;font-weight:800;letter-spacing:.4px;border-radius:6px;padding:3px 8px;
    background:var(--pp-l);color:var(--pp)}
  .meta .sid{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--mut);font-weight:600}
  .meta .nt{font-size:12.5px;color:var(--mut);flex:1;min-width:200px}
  .inner{padding:22px 24px 0;max-width:1180px}
  @media (max-width:640px){ .inner{padding:16px 12px 0} .meta{padding:10px 12px} }

  h1.pg{margin:0 0 4px;font-size:25px;font-weight:900;letter-spacing:-.9px}
  p.lead{margin:0 0 20px;font-size:14px;color:var(--mut);max-width:760px}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:16px;overflow:hidden}
  .phd{display:flex;align-items:center;gap:10px;padding:13px 18px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
  .phd h2{margin:0;font-size:15px;font-weight:800;letter-spacing:-.4px}
  .phd .sp{flex:1}
  .phd .hint{font-size:12px;color:var(--mut2)}
  .pbd{padding:16px 18px}

  .btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;
    padding:8px 14px;font-size:13px;font-weight:700;white-space:nowrap}
  .btn:hover{border-color:var(--mut2)}
  .btn.pri{background:var(--pp);border-color:var(--pp);color:#fff}
  .btn.pri:hover{background:var(--pp-d);border-color:var(--pp-d)}
  .btn.act{background:var(--or);border-color:var(--or);color:#fff}
  .btn.gho{background:transparent;color:var(--mut)}
  .btn.dgr{color:var(--rd);border-color:rgba(220,38,38,.35)}
  .btn:disabled{opacity:.42;cursor:default}
  .btn.sm{padding:5px 10px;font-size:12px;border-radius:7px}

  /* ---------- 관 카드 ---------- */
  .sites{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
  .sc{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;
    cursor:pointer;transition:border-color .15s,box-shadow .15s}
  .sc:hover{border-color:var(--mut2);box-shadow:0 4px 14px rgba(15,23,42,.06)}
  .sc .bar{height:5px}
  .sc .bd{padding:15px 17px}
  .sc .r1{display:flex;align-items:center;gap:9px;margin-bottom:3px}
  .sc h3{margin:0;font-size:17px;font-weight:900;letter-spacing:-.5px}
  .sc .code{font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:700;
    color:var(--mut);background:var(--line2);border-radius:5px;padding:2px 7px}
  .sc .url{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--bl);margin-bottom:11px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sc .rel{font-size:12.5px;color:var(--mut);margin-bottom:12px}
  .sc .kv{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding-top:11px;border-top:1px dashed var(--line)}
  .sc .kv div{min-width:0}
  .sc .kv b{display:block;font-size:15px;font-weight:900;letter-spacing:-.4px}
  .sc .kv span{font-size:10.5px;color:var(--mut2)}
  .st{font-size:10.5px;font-weight:800;border-radius:6px;padding:2.5px 8px;letter-spacing:-.1px;flex:none}
  .st.live{background:var(--gr-l);color:var(--gr)}
  .st.prep{background:var(--am-l);color:var(--am)}
  .st.stop{background:var(--rd-l);color:var(--rd)}
  .addcard{border:2px dashed var(--line);background:transparent;border-radius:14px;display:grid;
    place-items:center;min-height:210px;cursor:pointer;color:var(--mut);text-align:center;padding:20px}
  .addcard:hover{border-color:var(--pp);color:var(--pp);background:var(--pp-l)}
  .addcard b{display:block;font-size:15px;font-weight:800;margin-bottom:4px}
  .addcard span{font-size:12.5px;line-height:1.6}

  /* ---------- 폼 ---------- */
  .fg{margin-bottom:15px}
  .fg label{display:block;font-size:12.5px;font-weight:700;color:var(--mut);margin-bottom:5px}
  .fg label .req{color:var(--rd)}
  .fg .hint{font-size:11.5px;color:var(--mut2);margin-top:5px;line-height:1.6}
  .in{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 12px;background:var(--card);color:var(--ink)}
  .in:focus{outline:2px solid var(--pp);outline-offset:-1px;border-color:transparent}
  .in[readonly]{background:var(--line2);color:var(--mut)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
  @media (max-width:640px){ .two,.three{grid-template-columns:1fr} }
  .pre{display:flex;align-items:stretch}
  .pre .in{border-radius:9px 0 0 9px;border-right:0}
  .pre .sfx{display:flex;align-items:center;padding:0 12px;background:var(--line2);
    border:1px solid var(--line);border-left:0;border-radius:0 9px 9px 0;
    font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--mut)}

  .opts{display:grid;gap:9px}
  .opt{display:grid;grid-template-columns:20px 1fr;gap:11px;padding:12px 14px;border:1px solid var(--line);
    border-radius:11px;cursor:pointer;background:var(--card)}
  .opt:hover{border-color:var(--mut2)}
  .opt.on{border-color:var(--pp);background:var(--pp-l);box-shadow:inset 0 0 0 1px var(--pp)}
  .opt .rd{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);margin-top:3px}
  .opt.on .rd{border-color:var(--pp);border-width:5px}
  .opt b{display:block;font-size:14px;font-weight:800;letter-spacing:-.3px}
  .opt span{display:block;font-size:12.5px;color:var(--mut);line-height:1.65;margin-top:2px}

  .sw{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px dashed var(--line)}
  .sw:last-child{border-bottom:0}
  .sw .tx{flex:1;min-width:0}
  .sw .tx b{display:block;font-size:13.5px;font-weight:700}
  .sw .tx span{display:block;font-size:12px;color:var(--mut);line-height:1.6}
  .tg{width:42px;height:24px;border-radius:999px;background:var(--line);border:0;position:relative;flex:none;
    transition:background .15s}
  .tg::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;
    background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
  .tg.on{background:var(--gr)} .tg.on::after{left:21px}

  /* ---------- 탭 ---------- */
  .tabs{display:flex;gap:2px;padding:0 18px;background:var(--card);border-bottom:1px solid var(--line);
    overflow-x:auto}
  .tabs button{background:transparent;border:0;border-bottom:2px solid transparent;color:var(--mut);
    padding:11px 13px;font-size:13px;font-weight:700;white-space:nowrap}
  .tabs button.on{color:var(--pp);border-bottom-color:var(--pp)}

  /* ---------- 표 ---------- */
  .tw{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
  th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line2);vertical-align:middle}
  th{background:var(--page);font-size:11px;font-weight:800;color:var(--mut);letter-spacing:.3px;white-space:nowrap}
  tr:last-child td{border-bottom:0}
  td.k{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--mut)}
  .gb{font-size:10.5px;font-weight:800;border-radius:5px;padding:2px 7px}
  .gb.A{background:var(--bl-l);color:var(--bl)} .gb.B{background:var(--am-l);color:var(--am)}
  .gb.C{background:var(--gr-l);color:var(--gr)} .gb.X{background:var(--rd-l);color:var(--rd)}

  /* ---------- 알림 ---------- */
  .cal{border-radius:11px;padding:12px 15px;font-size:13px;line-height:1.75;margin-bottom:14px}
  .cal b{font-weight:800}
  .cal.i{background:var(--bl-l);border:1px solid rgba(37,99,235,.24);color:var(--ink)}
  .cal.w{background:var(--am-l);border:1px solid rgba(217,119,6,.28)}
  .cal.e{background:var(--rd-l);border:1px solid rgba(220,38,38,.25)}
  .cal.k{background:var(--gr-l);border:1px solid rgba(5,150,105,.26)}
  .cal .lab{display:block;font-size:10.5px;font-weight:800;letter-spacing:.5px;margin-bottom:3px;opacity:.85}

  /* ---------- 마법사 ---------- */
  .steps{display:flex;gap:0;margin-bottom:20px;overflow-x:auto}
  .wst{flex:1;min-width:120px;padding:10px 12px;border-bottom:3px solid var(--line);font-size:12.5px;color:var(--mut2)}
  .wst.on{border-bottom-color:var(--pp);color:var(--pp);font-weight:800}
  .wst.dn{border-bottom-color:var(--gr);color:var(--gr);font-weight:700}
  .wst em{display:block;font-style:normal;font-size:10.5px;opacity:.8;font-weight:400}

  .chk{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px dashed var(--line)}
  .chk:last-child{border-bottom:0}
  .chk i{font-style:normal;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;
    font-size:11px;font-weight:800;flex:none;margin-top:1px}
  .chk.ok i{background:var(--gr);color:#fff} .chk.no i{background:var(--line);color:var(--mut2)}
  .chk .tx b{display:block;font-size:13.5px;font-weight:700}
  .chk .tx span{display:block;font-size:12px;color:var(--mut);line-height:1.6}

  .prev{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
  .prev .brow{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--line2);border-bottom:1px solid var(--line)}
  .prev .brow i{width:9px;height:9px;border-radius:50%;background:#CBD5E1;display:block}
  .prev .brow .u{flex:1;background:var(--card);border:1px solid var(--line);border-radius:6px;
    padding:3px 10px;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--mut)}
  .prevbd{padding:16px 18px}
  .pgnb{display:flex;align-items:center;gap:16px;padding-bottom:12px;border-bottom:1px solid var(--line);
    margin-bottom:14px;flex-wrap:wrap}
  .pgnb .lg{font-size:14px;font-weight:900;letter-spacing:-.4px}
  .pgnb a{font-size:12.5px;color:var(--mut);text-decoration:none}
  .pgnb a.on{font-weight:800}
  .pcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .pcard{border:1px solid var(--line);border-radius:10px;padding:12px 13px}
  .pcard b{display:block;font-size:13.5px;font-weight:800;margin-bottom:2px}
  .pcard span{font-size:11.5px;color:var(--mut);line-height:1.55}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(14px);
    background:var(--nv);color:#fff;font-size:13px;font-weight:600;padding:10px 18px;border-radius:10px;
    opacity:0;pointer-events:none;transition:all .22s;z-index:60}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  .foot{margin:26px 0 0;padding:16px 18px;background:var(--card);border:1px solid var(--line);
    border-radius:12px;font-size:12px;color:var(--mut);line-height:1.8}
  .foot b{color:var(--ink)}
</style>

</div>

  function parseCats(txt){

        var name=p[0], slug=p[1]||name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"cat";
        return [name, slug, "A"];
      })
      .filter(function(c){
        return !RESTRICTED.some(function(r){ return r.n.split(" · ").some(function(w){ return c[0].indexOf(w)>=0; }); });
      });

      ["도메인 · 브랜드","관별","서브도메인 · 강조색 · 히어로 · 배너."],
      ["업종 · 슬러그","관별","업종은 관 안에서만 존재합니다. 같은 이름이라도 다른 관이면 다른 카테고리입니다."],
      ["요율 · 상한 · 부담 주체","관별","연결 관계가 다르면 돈을 내는 사람이 다릅니다."],
      ["인증 게이트","관별","소개몰은 사업자 인증, 부동산은 중개사 인증. 소개머니는 게이트가 없습니다."],
      ["검수 SLA · 자동 확정","관별","거래 속도가 다르므로 기간도 다릅니다."],
      ["SEO · 랜딩","관별","관마다 독립 랜딩이 생성됩니다."]
    ];
    return '<h1 class="pg">공유 경계 · 영향 범위</h1>'+
      '<p class="lead">관을 나눠도 나누지 않는 것들입니다. 이 경계가 흔들리면 정산이 깨집니다.</p>'+
      '<div class="cal k"><span class="lab">이번 결정</span>'+
      '<b>회원 · 소개코드 · 정산 전부 통합</b> · <b>서브도메인 분리</b> · <b>관 무제한 추가</b>. '+
      '소개자가 관을 옮겨도 실적이 이어지므로 새 관을 열 때 소개자를 처음부터 모을 필요가 없습니다 — '+
      '관을 늘리는 전략과 가장 잘 맞는 조합입니다.</div>'+
      '<div class="panel"><div class="pbd tw"><table><thead><tr>'+
      '<th style="width:180px">항목</th><th style="width:80px">범위</th><th>내용</th></tr></thead><tbody>'+
      rows.map(function(r){
        return '<tr><td><b>'+esc(r[0])+'</b></td>'+
          '<td><span class="gb '+(r[1]==="공유"?"A":"C")+'">'+esc(r[1])+'</span></td>'+
          '<td>'+r[2]+'</td></tr>';
      }).join("")+'</tbody></table></div></div>'+
      '<div class="cal w"><span class="lab">통합의 대가</span>'+
      '요율이 관마다 다른데 정산은 하나로 합쳐지므로, <b>정산 명세는 반드시 관별로 쪼개서 보여줘야 합니다</b>. '+
      '“이번 주 소개비 132만원”만 있으면 소개자는 어느 관에서 얼마가 나왔는지 알 수 없고, 이것이 문의 1순위가 됩니다.</div>'+
      '<div class="cal e"><span class="lab">새로 생긴 결정 항목</span>'+
      '<b>E-01</b> 관을 닫을 때 진행 중 Deal을 어떻게 할 것인가 (권장 — 신규만 차단, 기존은 완주)<br>'+
      '<b>E-02</b> 관 간 소개코드 귀속을 그대로 인정할 것인가 (권장 — 인정. 회원 단위 귀속)<br>'+
      '<b>E-03</b> 관을 몇 개까지 늘릴 것인가 · 늘리는 기준은 무엇인가 (권장 — 연결 관계가 다를 때만)<br>'+
      '<b>E-04</b> 관별 손익을 분리 집계할 것인가 (권장 — 집계는 분리, 지급은 통합)<br>'+
      '<b>E-05</b> 관 신설 권한을 누구에게 줄 것인가 (권장 — 최고관리자 단독 + 2인 승인)'+
      '</div>'+foot();
  }

  function foot(){
    return '<div class="foot"><b>소개뱅크 관 관리 콘솔</b> · admin.sogaebaenk.co.kr — IP 화이트리스트 적용 영역<br>'+
      '관 = 하나의 사이트. 서브도메인 분리 · 회원/소개코드/정산 통합 · 관 무제한 추가 구조입니다. '+
      '법적고지 및 약관 본문은 <b>확정 후 추가</b>됩니다.</div>';
  }

  /* ================= 렌더 ================= */
  var R={ list:scList, "new":scNew, edit:scEdit, launch:scLaunch, portal:scPortal, shared:scShared };
  function render(){
    var k=S.screen; if(!R[k]) k=S.screen="list";
    var m=META[k]||META.list;
    $("#meta").innerHTML='<span class="chip">관 관리</span>'+
      '<span class="sid">'+esc(m.id)+'</span><span class="nt">'+esc(m.nt)+'</span>';
    $("#view").innerHTML=R[k]();
    drawNav(); save();
  }
  function go(k){ S.screen=k; render(); window.scrollTo({top:0,behavior:"instant"}); }

  /* ================= 이벤트 ================= */
  document.addEventListener("click", function(e){
    var el;
    if((el=e.target.closest("[data-go]"))){ go(el.getAttribute("data-go")); return; }
    if((el=e.target.closest("[data-site]"))){ S.cur=el.getAttribute("data-site"); S.tab="basic"; go("edit"); return; }
    if((el=e.target.closest("[data-open]"))){ S.cur=el.getAttribute("data-open"); S.tab="basic"; go("edit"); return; }
    if((el=e.target.closest("[data-tab]"))){ S.tab=el.getAttribute("data-tab"); render(); return; }

    if((el=e.target.closest("[data-wrel]"))){ S.wiz.rel=el.getAttribute("data-wrel"); render(); return; }
    if((el=e.target.closest("[data-wstep]"))){ grabWiz(); S.wstep=Number(el.getAttribute("data-wstep")); render(); return; }
    if(e.target.closest("[data-wnext]")){ grabWiz(); if(wOk(S.wstep)){ S.wstep++; render(); } return; }
    if(e.target.closest("[data-wcreate]")){ createSite(); return; }

    if((el=e.target.closest("[data-status]"))){
      cur().status=el.getAttribute("data-status"); render();
      toast(cur().name+" → "+STN[cur().status]); return;
    }
    if((el=e.target.closest("[data-open-site]"))){
      site(el.getAttribute("data-open-site")).status="LIVE"; render(); toast("운영중으로 전환했습니다"); return;
    }
    if((el=e.target.closest("[data-delcat]"))){
      var i=Number(el.getAttribute("data-delcat"));
      var nm=cur().cats[i][0];
      cur().cats.splice(i,1); render(); toast(nm+" 삭제 — /"+"슬러그 링크가 404가 됩니다"); return;
    }
    if(e.target.closest("[data-addcat]")){
      var v=$("#eNewCat").value.trim(); if(!v){ toast("업종명을 입력하세요"); return; }
      var c=parseCats(v)[0];
      if(!c){ toast("등록할 수 없는 업종입니다 — 제한업종"); return; }
      cur().cats.push(c); render(); toast(c[0]+" 추가 — 랜딩 1개가 생성됩니다"); return;
    }
    if(e.target.closest("[data-savesite]")){ saveSite(); return; }

    var tg=e.target.closest(".tg");
    if(tg){ tg.classList.toggle("on"); tg.setAttribute("aria-pressed", tg.classList.contains("on")); return; }
  });

  document.addEventListener("input", function(e){
    if(S.screen!=="new") return;
    if(!e.target.classList || !e.target.classList.contains("in")) return;
    grabWiz();
    var b=document.querySelector("[data-wnext]");
    if(b) b.disabled=!wOk(S.wstep);
  });

  function grabWiz(){
    var w=S.wiz;
    var g=function(id){ var e=$("#"+id); return e?e.value:null; };
    if(g("wname")!=null) w.name=g("wname");
    if(g("wcode")!=null) w.code=g("wcode").toUpperCase();
    if(g("wsub")!=null) w.sub=g("wsub").toLowerCase();
    if(g("wcolor")!=null) w.color=g("wcolor");
    if(g("wcats")!=null) w.cats=g("wcats");
    if(g("wrate")!=null) w.rate=g("wrate");
    if(g("wcap")!=null) w.cap=g("wcap");
    if(g("wpayer")!=null) w.payer=g("wpayer");
    if($("#wgb")) w.gateBiz=$("#wgb").classList.contains("on");
    if($("#wgk")) w.gateBroker=$("#wgk").classList.contains("on");
  }
  function createSite(){
    grabWiz();
    var w=S.wiz;
    if(site(w.code)){ toast("이미 있는 관 코드입니다"); return; }
    S.sites.push({
      code:w.code, name:w.name, sub:w.sub, color:w.color, status:"PREP",
      order:S.sites.length+1, rel:w.rel, payer:w.payer,
      rate:Number(w.rate), cap:Number(w.cap), escrow:"none",
      gateBiz:!!w.gateBiz, gateBroker:!!w.gateBroker, verify:"deal", sla:24, auto:7,
      hero:w.name+"에서 새로운 소개를 만나보세요",
      seo:"{업종} · "+w.name+" | 소개뱅크",
      cats:parseCats(w.cats)
    });
    S.wiz=JSON.parse(JSON.stringify(DEF.wiz)); S.wstep=1;
    S.cur=w.code; S.tab="basic"; go("list");
    toast(w.name+" 생성 — 준비중 상태입니다");
  }
  function saveSite(){
    var x=cur();
    var g=function(id){ var e=$("#"+id); return e?e.value:null; };
    if(g("eName")!=null) x.name=g("eName");
    if(g("eSub")!=null) x.sub=g("eSub").toLowerCase();
    if(g("eOrder")!=null) x.order=Number(g("eOrder"))||x.order;
    if(g("eColor")!=null) x.color=g("eColor");
    if(g("eHero")!=null) x.hero=g("eHero");
    if(g("eRate")!=null) x.rate=Number(g("eRate"))||x.rate;
    if(g("eCap")!=null) x.cap=Number(g("eCap"))||x.cap;
    if(g("ePayer")!=null) x.payer=g("ePayer");
    if(g("eEsc")!=null) x.escrow=g("eEsc");
    if(g("eVerify")!=null) x.verify=g("eVerify");
    if(g("eSla")!=null) x.sla=Number(g("eSla"))||x.sla;
    if(g("eAuto")!=null) x.auto=Number(g("eAuto"))||x.auto;
    if($("#eGB")) x.gateBiz=$("#eGB").classList.contains("on");
    if($("#eGK")) x.gateBroker=$("#eGK").classList.contains("on");
    render(); toast("저장했습니다 — 배포 없이 즉시 반영됩니다");
  }

  load(); render();
})();
</script>

</body></html>
