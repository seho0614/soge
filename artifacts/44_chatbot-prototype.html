<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found]){display:none!important}</style></head><body>
<title>소개뱅크 챗봇 프로토타입</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#F4F6FA;--card:#FFFFFF;--sunk:#EDF0F6;--well:#F8FAFD;
  --ink:#101827;--ink2:#33405A;--mut:#5C6880;--mut2:#8791A6;
  --line:#DFE4EE;--line2:#EDF0F6;
  --bot:#7B3FB5;--bot-bg:#F4ECFB;
  --s1:#2F5FD0;--s2:#0E8A6E;--s3:#C2610A;
  --ok:#0E7A56;--ok-bg:#E7F4EF;--bad:#B3300F;--bad-bg:#FBECE7;
  --warn:#8A5A00;--warn-bg:#FDF3E0;--info:#22449E;--info-bg:#EAF0FC;
  --focus:#2F5FD0;--sh:0 1px 2px rgba(16,24,39,.07),0 4px 12px rgba(16,24,39,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#090E1A;--card:#141C2E;--sunk:#0F1626;--well:#111A2B;
  --ink:#E9EEF8;--ink2:#C3CCDD;--mut:#8B99B3;--mut2:#6B7893;
  --line:#243049;--line2:#1B2436;
  --bot:#B07DE0;--bot-bg:#1E1430;
  --s1:#6A90EB;--s2:#22A883;--s3:#CB761F;
  --ok:#3EBE92;--ok-bg:#0F2A22;--bad:#F0765A;--bad-bg:#2C1410;
  --warn:#E0A93A;--warn-bg:#2A2008;--info:#93AEDD;--info-bg:#131F3B;
  --focus:#6A90EB;--sh:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  --ground:#090E1A;--card:#141C2E;--sunk:#0F1626;--well:#111A2B;
  --ink:#E9EEF8;--ink2:#C3CCDD;--mut:#8B99B3;--mut2:#6B7893;
  --line:#243049;--line2:#1B2436;
  --bot:#B07DE0;--bot-bg:#1E1430;
  --s1:#6A90EB;--s2:#22A883;--s3:#CB761F;
  --ok:#3EBE92;--ok-bg:#0F2A22;--bad:#F0765A;--bad-bg:#2C1410;
  --warn:#E0A93A;--warn-bg:#2A2008;--info:#93AEDD;--info-bg:#131F3B;
  --focus:#6A90EB;--sh:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:"IBM Plex Sans KR","Malgun Gothic",system-ui,sans-serif;font-size:14px;line-height:1.65;
  -webkit-font-smoothing:antialiased}
.num{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:5px}

.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.top .in{max-width:1420px;margin:0 auto;padding:12px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px}
.mk{margin-right:auto;display:flex;flex-direction:column}
.mk b{font-size:15.5px;font-weight:700;letter-spacing:-.3px}
.mk span{font-size:11px;color:var(--mut2)}
.modes{display:flex;background:var(--sunk);border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px}
.modes button{border:0;background:transparent;color:var(--mut);font-size:12.5px;font-weight:600;
  padding:6px 14px;border-radius:7px;white-space:nowrap}
.modes button[aria-pressed=true]{background:var(--bot);color:#fff}
.gh{border:1px solid var(--line);background:var(--card);color:var(--ink2);font-size:12px;
  font-weight:600;padding:6px 12px;border-radius:7px}
.gh[aria-pressed=true]{background:var(--info-bg);border-color:transparent;color:var(--info)}

.wrap{max-width:1420px;margin:0 auto;padding:18px 20px 64px}
.hero{margin-bottom:16px}
.hero h1{font-size:21px;font-weight:600;letter-spacing:-.5px;margin-bottom:4px}
.hero p{margin:0;font-size:13px;color:var(--mut);max-width:760px}
.note{background:var(--info-bg);border-left:3px solid var(--info);border-radius:0 9px 9px 0;
  padding:11px 15px;font-size:12.5px;color:var(--ink2);line-height:1.75;margin-bottom:14px}
.note b{color:var(--ink)}
.note.w{background:var(--warn-bg);border-color:var(--warn)}
.note.g{background:var(--ok-bg);border-color:var(--ok)}
.note.b{background:var(--bot-bg);border-color:var(--bot)}

.stage{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:960px){.stage{grid-template-columns:1fr}}

/* phone */
.phone{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;
  box-shadow:var(--sh);position:sticky;top:74px}
@media (max-width:960px){.phone{position:static}}
.phead{background:var(--bot);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px}
.phead .av{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.22);
  display:flex;align-items:center;justify-content:center;font-size:14px}
.phead b{font-size:13.5px;font-weight:600;display:block;line-height:1.3}
.phead span{font-size:10.5px;opacity:.85}
.ctx{background:var(--well);border-bottom:1px solid var(--line2);padding:7px 15px;
  font-size:10.5px;color:var(--mut);font-family:"IBM Plex Mono",monospace}
.stream{height:456px;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--well)}
.msg{max-width:80%;padding:10px 13px;border-radius:14px;font-size:13px;line-height:1.65}
.msg.b{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg.u{align-self:flex-end;background:var(--s1);color:#fff;border-bottom-right-radius:5px}
.msg .card{border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin-top:8px;
  background:var(--well);font-size:12px;line-height:1.75}
.msg .card b{font-family:"IBM Plex Mono",monospace}
.qr{display:flex;flex-wrap:wrap;gap:6px;align-self:flex-start;max-width:90%}
.qr span{font-size:11.5px;padding:6px 12px;border:1px solid var(--bot);color:var(--bot);
  border-radius:999px;background:var(--card);font-weight:600}
.sys{align-self:center;font-size:10.5px;color:var(--mut2);background:var(--sunk);
  padding:3px 11px;border-radius:999px;font-family:"IBM Plex Mono",monospace}
.esc{align-self:stretch;background:var(--warn-bg);border:1px dashed var(--warn);border-radius:10px;
  padding:9px 12px;font-size:11.5px;color:var(--warn);font-weight:600}
.compose{border-top:1px solid var(--line2);padding:11px 14px;display:flex;gap:9px;align-items:center;background:var(--card)}
.compose .in{flex:1;border:1px solid var(--line);border-radius:999px;padding:9px 15px;
  font-size:12.5px;color:var(--mut2);background:var(--well)}
.send{background:var(--bot);color:#fff;border:0;border-radius:999px;padding:8px 15px;font-size:12px;font-weight:600}
.play{display:flex;gap:7px;padding:10px 14px;background:var(--card);border-top:1px solid var(--line2);align-items:center}
.play button{border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:7px;
  padding:6px 12px;font-size:11.5px;font-weight:600}
.play .pg{margin-left:auto;font-size:11px;color:var(--mut2);font-family:"IBM Plex Mono",monospace}

/* right column */
.pan{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 17px;margin-bottom:14px}
.pan h3{font-size:14px;font-weight:600;letter-spacing:-.2px;margin-bottom:3px}
.pan .sub{font-size:11.5px;color:var(--mut);margin-bottom:11px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:6px 0;
  border-bottom:1px dashed var(--line2)}
.kv:last-child{border:0}
.kv .m{color:var(--mut)}
.kv b{font-family:"IBM Plex Mono",monospace;font-weight:600}
.kv b.on{color:var(--ok)}.kv b.off{color:var(--mut2)}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.4px;color:var(--mut2);
  padding:6px 9px;border-bottom:1px solid var(--line);text-transform:uppercase;white-space:nowrap}
table.t td{padding:8px 9px;border-bottom:1px solid var(--line2);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
.st{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:5px;white-space:nowrap}
.st.o{background:var(--ok-bg);color:var(--ok)}
.st.b{background:var(--bad-bg);color:var(--bad)}
.st.w{background:var(--warn-bg);color:var(--warn)}
.st.n{background:var(--sunk);color:var(--mut)}
.st.i{background:var(--info-bg);color:var(--info)}
.rules{display:flex;flex-direction:column;gap:8px}
.rule{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;font-size:12.5px;line-height:1.7}
.rule .ic{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;flex:none}
.rule.no .ic{background:var(--bad-bg);color:var(--bad)}
.rule.yes .ic{background:var(--ok-bg);color:var(--ok)}
.rule b{color:var(--ink)}
.rule span{color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:11px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;
  color:var(--ink2);font-family:"IBM Plex Mono",monospace}
.foot{font-size:11.5px;color:var(--mut);line-height:1.9;margin-top:6px}
.foot b{color:var(--ink2)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="top"><div class="in">
  <div class="mk"><b>소개뱅크 챗봇 프로토타입</b>

  <div class="stage">

</div>

const COMMON=[
 ['공통','봇은 판단하지 않고 기록과 안내만 합니다','세 모드가 지키는 하나의 원칙입니다. 등급 · 검수 · 합의 금액 · 성사 — 판단을 봇에게 넘기면 그 근거가 봇의 출력이 되어버립니다.'],
 ['공통','대화는 항상 플랫폼 안에 남습니다','귀속(INV-2)도 정산 근거도 대화 기록 위에 서 있습니다.'],
 ['공통','넘길 때는 대화를 통째로 넘깁니다','회원이 같은 설명을 두 번 하지 않게 합니다.'],
];

let mode='lead', ann=true, step=999;
/* step=999 → 전체 보기. '처음부터'로 한 단계씩 따라갈 수 있습니다 */
const $=id=>document.getElementById(id);

function render(){
  const m=M[mode];
  $('hero').innerHTML=`<h1>${m.title}</h1><p>${m.desc}</p>`;
  $('topnote').hidden=!ann;

  const shown=m.msgs.slice(0,step);
  $('phone').innerHTML=`
   <div class="phead"><span class="av">${m.avatar}</span>
     <span><b>${m.who}</b><span>${m.sub}</span></span></div>
   <div class="ctx">${m.ctx}</div>
   <div class="stream" id="stream">${shown.map(([t,a,b])=>{
     if(t==='q')return `<div class="qr">${a.split('|').map(x=>`<span>${x}</span>`).join('')}</div>`;
     if(t==='s')return `<div class="sys">${a}</div>`;
     if(t==='e')return `<div class="esc">⚠ ${a}</div>`;
     return `<div class="msg ${t}">${a}${b?`<div class="card">${b}</div>`:''}</div>`;}).join('')}</div>
   <div class="compose"><span class="in">메시지를 입력하세요</span><button class="send">보내기</button></div>
   <div class="play"><button id="rw">처음부터</button><button id="st">한 단계</button>
     <button id="all">전체 보기</button>
     <span class="pg">${Math.min(step,m.msgs.length)} / ${m.msgs.length}</span></div>`;

  $('side').innerHTML=`
   <div class="pan"><h3>봇이 시스템에 남기는 것</h3>
    <div class="sub">대화가 진행되면 이 값들이 채워집니다 — 화면 왼쪽의 회색 줄이 그 시점입니다.</div>
    ${m.state.map(([k,v,s])=>`<div class="kv"><span class="m">${k}</span><b class="${s}">${v}</b></div>`).join('')}</div>

   <div class="pan"><h3>하는 것 · 하지 않는 것</h3>
    <div class="sub">이 프로토타입에서 가장 중요한 부분입니다.</div>
    <div class="rules">${m.rules.map(([t,h,d])=>`
      <div class="rule ${t}"><span class="ic">${t==='no'?'✕':'✓'}</span>
        <span><b>${h}</b><br>${d}</span></div>`).join('')}</div></div>

   <div class="pan"><h3>사람에게 넘기는 조건</h3>
    <div class="sub">봇이 스스로 물러나는 지점을 미리 정해 둡니다.</div>
    <table class="t"><tr><th>조건</th><th>넘기는 곳</th></tr>
     ${m.esc.map(([a,b])=>`<tr><td>${a}</td><td>${b}</td></tr>`).join('')}</table></div>

   ${ann?`<div class="pan"><h3>무엇으로 성패를 볼 것인가</h3>
    <div class="sub">아직 정해진 지표가 없습니다 — 제안입니다.</div>
    <table class="t"><tr><th>지표</th><th>정의</th></tr>
     ${m.metric.map(([a,b])=>`<tr><td><b>${a}</b></td><td>${b}</td></tr>`).join('')}</table></div>

   <div class="pan"><h3>세 모드가 공통으로 지키는 것</h3>
    <div class="rules">${COMMON.map(([,h,d])=>`
      <div class="rule yes"><span class="ic">✓</span><span><b>${h}</b><br>${d}</span></div>`).join('')}</div></div>

   <div class="note b" style="margin-bottom:0"><b>결정 등기부에 올려야 할 것</b><br>
    ① 챗봇 도입 여부와 범위 — 세 모드를 다 할지, 하나부터 할지<br>
    ② 봇 응답의 책임 소재 — 오안내 시 누가 책임지는지<br>
    ③ 대화 로그의 보관 기간과 개인정보 처리 — 리드 진단 모드는 소비자 대화입니다<br>
    ④ 에스컬레이션 SLA — 넘긴 뒤 사람이 언제까지 답하는지<br>
    ⑤ 알림 정책(제안 G-03)과의 관계 — 봇 알림도 같은 정책을 따르는지</div>`:''}

   <p class="foot"><b>배치</b> · ${m.where}<br>
    <b>이 프로토타입의 범위</b> · 대화 흐름과 경계 규칙까지입니다. 인텐트 사전 · 응답 템플릿 · 모델 선택은
    도입이 결정된 뒤에 정할 일입니다.</p>`;

  const s=$('stream'); if(s)s.scrollTop=s.scrollHeight;
  $('rw').onclick=()=>{step=1;render();};
  $('st').onclick=()=>{step=Math.min(step+1,m.msgs.length);render();};
  $('all').onclick=()=>{step=m.msgs.length;render();};
}
document.querySelectorAll('.modes button').forEach(b=>b.onclick=()=>{
  mode=b.dataset.m;step=999;
  document.querySelectorAll('.modes button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
  render();scrollTo({top:0,behavior:'smooth'});});
$('annBtn').onclick=()=>{ann=!ann;$('annBtn').setAttribute('aria-pressed',String(ann));render();};
render();
</script>
