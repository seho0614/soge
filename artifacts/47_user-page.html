<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}</style></head><body>
<title>소개뱅크 사용자 페이지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
  :root{
    --pp:#7C3AED; --pp-d:#6D28D9; --pp-l:#F5F1FE; --pp-l2:#EDE7FC;
    --bl:#2563EB; --bl-d:#1D4ED8; --bl-l:#EFF6FF;
    --or:#F97316; --or-d:#EA580C; --or-l:#FFF7ED;
    --gr:#10B981; --gr-d:#059669; --gr-l:#ECFDF5;
    --rd:#EF4444; --navy:#1E293B;
    --g900:#111827; --g700:#374151; --g500:#6B7280; --g400:#9CA3AF;
    --g300:#D1D5DB; --g200:#E5E7EB; --g100:#F3F4F6; --g50:#F9FAFB;
    --shell:#E9EAEE; --bg:#F7F8FA; --card:#FFFFFF;
    --ink:#111827; --ink2:#4B5563; --ink3:#6B7280; --line:#E5E7EB; --line2:#F3F4F6;
    --f:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    --m:"IBM Plex Mono",ui-monospace,Menlo,monospace;
    --sh:0 1px 2px rgba(17,24,39,.06); --sh2:0 4px 18px rgba(17,24,39,.10);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --pp:#A78BFA; --pp-d:#9370F5; --pp-l:#241C38; --pp-l2:#2B2145;
      --bl:#7FA9F5; --bl-d:#6B9AF0; --bl-l:#18233A;
      --or:#F79055; --or-d:#F0803F; --or-l:#33200F;
      --gr:#5FCFA6; --gr-d:#4EC298; --gr-l:#122A22;
      --rd:#F27F7F; --navy:#141A24;
      --g900:#E9EBEE; --g700:#B9BFC7; --g500:#8B929B; --g400:#6E757E;
      --g300:#4A515A; --g200:#333941; --g100:#262B32; --g50:#20242A;
      --shell:#111418; --bg:#171A1F; --card:#1E2228;
      --ink:#E9EBEE; --ink2:#AEB4BC; --ink3:#868D96; --line:#333941; --line2:#262B32;
      --sh:0 1px 2px rgba(0,0,0,.45); --sh2:0 4px 20px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --pp:#A78BFA; --pp-d:#9370F5; --pp-l:#241C38; --pp-l2:#2B2145;
    --bl:#7FA9F5; --bl-d:#6B9AF0; --bl-l:#18233A;
    --or:#F79055; --or-d:#F0803F; --or-l:#33200F;
    --gr:#5FCFA6; --gr-d:#4EC298; --gr-l:#122A22;
    --rd:#F27F7F; --navy:#141A24;
    --g900:#E9EBEE; --g700:#B9BFC7; --g500:#8B929B; --g400:#6E757E;
    --g300:#4A515A; --g200:#333941; --g100:#262B32; --g50:#20242A;
    --shell:#111418; --bg:#171A1F; --card:#1E2228;
    --ink:#E9EBEE; --ink2:#AEB4BC; --ink3:#868D96; --line:#333941; --line2:#262B32;
    --sh:0 1px 2px rgba(0,0,0,.45); --sh2:0 4px 20px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--shell);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.55;
       -webkit-font-smoothing:antialiased;word-break:keep-all}
  button{font-family:inherit;font-size:inherit;cursor:pointer;border:0;background:none;color:inherit}
  input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
  a{text-decoration:none;color:inherit}
  :focus-visible{outline:2px solid var(--bl);outline-offset:2px}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

  /* ============ shell ============ */
  .app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
  @media (max-width:940px){ .app{grid-template-columns:1fr} .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)} }
  .rail{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--bg);
        border-right:1px solid var(--line);padding:16px 12px 40px}
  .rail h1{font-size:14px;font-weight:900;letter-spacing:-.03em;margin:0 0 2px;display:flex;align-items:center;gap:7px}
  .rail .sub{font-size:10px;color:var(--ink3);font-family:var(--m);letter-spacing:.06em;margin-bottom:15px}
  .grp{margin-bottom:12px}
  .grp>.lbl{font-family:var(--m);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;
            color:var(--ink3);padding:0 8px;margin-bottom:5px;display:block}
  .nb{display:block;width:100%;text-align:left;border:1px solid transparent;padding:7px 9px;
      border-radius:7px;color:var(--ink2);line-height:1.3;margin-bottom:2px}
  .nb .t{font-size:12.5px;font-weight:500;display:block}
  .nb .id{font-family:var(--m);font-size:9px;color:var(--ink3)}
  .nb:hover{background:var(--g100)}
  .nb[aria-current="true"]{background:var(--card);border-color:var(--line);color:var(--ink);box-shadow:var(--sh)}
  .nb[aria-current="true"] .t{font-weight:700}
  .rf{margin-top:14px;padding:0 8px;font-size:11px;color:var(--ink3);line-height:1.5}

  .stage{padding:16px 20px 50px;min-width:0;overflow-x:auto}
  @media (max-width:640px){ .stage{padding:12px 10px 40px} }
  .sbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:11px}
  .sid{font-family:var(--m);font-size:10.5px;color:var(--ink3)}
  .snote{font-size:11.5px;color:var(--ink2);flex:1;min-width:180px}
  .chip{font-family:var(--m);font-size:10px;padding:3px 8px;border-radius:5px;background:var(--g100);color:var(--ink3)}

  .frame{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;
         box-shadow:var(--sh2);min-width:1080px}
  .fbar{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--g50);border-bottom:1px solid var(--line)}
  .fd{width:8px;height:8px;border-radius:50%;background:var(--g200)}
  .fu{flex:1;font-family:var(--m);font-size:10px;color:var(--ink3);background:var(--card);
      border:1px solid var(--line);border-radius:5px;padding:2px 8px}
  .page{background:var(--bg)}

  /* ============ 공통 헤더 ============ */
  .wrap{max-width:1400px;margin:0 auto;padding:0 20px}
  .hd{background:var(--card);border-bottom:1px solid var(--line)}
  .hdin{display:flex;align-items:center;height:58px;gap:34px}
  .lg{display:flex;align-items:center;gap:8px;flex:none}
  .lg .t{font-size:20px;font-weight:900;letter-spacing:-.045em}
  .gnb{display:flex;gap:30px;flex:1;min-width:0}
  .gnb a{font-size:14.5px;font-weight:500;color:var(--g700);white-space:nowrap}
  .gnb a:hover{color:var(--pp)}
  .gnb a.on{color:var(--bl);font-weight:700}
  .hr{display:flex;align-items:center;gap:11px;flex:none;font-size:12.5px;color:var(--ink2)}
  .hr .sep{color:var(--g200)}
  .bell{position:relative;display:flex;align-items:center}
  .bell i{position:absolute;top:-3px;right:-4px;background:var(--rd);color:#fff;font-size:9px;
          font-weight:700;width:15px;height:15px;border-radius:8px;display:flex;
          align-items:center;justify-content:center;font-style:normal}
  .bo{border:1px solid var(--line);background:var(--card);color:var(--g700);padding:7px 16px;
      border-radius:7px;font-size:13px;font-weight:500}
  .bo:hover{background:var(--g50)}
  .bp{background:var(--pp);color:#fff;padding:8px 18px;border-radius:7px;font-size:13px;font-weight:700}
  .bp:hover{background:var(--pp-d)}
  .bb{background:var(--bl);color:#fff;padding:8px 18px;border-radius:7px;font-size:13px;font-weight:700}

  /* ============ 검색 ============ */
  .sb{display:flex;border:2px solid var(--pp);border-radius:9px;overflow:hidden;background:var(--card)}
  .sb.blue{border-color:var(--bl)}
  .sb .sc{padding:0 13px;border-right:1px solid var(--line);font-size:13.5px;font-weight:500;
          display:flex;align-items:center;gap:6px;white-space:nowrap}
  .sb .si{flex:1;padding:13px 14px;font-size:13.5px;color:var(--g400);min-width:0}
  .sb .sg{width:56px;background:var(--pp);display:flex;align-items:center;justify-content:center;color:#fff}
  .sb.blue .sg{background:var(--bl)}
  .kw{display:flex;align-items:center;gap:8px;margin-top:12px}
  .kw .l{font-size:12.5px;font-weight:700;color:var(--g700);flex:none}
  .kwl{display:flex;gap:6px;overflow:hidden;flex:1;min-width:0}
  .kwl span{font-size:12px;color:var(--ink2);background:var(--card);border:1px solid var(--line);
            border-radius:7px;padding:5px 12px;white-space:nowrap;flex:none}
  .kwn{flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);
       background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--ink3)}

  /* ============ 히어로 ============ */
  .hero{display:grid;grid-template-columns:340px 1fr;gap:30px;align-items:start;padding:28px 0 0}
  .hero h2{font-size:31px;font-weight:900;line-height:1.32;letter-spacing:-.045em;margin:0}
  .hero h2 .p{color:var(--pp);display:block}
  .hero p{font-size:13.5px;color:var(--ink2);line-height:1.7;margin:15px 0 0;font-weight:300}
  .hb{display:flex;gap:9px;margin:20px 0 0;flex-wrap:wrap}
  .hbtn{display:inline-flex;align-items:center;gap:7px;padding:11px 19px;border-radius:9px;
        font-size:14px;font-weight:700}
  .hbtn.f{background:var(--pp);color:#fff}
  .hbtn.o{border:1.5px solid #D9CBF8;color:var(--pp);background:var(--card)}
  .hf{display:flex;gap:19px;margin:22px 0 0;flex-wrap:wrap}
  .hf div{display:flex;gap:7px;align-items:flex-start}
  .hf .ic{color:var(--pp);flex:none;margin-top:1px;opacity:.85}
  .hf .t{font-size:11px;font-weight:700;color:var(--g700);line-height:1.35;display:block}
  .hf .d{font-size:10.5px;color:var(--g400);line-height:1.35;display:block}

  /* 보라 프로모 배너 */
  .promo{margin-top:16px;background:var(--pp-l);border-radius:12px;padding:20px 24px;
         display:flex;align-items:center;gap:18px}
  .promo .tx{flex:1;min-width:0}
  .promo .s{font-size:13px;color:var(--ink2);font-weight:500}
  .promo .b{font-size:23px;font-weight:900;color:var(--pp);letter-spacing:-.04em;margin:5px 0}
  .promo .d{font-size:12.5px;color:var(--ink2)}
  .promo .go{background:var(--pp);color:#fff;padding:11px 20px;border-radius:8px;
             font-size:13.5px;font-weight:700;white-space:nowrap;flex:none}

  /* ============ 제휴 배너 ============ */
  .banners{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
  .bn{border-radius:12px;overflow:hidden;position:relative;min-height:246px;display:flex}
  .bn .tx{padding:20px 22px;position:relative;z-index:2;flex:1;min-width:0}
  .bn.sun{background:linear-gradient(120deg,#E8F1FC 0%,#DCE9F8 60%,#CFE0F4 100%)}
  .bn.farm{background:linear-gradient(120deg,#EEF7F0 0%,#E4F2E8 60%,#DAEDE0 100%);border:1px solid #CFE6D6}
  :root[data-theme="dark"] .bn.sun,:root[data-theme="dark"] .bn.farm{filter:brightness(.42) saturate(.8)}
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .bn.sun,
    :root:not([data-theme="light"]) .bn.farm{filter:brightness(.42) saturate(.8)} }
  .bn .lgo{display:flex;align-items:center;gap:8px;margin-bottom:13px}
  .bn .lgo .n{font-size:15px;font-weight:900;letter-spacing:-.02em;line-height:1.05;color:#1F2937}
  .bn .lgo .s{font-size:7.5px;letter-spacing:.15em;font-weight:700;display:block;margin-top:1px}
  .bn.sun .lgo .s{color:#1E3A8A} .bn.farm .lgo .s{color:#047857}
  .bn h3{font-size:21px;font-weight:900;letter-spacing:-.04em;line-height:1.4;margin:0;color:#111827}
  .bn.sun h3 .a{color:#1D4ED8} .bn.farm h3 .a{color:#047857}
  .bn ul{list-style:none;margin:13px 0 0;padding:0}
  .bn li{display:flex;gap:6px;font-size:12px;color:#374151;margin-bottom:7px;align-items:center}
  .bn li .c{color:#111827;font-weight:900;font-size:11px}
  .bn p{font-size:12.5px;color:#374151;line-height:1.65;margin:9px 0 0}
  .bn .ic4{display:flex;gap:16px;margin:14px 0 0}
  .bn .ic4 div{display:flex;flex-direction:column;align-items:center;gap:5px;width:62px}
  .bn .ic4 .c{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.85);
              display:flex;align-items:center;justify-content:center;color:#047857}
  .bn .ic4 .l{font-size:9.5px;color:#374151;text-align:center;line-height:1.25;font-weight:500}
  .bn .cta{margin-top:15px;display:inline-flex;align-items:center;gap:6px;color:#fff;
           padding:10px 18px;border-radius:8px;font-size:13px;font-weight:700}
  .bn.sun .cta{background:#1E3A8A} .bn.farm .cta{background:#047857}
  .bn .img{width:44%;flex:none;position:relative;overflow:hidden}
  .bn .img svg{position:absolute;inset:0;width:100%;height:100%}
  @media (max-width:1180px){ .banners{grid-template-columns:1fr} }

  /* ============ 3대 서비스 ============ */
  .svc{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:18px}
  @media (max-width:1080px){ .svc{grid-template-columns:1fr} }
  .sv{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:19px;
      display:grid;grid-template-columns:1fr 128px;gap:14px}
  .sv .hd2{display:flex;align-items:center;gap:8px}
  .sv .no{width:21px;height:21px;border-radius:50%;color:#fff;font-size:11.5px;font-weight:700;
          display:flex;align-items:center;justify-content:center;flex:none}
  .sv h3{font-size:17px;font-weight:900;margin:0;letter-spacing:-.035em}
  .sv .ds{font-size:12px;color:var(--ink2);line-height:1.65;margin:9px 0 0;font-weight:300}
  .sv .go{display:inline-flex;align-items:center;gap:5px;color:#fff;padding:8px 15px;
          border-radius:7px;font-size:12.5px;font-weight:700;margin-top:13px}
  .sv .ill{display:flex;align-items:flex-end;justify-content:center}
  .sv ul{list-style:none;margin:0;padding:0;grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
  .sv ul li{display:flex;gap:7px;font-size:12px;color:var(--g700);padding:4px 0;align-items:center}
  .sv-1 .no{background:var(--bl)} .sv-1 h3{color:var(--bl)} .sv-1 .go{background:var(--bl)} .sv-1 li .i{color:var(--bl)}
  .sv-2 .no{background:var(--gr-d)} .sv-2 h3{color:var(--gr-d)} .sv-2 .go{background:var(--gr-d)} .sv-2 li .i{color:var(--gr-d)}
  .sv-3 .no{background:var(--or)} .sv-3 h3{color:var(--or)} .sv-3 .go{background:var(--or)} .sv-3 li .i{color:var(--or)}
  @media (max-width:520px){ .sv{grid-template-columns:1fr} .sv .ill{display:none} .sv ul{grid-template-columns:1fr} }

  /* ============ 통계 ============ */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);margin:16px 0 40px;background:var(--card);
         border:1px solid var(--line);border-radius:12px;overflow:hidden}
  @media (max-width:840px){ .stats{grid-template-columns:repeat(2,1fr)} }
  .st{display:flex;gap:13px;padding:20px;border-right:1px solid var(--line2);align-items:center}
  .st:last-child{border-right:0}
  .st .em{font-size:28px;line-height:1;flex:none}
  .st .k{font-size:11.5px;color:var(--ink3);font-weight:500}
  .st .v{font-size:23px;font-weight:900;letter-spacing:-.04em;line-height:1.2;
         font-variant-numeric:tabular-nums;margin:1px 0}
  .st .d{font-size:10.5px;color:var(--g400)}
  .st:nth-child(1) .v{color:var(--bl)} .st:nth-child(2) .v{color:var(--gr-d)}
  .st:nth-child(3) .v{color:var(--or)} .st:nth-child(4) .v{color:var(--pp)}

  /* ============ 탭 ============ */
  .tabs{display:flex;gap:8px;padding-top:16px}
  .tab{padding:9px 26px;border-radius:8px;font-size:14px;font-weight:700;border:1px solid var(--bl);
       background:var(--card);color:var(--bl)}
  .tab.on{background:var(--bl);color:#fff}
  :root[data-theme="dark"] .tab.on{color:#14181F}
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .tab.on{color:#14181F} }
  .tabnote{font-size:12px;color:var(--ink3);margin-top:8px}

  /* ============ 본문 레이아웃 ============ */
  .body2{padding:16px 0 0}
  .lay{display:grid;grid-template-columns:212px 1fr;gap:16px;align-items:start}
  @media (max-width:980px){ .lay{grid-template-columns:1fr} .side{display:none} }
  .panel{background:var(--card);border:1px solid var(--line);border-radius:11px}
  .side{display:flex;flex-direction:column;gap:12px}
  .loc{padding:14px}
  .loc .lh{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;margin-bottom:11px}
  .loc select{width:100%;border:1px solid var(--line);border-radius:7px;padding:8px 10px;
              font-size:12.5px;background:var(--card)}
  .loc .keep{width:100%;margin-top:8px;background:#111827;color:#fff;padding:9px;
             border-radius:7px;font-size:12.5px;font-weight:500}
  :root[data-theme="dark"] .loc .keep{background:#E9EBEE;color:#14181F}
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .loc .keep{background:#E9EBEE;color:#14181F} }
  .cathd{background:var(--navy);color:#fff;border-radius:11px 11px 0 0;padding:11px 14px;
         font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:8px}
  .catl{border:1px solid var(--line);border-top:0;border-radius:0 0 11px 11px;background:var(--card);overflow:hidden}
  .catl .gp{padding:8px 13px 3px;font-size:10.5px;font-weight:700;color:var(--ink3)}
  .catl a{display:flex;align-items:center;gap:8px;padding:9px 13px;font-size:13px;
          color:var(--g700);border-bottom:1px solid var(--line2)}
  .catl a:last-child{border-bottom:0}
  .catl a:hover{background:var(--g50);color:var(--bl)}
  .catl a .cx{margin-left:auto;color:var(--g300)}
  .mylist{background:var(--bl-l);border:1px solid var(--bl);border-radius:9px;padding:11px;
          text-align:center;font-size:12.5px;font-weight:700;color:var(--bl)}

  /* 카테고리 아이콘 */
  .icons{padding:20px 12px;display:grid;grid-template-columns:repeat(12,1fr);gap:4px}
  @media (max-width:1180px){ .icons{grid-template-columns:repeat(6,1fr);gap:12px} }
  @media (max-width:560px){ .icons{grid-template-columns:repeat(4,1fr)} }
  .ico{display:flex;flex-direction:column;align-items:center;gap:8px}
  .ico .c{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center}
  .ico .n{font-size:11.5px;color:var(--g700);text-align:center;line-height:1.3;font-weight:500}
  .ico:hover .n{color:var(--bl)}

  /* 섹션 헤더 · 카드 */
  .sh2{display:flex;align-items:center;justify-content:space-between;padding:16px 17px 0}
  .sh2 b{font-size:16px;font-weight:700;display:flex;align-items:center;gap:6px;letter-spacing:-.025em}
  .sh2 span{font-size:12px;color:var(--ink3)}
  .carou{position:relative;padding:13px 17px 17px}
  .track{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
  @media (max-width:1180px){ .track{grid-template-columns:repeat(3,1fr)} }
  @media (max-width:720px){ .track{grid-template-columns:repeat(2,1fr)} }
  .pc{text-align:left;width:100%;display:block;padding:0}
  .pth{position:relative;border-radius:9px;overflow:hidden;aspect-ratio:16/11}
  .hot{position:absolute;left:8px;top:8px;background:var(--or);color:#fff;font-size:10.5px;
       font-weight:700;padding:3px 9px;border-radius:5px}
  .pcat{display:inline-block;margin-top:9px;font-size:10.5px;color:var(--ink3);

  var R={main1:scMain1,main2:scMain2,list:scList,detail:scDetail,join:scJoin,joind:scJoinDone,login:scLogin,ask:function(){return scAsk(false);},asklock:function(){return scAsk(true);},cs:scCs,csdone:scCsDone,
         reg:function(){return scReg(false);},regm:function(){return scReg(true);}};

  function render(){
    var k=S.screen;
    $("#screen").innerHTML=R[k]();
    var m=META[k];
    $("#chip").textContent=m.chip; $("#sid").textContent=m.id;
    $("#note").textContent=m.note; $("#url").textContent=m.url;
    drawNav();
    var cb=document.querySelector(".chb"); if(cb) cb.scrollTop=cb.scrollHeight;
  }
  function chatBottom(){ var e=document.querySelector(".chb"); if(e) e.scrollTop=e.scrollHeight; }
  function go(k){ S.screen=k; render(); chatBottom(); window.scrollTo({top:0,behavior:"instant"}); }

  document.addEventListener("click",function(e){
    var el;
    if((el=e.target.closest("[data-jt]"))){
      var t=el.getAttribute("data-jt");
      if(t==="person"){ S.modal=true; render(); return; }
      S.jtype=t; S.jverified=false; render(); return;
    }
    if((el=e.target.closest("[data-warn]"))){ S.warn=false; render(); return; }
    if((el=e.target.closest("[data-faq]"))){
      var fi=Number(el.getAttribute("data-faq")); S.faq=(S.faq===fi?-1:fi); render(); return;
    }
    if((el=e.target.closest("[data-cst]"))){ S.cstype=el.getAttribute("data-cst"); render(); return; }
    if((el=e.target.closest("[data-keep]"))){ el.querySelector(".cb").classList.toggle("on"); return; }
    if((el=e.target.closest("[data-js]"))){ S.jstep=Number(el.getAttribute("data-js")); render(); return; }
    if(e.target.closest("[data-jv]")){ S.jverified=true; render(); return; }
    if(e.target.closest("[data-close]")){ S.modal=false; render(); return; }
    if((el=e.target.closest("[data-ag]"))){
      var k=el.getAttribute("data-ag");
      if(k==="all"){
        var on=!el.querySelector(".cb").classList.contains("on");
        el.querySelector(".cb").classList.toggle("on",on);
        Array.prototype.forEach.call(document.querySelectorAll(".agl .cb"),function(c){ c.classList.toggle("on",on); });
      } else { el.querySelector(".cb").classList.toggle("on"); }
      return;
    }
    var nb=e.target.closest(".nb");
    if(nb){ go(nb.getAttribute("data-s")); return; }
    var t=e.target.closest("[data-go],[data-open],[data-cat],[data-tab],[data-act],[data-t],[data-nav]");
    if(!t) return;
    if(t.hasAttribute("data-act")){
      var a=t.getAttribute("data-act");
      if(a==="openModal"){ go("regm"); return; }
      if(a==="closeModal"){ if(e.target.closest("[data-stop]") && !e.target.closest("[data-act='closeModal']")) return;
        go("reg"); return; }
      if(a==="confirmCancel"){ go("main2"); toast("등록이 취소되었습니다."); return; }
    }
    if(t.hasAttribute("data-go")){ go(t.getAttribute("data-go")); return; }
    if(t.hasAttribute("data-open")){ go("detail"); return; }
    if(t.hasAttribute("data-cat")){ e.preventDefault(); go("list"); toast(t.getAttribute("data-cat")+" 카테고리로 이동합니다."); return; }
    if(t.hasAttribute("data-tab")){ S.tab=t.getAttribute("data-tab"); render(); return; }
    if(t.hasAttribute("data-nav")){ e.preventDefault(); go("list"); return; }
    if(t.hasAttribute("data-t")){ toast(t.getAttribute("data-t")); return; }
  });
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape" && S.screen==="regm"){ go("reg"); }
  });

  render();
})();
</script>
