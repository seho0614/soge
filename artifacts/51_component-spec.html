<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}</style></head><body>
<title>소개뱅크 컴포넌트 스펙</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
  :root{
    /* 브랜드 · 서비스 · 액션 — 역할이 다르므로 절대 섞지 않습니다 */
    --brand:#7C3AED; --brand-d:#6D28D9; --brand-l:#F5F1FE; --brand-l2:#EDE7FC;
    --svc:#2563EB; --svc-d:#1D4ED8; --svc-l:#EFF6FF;
    --act:#F97316; --act-d:#EA580C; --act-l:#FFF7ED;
    /* 관 액센트 */
    --mny:#2563EB; --mal:#059669; --biz:#D97706;
    /* 시맨틱 */
    --ok:#059669; --ok-l:#ECFDF5; --warn:#D97706; --warn-l:#FFFBEB;
    --err:#DC2626; --err-l:#FEF2F2; --info:#2563EB; --info-l:#EFF6FF;
    /* 중립 */
    --navy:#1E293B; --ink:#0F172A; --ink2:#334155; --mut:#64748B; --mut2:#94A3B8;
    --line:#E2E8F0; --line2:#F1F5F9; --page:#F7F8FA; --card:#FFFFFF;
    --r-sm:7px; --r-md:10px; --r-lg:14px; --r-xl:18px;
    --sh-1:0 1px 2px rgba(15,23,42,.06);
    --sh-2:0 4px 14px rgba(15,23,42,.08);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#F1F5F9; --ink2:#CBD5E1; --mut:#94A3B8; --mut2:#64748B;
      --line:#22314F; --line2:#1B2947; --page:#0B1220; --card:#141E33; --navy:#CBD5E1;
      --brand-l:#1E1B33; --brand-l2:#251F42; --svc-l:#0F1E3A; --act-l:#2A1A0C;
      --ok-l:#0C2A20; --warn-l:#2A2008; --err-l:#2A1010; --info-l:#0F1E3A;
    }
  }
  :root[data-theme="dark"]{
    --ink:#F1F5F9; --ink2:#CBD5E1; --mut:#94A3B8; --mut2:#64748B;
    --line:#22314F; --line2:#1B2947; --page:#0B1220; --card:#141E33; --navy:#CBD5E1;
    --brand-l:#1E1B33; --brand-l2:#251F42; --svc-l:#0F1E3A; --act-l:#2A1A0C;
    --ok-l:#0C2A20; --warn-l:#2A2008; --err-l:#2A1010; --info-l:#0F1E3A;
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--ink);
    font-family:"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
    font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased}
  code,.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}
  button,input,select,textarea{font-family:inherit}

  /* ============ 히어로 ============ */
  .hero{background:linear-gradient(160deg,#2A1758 0%,#1E293B 62%,#0F172A 100%);color:#fff;padding:52px 0 42px}
  .wrap{max-width:1180px;margin:0 auto;padding:0 26px}
  @media (max-width:700px){ .wrap{padding:0 15px} }
  .eyebrow{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:.7px;color:#C4B5FD;
    background:rgba(124,58,237,.18);border:1px solid rgba(124,58,237,.42);border-radius:999px;padding:5px 13px}
  .hero h1{margin:16px 0 10px;font-size:37px;font-weight:900;letter-spacing:-1.2px;line-height:1.22}
  @media (max-width:700px){ .hero h1{font-size:26px} }
  .hero p{margin:0;max-width:740px;color:#CBD5E1;font-size:15px;line-height:1.8}
  .hero .pills{margin-top:22px;display:flex;flex-wrap:wrap;gap:8px}
  .pill{font-size:12px;font-weight:600;color:#E2E8F0;background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.14);border-radius:7px;padding:5px 11px}

  /* ============ 레이아웃 ============ */
  .body{display:grid;grid-template-columns:216px 1fr;gap:34px;align-items:start;padding-top:26px}
  @media (max-width:940px){ .body{grid-template-columns:1fr;gap:0} .toc{display:none} }
  .toc{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow-y:auto;padding-bottom:30px}
  .toc .g{padding:14px 0 5px;font-size:10px;font-weight:800;color:var(--mut2);letter-spacing:.8px;text-transform:uppercase}
  .toc a{display:block;padding:5px 10px;border-radius:7px;font-size:12.5px;color:var(--mut);
    text-decoration:none;border-left:2px solid transparent}
  .toc a:hover{background:var(--card);color:var(--ink)}
  .toc a.on{color:var(--brand);font-weight:700;border-left-color:var(--brand);background:var(--brand-l)}

  /* ============ 컴포넌트 문서 ============ */
  .cmp{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
    margin-bottom:18px;overflow:hidden;scroll-margin-top:16px}
  .chd{padding:17px 20px 14px;border-bottom:1px solid var(--line2)}
  .chd .r1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .cid{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:700;color:#fff;
    background:var(--navy);border-radius:6px;padding:3px 8px;letter-spacing:.3px}
  .chd h2{margin:0;font-size:19px;font-weight:900;letter-spacing:-.6px}
  .chd .en{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--mut2)}
  .chd p{margin:7px 0 0;font-size:13.5px;color:var(--mut);line-height:1.75;max-width:820px}

  .demo{padding:22px 20px;background:var(--page);border-bottom:1px solid var(--line2)}
  .demo .lb{font-size:10px;font-weight:800;color:var(--mut2);letter-spacing:.7px;margin-bottom:12px}
  .rowd{display:flex;flex-wrap:wrap;gap:11px;align-items:center}
  .cold{display:flex;flex-direction:column;gap:12px}

  .sec{padding:16px 20px;border-bottom:1px solid var(--line2)}
  .sec:last-child{border-bottom:0}
  .sec h3{margin:0 0 10px;font-size:11px;font-weight:800;color:var(--mut2);letter-spacing:.7px;text-transform:uppercase}

  .tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-md)}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px;background:var(--card)}
  th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line2);vertical-align:top}
  th{background:var(--page);font-size:10.5px;font-weight:800;color:var(--mut);letter-spacing:.4px;white-space:nowrap}
  tr:last-child td{border-bottom:0}
  td.k{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--brand);white-space:nowrap}
  td.v{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--mut)}

  .dd{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:700px){ .dd{grid-template-columns:1fr} }
  .dobox{border-radius:var(--r-md);padding:12px 14px;font-size:13px;line-height:1.7}
  .dobox.do{background:var(--ok-l);border:1px solid rgba(5,150,105,.26)}
  .dobox.dont{background:var(--err-l);border:1px solid rgba(220,38,38,.24)}
  .dobox .lb{font-size:10.5px;font-weight:800;letter-spacing:.5px;margin-bottom:5px;display:block}
  .dobox.do .lb{color:var(--ok)} .dobox.dont .lb{color:var(--err)}
  .dobox ul{margin:0;padding-left:16px} .dobox li{margin:3px 0}

  .a11y{font-size:13px;color:var(--ink2);line-height:1.85}
  .a11y code{background:var(--line2);padding:1.5px 6px;border-radius:5px;font-size:12px}
  .a11y b{color:var(--ink)}

  .note{background:var(--brand-l);border:1px solid var(--brand-l2);border-left:3px solid var(--brand);
    border-radius:0 var(--r-md) var(--r-md) 0;padding:11px 14px;font-size:13px;line-height:1.75;color:var(--ink2)}
  .note b{color:var(--ink)}

  /* ============ 실제 컴포넌트 (스펙 대상) ============ */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
    border:1px solid transparent;border-radius:var(--r-md);font-weight:700;
    padding:10px 18px;font-size:14px;line-height:1.2;cursor:pointer;transition:background .12s,border-color .12s}
  .btn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  .btn.pri{background:var(--brand);color:#fff}
  .btn.pri:hover{background:var(--brand-d)}
  .btn.sec{background:var(--card);color:var(--ink);border-color:var(--line)}
  .btn.sec:hover{border-color:var(--mut2)}
  .btn.gho{background:transparent;color:var(--mut)}
  .btn.gho:hover{color:var(--ink);background:var(--line2)}
  .btn.act{background:var(--act);color:#fff}
  .btn.act:hover{background:var(--act-d)}
  .btn.dgr{background:var(--card);color:var(--err);border-color:rgba(220,38,38,.34)}
  .btn.sm{padding:6px 12px;font-size:12.5px;border-radius:var(--r-sm)}
  .btn.lg{padding:13px 24px;font-size:15.5px;border-radius:var(--r-md)}
  .btn:disabled{opacity:.42;cursor:not-allowed}
  .btn.load{pointer-events:none;opacity:.8}
  .spin{width:13px;height:13px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;
    border-radius:50%;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  .fld{max-width:340px}
  .fld label{display:block;font-size:12.5px;font-weight:700;color:var(--mut);margin-bottom:5px}
  .fld label .rq{color:var(--err)}
  .inp{width:100%;border:1px solid var(--line);border-radius:var(--r-md);padding:10px 13px;
    background:var(--card);color:var(--ink);font-size:14px}
  .inp::placeholder{color:var(--mut2)}
  .inp:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:transparent}
  .inp.bad{border-color:var(--err);background:var(--err-l)}
  .inp:disabled{background:var(--line2);color:var(--mut2)}
  .hlp{font-size:11.5px;color:var(--mut2);margin-top:5px}
  .hlp.bad{color:var(--err)}
  .cnt{font-size:11px;color:var(--mut2);text-align:right;margin-top:4px}

  .tgl{width:44px;height:25px;border-radius:999px;background:var(--line);border:0;position:relative;cursor:pointer}
  .tgl::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;
    background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
  .tgl.on{background:var(--ok)} .tgl.on::after{left:22px}

  .chk{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer}
  .chk i{width:18px;height:18px;border:2px solid var(--line);border-radius:5px;display:grid;
    place-items:center;font-style:normal;font-size:11px;color:transparent;flex:none}
  .chk.on i{background:var(--brand);border-color:var(--brand);color:#fff}

  .bdg{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;
    border-radius:6px;padding:2.5px 8px;letter-spacing:-.1px;white-space:nowrap}
  .bdg.mny{background:var(--svc-l);color:var(--mny)}
  .bdg.mal{background:var(--ok-l);color:var(--mal)}
  .bdg.biz{background:var(--warn-l);color:var(--biz)}
  .bdg.ok{background:var(--ok-l);color:var(--ok)}
  .bdg.wa{background:var(--warn-l);color:var(--warn)}
  .bdg.er{background:var(--err-l);color:var(--err)}
  .bdg.nt{background:var(--line2);color:var(--mut)}
  .bdg.ac{background:var(--act-l);color:var(--act-d)}
  .bdg.br{background:var(--brand-l);color:var(--brand)}

  .chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--card);
    border-radius:999px;padding:5px 12px;font-size:12.5px;color:var(--ink2);cursor:pointer}
  .chip:hover{border-color:var(--mut2)}
  .chip.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
  .chip .x{opacity:.7;font-size:11px}

  .avt{width:38px;height:38px;border-radius:50%;background:var(--line2);display:grid;place-items:center;
    font-size:14px;font-weight:800;color:var(--mut);flex:none}
  .avt.v{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--ok)}

  .srch{display:flex;max-width:520px;border:2px solid var(--brand);border-radius:var(--r-md);overflow:hidden;background:var(--card)}
  .srch select{border:0;background:var(--brand-l);color:var(--brand);font-weight:700;font-size:13px;
    padding:0 10px;outline:none;cursor:pointer}
  .srch input{flex:1;border:0;padding:11px 13px;font-size:14px;background:transparent;color:var(--ink);outline:none}
  .srch button{border:0;background:var(--brand);color:#fff;padding:0 18px;font-weight:700;cursor:pointer}

  .rtab{display:inline-flex;gap:8px}
  .rtab button{border:1.5px solid var(--brand);background:var(--card);color:var(--brand);
    border-radius:var(--r-md);padding:9px 20px;font-size:14px;font-weight:700;cursor:pointer}
  .rtab button.on{background:var(--brand);color:#fff}

  .lcard{width:250px;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;
    background:var(--card);cursor:pointer;transition:box-shadow .15s,border-color .15s}
  .lcard:hover{border-color:var(--mut2);box-shadow:var(--sh-2)}
  .lcard .th{height:132px;background:linear-gradient(135deg,#3B2B1E,#1F1712);position:relative}
  .lcard .th .tag{position:absolute;left:9px;top:9px}
  .lcard .bd{padding:12px 13px}
  .lcard .ct{font-size:11px;color:var(--mut2);margin-bottom:3px}
  .lcard h4{margin:0 0 6px;font-size:14px;font-weight:800;letter-spacing:-.35px;line-height:1.45;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .lcard .pr{font-size:16px;font-weight:900;letter-spacing:-.5px;margin-bottom:7px}
  .lcard .mt{display:flex;gap:9px;font-size:11px;color:var(--mut2);padding-top:8px;border-top:1px dashed var(--line)}

  .fee{display:inline-flex;flex-direction:column;gap:2px;background:var(--act-l);
    border:1px solid rgba(249,115,22,.28);border-radius:var(--r-md);padding:9px 13px}
  .fee .a{font-size:15px;font-weight:900;color:var(--act-d);letter-spacing:-.4px}
  .fee .b{font-size:11px;color:var(--mut)}

  .trust{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);
    border-radius:var(--r-md);overflow:hidden;max-width:520px}
  .trust div{padding:11px 13px;border-right:1px solid var(--line2);text-align:center}
  .trust div:last-child{border-right:0}
  .trust b{display:block;font-size:17px;font-weight:900;letter-spacing:-.5px}
  .trust span{font-size:10.5px;color:var(--mut2)}

  .steps{display:flex;border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;max-width:640px}
  .steps div{flex:1;padding:9px 6px;text-align:center;font-size:12px;color:var(--mut2);
    border-right:1px solid var(--line2);background:var(--card)}
  .steps div:last-child{border-right:0}
  .steps div.dn{background:var(--ok-l);color:var(--ok);font-weight:700}
  .steps div.on{background:var(--act);color:#fff;font-weight:800}

  .cal{border-radius:var(--r-md);padding:12px 15px;font-size:13.5px;line-height:1.75;max-width:760px}
  .cal .lb{display:block;font-size:10.5px;font-weight:800;letter-spacing:.5px;margin-bottom:3px}
  .cal.i{background:var(--info-l);border:1px solid rgba(37,99,235,.24)} .cal.i .lb{color:var(--info)}
  .cal.w{background:var(--warn-l);border:1px solid rgba(217,119,6,.28)} .cal.w .lb{color:var(--warn)}
  .cal.e{background:var(--err-l);border:1px solid rgba(220,38,38,.25)} .cal.e .lb{color:var(--err)}
  .cal.s{background:var(--ok-l);border:1px solid rgba(5,150,105,.26)} .cal.s .lb{color:var(--ok)}

  .gnb{display:flex;align-items:center;gap:20px;padding:12px 16px;border:1px solid var(--line);
    border-radius:var(--r-md);background:var(--card);flex-wrap:wrap;max-width:760px}
  .gnb .lg{font-size:15px;font-weight:900;letter-spacing:-.5px}
  .gnb a{font-size:13px;color:var(--mut);text-decoration:none}
  .gnb a.on{font-weight:800}

  .tabbar{display:flex;border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;
    max-width:400px;background:var(--card)}
  .tabbar div{flex:1;padding:9px 4px;text-align:center;font-size:10.5px;color:var(--mut2);border-right:1px solid var(--line2)}
  .tabbar div:last-child{border-right:0}
  .tabbar div.on{color:var(--brand);font-weight:800}
  .tabbar div i{display:block;font-style:normal;font-size:15px;margin-bottom:1px}

  .empty{border:1px dashed var(--line);border-radius:var(--r-lg);padding:28px 20px;text-align:center;max-width:460px}
  .empty b{display:block;font-size:15px;font-weight:800;margin-bottom:5px}
  .empty span{display:block;font-size:13px;color:var(--mut);margin-bottom:14px;line-height:1.7}

  .modal{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--card);
    box-shadow:var(--sh-2);max-width:400px;overflow:hidden}
  .modal .mh{padding:16px 18px 0}
  .modal h4{margin:0 0 6px;font-size:16px;font-weight:800;letter-spacing:-.4px}
  .modal p{margin:0;font-size:13.5px;color:var(--mut);line-height:1.7}
  .modal .mf{display:flex;gap:8px;padding:16px 18px}
  .modal .mf .btn{flex:1}

  .toastx{display:inline-flex;align-items:center;gap:8px;background:var(--navy);color:var(--card);
    font-size:13px;font-weight:600;padding:10px 18px;border-radius:var(--r-md)}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .toastx{background:#334155;color:#F1F5F9} }

  .gate{border:1px solid rgba(217,119,6,.3);background:var(--warn-l);border-radius:var(--r-md);
    padding:13px 16px;max-width:560px}
  .gate b{display:block;font-size:13.5px;font-weight:800;margin-bottom:3px}
  .gate span{display:block;font-size:12.5px;color:var(--mut);line-height:1.7;margin-bottom:11px}

  .actbar{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-top-width:2px;
    border-radius:var(--r-md);background:var(--card);padding:11px 14px;max-width:460px}
  .actbar .ic{width:38px;height:38px;border:1px solid var(--line);border-radius:9px;display:grid;
    place-items:center;font-size:16px;color:var(--mut)}
  .actbar .btn{flex:1}

  .pag{display:inline-flex;gap:4px}
  .pag button{min-width:34px;height:34px;border:1px solid var(--line);background:var(--card);
    border-radius:var(--r-sm);font-size:13px;color:var(--ink2);cursor:pointer}
  .pag button.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:800}

  .ftr{border:1px solid var(--line);border-radius:var(--r-md);background:var(--card);padding:14px 16px;
    font-size:12px;color:var(--mut);line-height:1.85;max-width:760px}
  .ftr .lk{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:9px}
  .ftr .lk a{font-size:12.5px;color:var(--ink2);text-decoration:none;font-weight:700}
  .ftr .lk a.hi{color:var(--ink);text-decoration:underline}
  .ftr .tbd{color:var(--act-d);font-weight:700}
  .ftr .lg2{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);color:var(--ink2)}

  /* 토큰 표 */
  .swrow{display:flex;flex-wrap:wrap;gap:9px}
  .sw{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:var(--r-md);
    padding:7px 11px;background:var(--card);font-size:12px}
  .sw i{width:20px;height:20px;border-radius:6px;display:block;flex:none}
  .sw b{font-weight:700} .sw span{color:var(--mut2);font-family:"IBM Plex Mono",monospace;font-size:11px}

  .rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
  .rule{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px}
  .rule b{display:block;font-size:13.5px;font-weight:800;margin-bottom:4px}
  .rule span{font-size:12.5px;color:var(--mut);line-height:1.7}
  .rule .n{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--brand);font-weight:700}

  h2.sect{margin:34px 0 6px;font-size:22px;font-weight:900;letter-spacing:-.8px}

            c.dont.map(function(x){return '<li>'+esc(x)+'</li>';}).join("")+'</ul></div>'+
        '</div></div>'+
        '<div class="sec"><h3>접근성</h3><div class="a11y">'+c.a11y+'</div></div>'+
      '</section>';
    });

    h+='<div class="note" style="margin:22px 0 60px"><b>이 문서에 없는 것</b> — '+
      '차트 · 캘린더 · 트리 · 리치 에디터는 아직 화면에 없어 넣지 않았습니다. '+
      '필요해지는 순간에 스펙을 쓰는 것이, 미리 만들어 두고 쓰지 않는 것보다 낫습니다. '+
      '토큰 정의와 원칙은 <b>디자인 시스템 문서</b>, 화면별 적용은 <b>화면설계서</b>를 참조합니다.</div>';

    $("#doc").innerHTML=h;

    var toc="", lg="";
    C.forEach(function(c){
      if(c.g!==lg){ lg=c.g; toc+='<div class="g">'+esc(c.g)+'</div>'; }
      toc+='<a href="#'+c.id+'" data-t="'+c.id+'">'+esc(c.n)+'</a>';
    });
    $("#toc").innerHTML=toc;
  }
  build();

  /* 데모 인터랙션 */
  document.addEventListener("click", function(e){
    var t=e.target.closest(".tgl"); if(t){ t.classList.toggle("on"); return; }
    var k=e.target.closest(".chk"); if(k){ k.classList.toggle("on"); return; }
    var c=e.target.closest(".chip"); if(c && !c.classList.contains("x")){ c.classList.toggle("on"); return; }
    var r=e.target.closest("[data-rt]");
    if(r){
      Array.prototype.forEach.call(r.parentNode.children, function(b){ b.classList.remove("on"); });
      r.classList.add("on");
      $("#rtnote").textContent = r.getAttribute("data-rt")==="give"
        ? "판매자가 소개비를 부담합니다 · 등록된 물건을 소개해 수익을 얻습니다"
        : "구매자가 소개비를 부담합니다 · 원하는 것을 올리면 소개자가 찾아줍니다";
      return;
    }
  });

  /* TOC 하이라이트 */
  var obs=new IntersectionObserver(function(es){
    es.forEach(function(en){
      if(!en.isIntersecting) return;
      var a=document.querySelector('#toc a[data-t="'+en.target.id+'"]');
      if(!a) return;
      Array.prototype.forEach.call(document.querySelectorAll("#toc a"), function(x){ x.classList.remove("on"); });
      a.classList.add("on");
    });
  }, {rootMargin:"-10% 0px -80% 0px"});
  Array.prototype.forEach.call(document.querySelectorAll(".cmp"), function(el){ obs.observe(el); });
})();
</script>

</body></html>
