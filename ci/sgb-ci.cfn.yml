# 소개뱅크 CI(A안 · sgb-core docs/271 · 2026-11-02)
#   ① 풀 리퀘스트 자동 점검(sgb-core · sgb-infra → main) — 결과 댓글 · 통과면 승인 표시(승인 규칙 sgb-ci-must-pass 가 봄)
#   ② main 이 바뀌면 운영용 킷을 S3 에(덮어쓰지 않음)
#   운영 서버 · 운영 RDS 에는 아무것도 하지 않습니다(운영 반영은 사람 · 대표 승인 뒤).
#   만드는 사람: 대표(AWS 콘솔 → CloudFormation → 스택 생성 · 서울 리전). 지우면 아래 자원이 모두 지워집니다(버킷은 남김).
AWSTemplateFormatVersion: '2010-09-09'
Description: SoGaeBank CI - PR checks and release kit build (no deploy)

Parameters:
  KitBucketName:
    Type: String
    Description: 킷을 둘 새 S3 버킷 이름(전 세계에서 유일 · 소문자 · 숫자 · -)
    AllowedPattern: '^[a-z0-9][a-z0-9-]{2,62}$'
  BuildImage:
    Type: String
    Default: aws/codebuild/standard:7.0
    Description: CodeBuild 이미지(Node 22 를 지원하는 판 · 바뀔 수 있음)

Resources:
  KitBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref KitBucketName
      VersioningConfiguration: { Status: Enabled }
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      BucketEncryption:
        ServerSideEncryptionConfiguration: [ { ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } } ]
      LifecycleConfiguration:
        Rules:
          - { Id: kits-old-versions, Status: Enabled, Prefix: kits/, NoncurrentVersionExpiration: { NoncurrentDays: 30 } }

  # 점검용 — 풀 리퀘스트 코드를 돌리므로 S3 쓰기 권한이 없습니다.
  PrCheckRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: sgb-ci-pr-check
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [ { Effect: Allow, Principal: { Service: codebuild.amazonaws.com }, Action: sts:AssumeRole } ]
      Policies:
        - PolicyName: pr-check
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [ logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents ]
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/sgb-pr-check*
              - Effect: Allow
                Action: [ codecommit:GitPull, codecommit:GetPullRequest, codecommit:PostCommentForPullRequest, codecommit:UpdatePullRequestApprovalState ]
                Resource:
                  - !Sub arn:aws:codecommit:${AWS::Region}:${AWS::AccountId}:sgb-core
                  - !Sub arn:aws:codecommit:${AWS::Region}:${AWS::AccountId}:sgb-infra

  # 킷용 — main 만 읽고 S3 kits/ 에만 씁니다.
  KitBuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: sgb-ci-kit-build
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [ { Effect: Allow, Principal: { Service: codebuild.amazonaws.com }, Action: sts:AssumeRole } ]
      Policies:
        - PolicyName: kit-build
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [ logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents ]
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/sgb-kit-build*
              - Effect: Allow
                Action: [ codecommit:GitPull ]
                Resource:
                  - !Sub arn:aws:codecommit:${AWS::Region}:${AWS::AccountId}:sgb-core
                  - !Sub arn:aws:codecommit:${AWS::Region}:${AWS::AccountId}:sgb-infra
                  - !Sub arn:aws:codecommit:${AWS::Region}:${AWS::AccountId}:sgb-adx
              - Effect: Allow
                Action: [ s3:PutObject, s3:GetObject ]
                Resource: !Sub arn:aws:s3:::${KitBucketName}/kits/*
              - Effect: Allow
                Action: [ s3:ListBucket ]
                Resource: !Sub arn:aws:s3:::${KitBucketName}
                Condition: { StringLike: { 's3:prefix': [ 'kits/*' ] } }

  PrCheckProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: sgb-pr-check
      Description: 풀 리퀘스트 자동 점검(형 검사 · 마이그레이션 · 불변식 · 권한) — docs/271
      ServiceRole: !GetAtt PrCheckRole.Arn
      TimeoutInMinutes: 40
      ConcurrentBuildLimit: 2
      Artifacts: { Type: NO_ARTIFACTS }
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_MEDIUM
        Image: !Ref BuildImage
        PrivilegedMode: true          # 버리는 PostgreSQL 16 컨테이너를 띄우려고
      LogsConfig: { CloudWatchLogs: { Status: ENABLED } }
      Source:
        Type: NO_SOURCE
        BuildSpec: |
          version: 0.2
          phases:
            install:
              runtime-versions: { nodejs: 22 }
              commands:
                - apt-get update -qq && apt-get install -y -qq postgresql-client >/dev/null
            build:
              commands:
                - git config --global credential.helper '!aws codecommit credential-helper $@' && git config --global credential.UseHttpPath true
                - git clone -q --depth 1 --branch main https://git-codecommit.ap-northeast-2.amazonaws.com/v1/repos/sgb-infra ci-tools
                - bash ci-tools/ci/pr-check.sh

  KitBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: sgb-kit-build
      Description: main 이 바뀌면 운영용 킷(zip · tar.gz · sha256)을 S3 에 — 덮어쓰지 않음 · 배포 안 함 — docs/271
      ServiceRole: !GetAtt KitBuildRole.Arn
      TimeoutInMinutes: 20
      ConcurrentBuildLimit: 1
      Artifacts: { Type: NO_ARTIFACTS }
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: !Ref BuildImage
        EnvironmentVariables: [ { Name: KIT_BUCKET, Value: !Ref KitBucketName } ]
      LogsConfig: { CloudWatchLogs: { Status: ENABLED } }
      Source:
        Type: NO_SOURCE
        BuildSpec: |
          version: 0.2
          phases:
            build:
              commands:
                - git config --global credential.helper '!aws codecommit credential-helper $@' && git config --global credential.UseHttpPath true
                - git clone -q --depth 1 --branch main https://git-codecommit.ap-northeast-2.amazonaws.com/v1/repos/sgb-infra ci-tools
                - bash ci-tools/ci/kit-build.sh

  EventsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: sgb-ci-events
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [ { Effect: Allow, Principal: { Service: events.amazonaws.com }, Action: sts:AssumeRole } ]
      Policies:
        - PolicyName: start-builds
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: codebuild:StartBuild
                Resource: [ !GetAtt PrCheckProject.Arn, !GetAtt KitBuildProject.Arn ]

  PrRule:
    Type: AWS::Events::Rule
    Properties:
      Name: sgb-ci-pr
      Description: main 으로 가는 풀 리퀘스트가 열리거나 고쳐지면 점검
      EventPattern:
        source: [ aws.codecommit ]
        detail-type: [ CodeCommit Pull Request State Change ]
        resources:
          - !Sub arn:aws:codecommit:${AWS::Region}:${AWS::AccountId}:sgb-core
          - !Sub arn:aws:codecommit:${AWS::Region}:${AWS::AccountId}:sgb-infra
        detail:
          event: [ pullRequestCreated, pullRequestSourceBranchUpdated ]
          destinationReference: [ refs/heads/main ]
      Targets:
        - Id: pr-check
          Arn: !GetAtt PrCheckProject.Arn
          RoleArn: !GetAtt EventsRole.Arn
          InputTransformer:
            InputPathsMap:
              pr: '$.detail.pullRequestId'
              repo: '$.detail.repositoryNames[0]'
            InputTemplate: '{"environmentVariablesOverride":[{"name":"PR_ID","value":<pr>,"type":"PLAINTEXT"},{"name":"REPO","value":<repo>,"type":"PLAINTEXT"}]}'

  MainRule:
    Type: AWS::Events::Rule
    Properties:
      Name: sgb-ci-main
      Description: 세 저장소 main 이 바뀌면 킷 만들기
      EventPattern:
        source: [ aws.codecommit ]
        detail-type: [ CodeCommit Repository State Change ]
        resources:
          - !Sub arn:aws:codecommit:${AWS::Region}:${AWS::AccountId}:sgb-core
          - !Sub arn:aws:codecommit:${AWS::Region}:${AWS::AccountId}:sgb-infra
          - !Sub arn:aws:codecommit:${AWS::Region}:${AWS::AccountId}:sgb-adx
        detail:
          event: [ referenceUpdated ]
          referenceType: [ branch ]
          referenceName: [ main ]
      Targets:
        - { Id: kit-build, Arn: !GetAtt KitBuildProject.Arn, RoleArn: !GetAtt EventsRole.Arn }

Outputs:
  PrCheckRoleArn:
    Value: !GetAtt PrCheckRole.Arn
    Description: 승인 규칙 sgb-ci-must-pass 의 승인자(절차서 docs/271 3-3)
  KitBucket:
    Value: !Ref KitBucket
