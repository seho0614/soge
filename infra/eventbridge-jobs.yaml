AWSTemplateFormatVersion: '2010-09-09'
Description: >
  소개뱅크 배치 스케줄.

  ── 스케줄은 하나입니다 ────────────────────────────────────────────
  EventBridge 는 매분 /admin/jobs/tick 만 부릅니다.
  무엇을 언제 돌릴지는 **DB(job_schedules)가 정합니다.**

  전에는 배치마다 스케줄을 하나씩 뒀습니다. 그러면 주기를 바꿀 때마다
  스택을 다시 배포해야 하고, 배치를 새로 만들면 스케줄 추가를 잊습니다.
  잊으면 그 배치는 영원히 안 도는데 오류도 나지 않습니다.

  이제 주기는 SQL 한 줄로 바뀝니다:
    UPDATE job_schedules SET every_min = 30 WHERE job = 'notify_dispatch';

  ── 매분 불러도 안전합니다 ─────────────────────────────────────────
  같은 시간대의 같은 작업은 job_runs 의 UNIQUE (job, slot) 때문에
  한 번만 실행됩니다. 스케줄러가 둘이어도 마찬가지입니다.

  ── 확인 ───────────────────────────────────────────────────────────
  aws scheduler list-schedules --group-name sgb-jobs     # 1건
  psql -c "SELECT * FROM v_job_stale;"                   # 0행이어야 정상

Parameters:
  ApiEndpoint:
    Type: String
    Description: API 주소 (끝에 / 없이)
  JobTokenArn:
    Type: String
    Description: >
      JOB_TOKEN 이 든 Secrets Manager ARN.
      사람 계정의 JWT 를 쓰지 마십시오 — 만료되면 배치가 조용히 멈추고,
      새면 관리자 전 권한이 넘어갑니다. 이 토큰으로는 job 실행만 됩니다.
  TimeZone:
    Type: String
    Default: Asia/Seoul

Resources:

  JobGroup:
    Type: AWS::Scheduler::ScheduleGroup
    Properties:
      Name: sgb-jobs

  # 스케줄러가 API 를 부를 때 쓰는 역할.
  # Secrets Manager 읽기와 Lambda 호출만 허용합니다.
  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: invoke-job-api
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt JobInvoker.Arn

  # EventBridge Scheduler 는 HTTP 를 직접 못 부릅니다(API Destination 은
  # Rules 쪽 기능입니다). 얇은 Lambda 하나를 두고 그것이 POST 합니다.
  # 로직은 전부 서버에 있으므로 이 함수는 호출만 합니다.
  JobInvoker:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: sgb-job-invoker
      Runtime: nodejs22.x
      Handler: index.handler
      Timeout: 300          # settlement_audit 가 길 수 있습니다
      Role: !GetAtt InvokerRole.Arn
      Environment:
        Variables:
          API_ENDPOINT: !Ref ApiEndpoint
          JOB_TOKEN_ARN: !Ref JobTokenArn
      Code:
        ZipFile: |
          const { SecretsManagerClient, GetSecretValueCommand } =
            require('@aws-sdk/client-secrets-manager');
          const sm = new SecretsManagerClient({});
          let cached = null;

          exports.handler = async (event) => {
            const job = event.job;
            const isTick = event.tick === true;
            if (!job && !isTick) throw new Error('job 또는 tick 이 지정되지 않았습니다');
            const path = isTick ? '/api/v1/admin/jobs/tick' : '/api/v1/admin/jobs/run';

            if (!cached) {
              const r = await sm.send(new GetSecretValueCommand({
                SecretId: process.env.JOB_TOKEN_ARN }));
              cached = JSON.parse(r.SecretString).JOB_TOKEN;
            }

            const res = await fetch(`${process.env.API_ENDPOINT}${path}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'X-Job-Token': cached },
              body: isTick ? undefined : JSON.stringify({ job }),
            });
            const body = await res.text();

            // 실패를 삼키지 않습니다. 던져야 CloudWatch 알람이 웁니다 —
            // 조용히 넘어가면 배치가 안 도는 것을 아무도 모릅니다.
            const label = isTick ? 'tick' : job;
            if (!res.ok) throw new Error(`${label} 실패 (HTTP ${res.status}): ${body.slice(0, 300)}`);
            console.log(`${label} ok`, body.slice(0, 500));
            return { job: label, status: res.status };
          };

  InvokerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: read-job-token
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref JobTokenArn

  # ── 유일한 스케줄 ─────────────────────────────────────────────────
  # 위 11개 대신 이것 하나만 둬도 됩니다.
  # 무엇을 언제 돌릴지는 DB(job_schedules)가 정하므로,
  # 주기를 바꾸는 데 스택 재배포가 필요 없습니다.
  #
  # 매분 불러도 안전합니다 — 같은 시간대의 같은 작업은
  # DB 유일 제약 때문에 한 번만 실행됩니다.
  #
  # 위 11개와 이것을 **같이 둬도 중복 실행되지 않습니다.**
  # 옮겨가는 중이라면 둘 다 켜 두고 확인한 뒤 하나를 끄십시오.
  Tick:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: sgb-tick
      GroupName: !Ref JobGroup
      Description: 지금 돌아야 할 배치 실행 (DB 가 주기를 정합니다)
      ScheduleExpression: rate(1 minute)
      ScheduleExpressionTimezone: !Ref TimeZone
      FlexibleTimeWindow: { Mode: 'OFF' }
      Target:
        Arn: !GetAtt JobInvoker.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"tick":true}'
        # 재시도하지 않습니다. 1분 뒤 어차피 다시 부릅니다 —
        # 재시도가 겹치면 로그만 지저분해집니다.
        RetryPolicy: { MaximumRetryAttempts: 0 }

  # ── 실패 알람 ─────────────────────────────────────────────────────
  # Lambda 가 예외를 던지면 여기서 웁니다.
  # 이것이 없으면 배치가 멈춘 것을 아무도 모릅니다.
  JobFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: sgb-job-failure
      AlarmDescription: 정기 작업 실패 — 매출·개인정보에 직결됩니다
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref JobInvoker
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # 위 알람은 "실패"를 보지 "멈춤"을 못 봅니다.
  # 아예 안 불리는 경우를 따로 봅니다.
  TickSilentAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: sgb-tick-silent
      AlarmDescription: 15분 동안 배치 호출이 한 번도 없습니다 — 스케줄러가 멈췄습니다
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions:
        - Name: FunctionName
          Value: !Ref JobInvoker
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching

Outputs:
  ScheduleCount:
    Description: 등록된 스케줄 수 (11이어야 합니다)
    Value: '11'
  Verify:
    Description: 확인 명령
    Value: aws scheduler list-schedules --group-name sgb-jobs --query 'length(Schedules)'
